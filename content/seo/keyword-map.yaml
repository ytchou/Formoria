# Formoria keyword ownership map — DEV-1354
#
# One row per keyword cluster, one owning page per cluster. This file is the
# single source of truth for "which page is allowed to target this query".
# Schema, loader and priority derivation: src/lib/seo/keyword-map.ts.
# Invariants enforced in CI: src/lib/seo/keyword-map-invariants.test.ts.
#
# ---------------------------------------------------------------------------
# HOW brand_count WAS PRODUCED
# ---------------------------------------------------------------------------
# Every brand_count below comes from `pnpm seo:counts` run against the live
# Supabase project on 2026-08-06, using the SAME exclusion the public surfaces
# use: status = 'approved' minus the e2e test-brand name pattern
# (src/lib/services/public-brand-filter.ts). is_demo is deliberately NOT
# excluded — no public listing or count filters on it. Total: 718 brands.
# l2-category counts are scoped to the brand's own product_type, matching
# getSubcategoryCounts and `/brands?category=…`: a fashion brand tagged 手鍊
# does not count toward the jewelry subcategory it would never render on.
# data/formoria-seed.csv (139 rows) is STALE and was NOT used for any count.
#
# ---------------------------------------------------------------------------
# PRIORITY IS DERIVED, NEVER HAND-ASSIGNED
# ---------------------------------------------------------------------------
# priority = derivePriority({ brand_count, intent_fit, differentiation }), i.e.
#
#     bucket = 3 if brand_count >= 20
#              2 if brand_count >= 10
#              1 if brand_count >= 5
#              0 otherwise
#     score  = bucket + intent_fit + differentiation      (range 2..9)
#
#     score >= 9 -> P0
#     score >= 7 -> P1
#     score >= 5 -> P2
#     else       -> P3
#
# The `priority` field in each row is a redundant, test-asserted copy of that
# computation. If you change intent_fit or differentiation, recompute it — the
# invariant suite fails otherwise.
#
# ---------------------------------------------------------------------------
# SCORING RUBRIC (applied in one sitting, 2026-08-06)
# ---------------------------------------------------------------------------
# intent_fit — does a brand-set page answer the query the searcher actually has?
#   3  The query IS "which brands exist in this space". A directory/category
#      page is the best possible result.
#   2  Mixed SERP: the searcher may want a brand list, but product listings,
#      reviews or retailer pages are equally plausible answers.
#   1  The query wants a fact or a specific product, not a brand set.
#
# differentiation — can Formoria hold the position with data no one else has?
#   3  Deep brand set (structured, verification-tiered) with no incumbent that
#      lists the same brands together.
#   2  Real but partial advantage: the set is good, or the SERP is contested by
#      strong editorial/retail incumbents.
#   1  Commodity SERP owned by marketplaces and affiliate content; a directory
#      page adds little.
#
# ---------------------------------------------------------------------------
# DEFERRED TO WAVE A2 (deliberately absent from this file)
# ---------------------------------------------------------------------------
# Five scoring inputs are NOT in this map and must not be faked:
#   1. GSC impressions per query
#   2. GSC average position per query
#   3. Keyword competition / difficulty (third-party)
#   4. Current page performance (clicks, CTR) for pages that already exist
#   5. Absolute monthly search volume (third-party keyword tool)
# Until wave A2 supplies them, prioritisation runs on supply (brand_count) and
# editorial judgment (intent_fit, differentiation) only. That is a deliberate,
# stated limitation, not an oversight.
#
# ---------------------------------------------------------------------------
# SYNONYM vs MULTI-INTENT (the `composite` field)
# ---------------------------------------------------------------------------
# 57 of the 160 ontology subcategories have a middle-dot (・) name.
# Each is classified exactly once, here or in unmapped_backlog:
#
#   composite: synonym       (19 rows)
#     The two terms name ONE intent — one is a subset, an alias, or a rewording
#     of the other, and a searcher using either would accept the same brand set.
#     Example: 皮夾・錢包, 陶瓷・陶藝, 涼鞋・拖鞋, 甜點・糕點.
#     Eligible like any other row; one page legitimately owns both terms.
#
#   composite: multi-intent  (38 rows)
#     The two terms name genuinely DIFFERENT products that happen to share a
#     slug. Example: 香氛・蠟燭, 鑰匙圈・吊飾, 體驗課程・DIY材料, 茶包・茶飲.
#     These carry eligibility: reject-taxonomy and NO target_url. The schema
#     refuses multi-intent + launch. Unblocked by the ontology split: DEV-1361.
#
#   composite: none
#     Single-term subcategory name.
#
# ---------------------------------------------------------------------------
# ANCHORING RULE
# ---------------------------------------------------------------------------
# l1-category and l2-category rows key off `ontology_slug` (kebab-case ASCII,
# resolvable via subcategoryBySlug / PRODUCT_TYPE_CATEGORIES) — NEVER off a raw
# product_tags string. 445 distinct tags are in use against 160 ontology
# entries, so a tag-keyed URL space would be uncontrolled. Raw tags may appear
# only as secondary_keywords.
#
# ---------------------------------------------------------------------------
# unmapped_backlog PROMOTION RULE
# ---------------------------------------------------------------------------
# A backlog row is promoted to a cluster when BOTH hold:
#   (a) brand_count >= 15, and
#   (b) the subcategory is single-intent (composite: none or synonym).
# A multi-intent row is never promoted by brand growth alone — it is unblocked
# only by the DEV-1361 ontology split.
#
# ---------------------------------------------------------------------------
# CANNIBALIZATION RISKS ON RECORD (detailed in the relevant rows' notes)
# ---------------------------------------------------------------------------
#   1. topic hubs (台灣文創/工藝/手作/設計品牌) vs the crafts L1 vs stories
#      — the highest-risk overlap, and the reason Ticket C is sequenced last.
#   2. homepage vs /brands on 台灣品牌 / 台灣品牌目錄.
#   3. ?sub= views currently folding into their L1 page — Ticket B must
#      reposition them before /categories/[l1]/[l2] ships.
#   4. glossary terms vs informational story content on 台灣品牌是什麼 and
#      MIT 是什麼.

