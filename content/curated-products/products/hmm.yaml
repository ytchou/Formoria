# Every fact below is taken from HMM's own product pages on hmmproject.com and
# nothing else. Anything the first-party page does not state is left unset.
#
# name_zh carries HMM's own English product name: hmmproject.com serves no
# zh-TW storefront (a /zh path 404s and ?locale=zh-TW returns the English
# title), so no official Chinese product name exists to cite. Translating it
# here would invent a name the brand does not use.
