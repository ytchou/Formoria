# 小空間閱讀角落 — selections (DEV-1404 pilot).
#
# trail_slug must equal this file's name: the CLI derives the known trail set
# from the selection filenames, so a mismatch is reported as an unknown trail
# rather than silently creating one.
#
# Each rationale states what the product does in a small reading corner, keeps
# HMM's own sourced facts separate from Formoria's judgment, and makes no
# claim about certification, efficacy, commercial terms, or a guarantee.
trail_slug: small-space-reading-corner

selections:
  - product: hmm/clip
    section_key: desk-companions
    position: 1
    rationale_zh: 官方產品頁說明它可夾住約 40 張 A4 紙，反向放置能當便條座，纖薄的外型也可以當書籤。我們的判斷是：閱讀角落最常缺的不是收納，而是「暫停」的地方——闔上書時它是書籤，攤開書時它把抄下的紙條夾在旁邊，一個物件收掉兩種零件。
  - product: hmm/paperweight
    section_key: desk-companions
    position: 2
    rationale_zh: 官方產品頁載明鋁合金銑削、Ø50×25mm、重 101g，並說明可兼作筆座。我們的判斷是：小空間的閱讀多半發生在餐桌或矮几上，書頁與便條需要一個壓得住的重量；它站起來就是筆座，佔的面積大約一個杯墊，不必為了兩種用途各留一塊桌面。
  - product: hmm/clip-memo-board
    section_key: desk-companions
    position: 3
    rationale_zh: 官方產品頁載明以多層厚紙板與日本畫紙製成、板身 105×140×8mm，搭配 Clip 即成口袋尺寸的寫字板，且本身不含 Clip。我們的判斷是：讀到想抄一句話時，翻出筆記本的動作太長；一塊 A6 大小的板子可以立在書旁，讀完再把便條收進書裡，不會在小空間裡多留一疊紙。
