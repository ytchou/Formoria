<!doctype html>
<html lang="en">
  <head>
    <title>Title tag that must lose to Open Graph</title>
    <meta property="og:title" content="Studio Kiln Everyday Mug" />
    <meta property="og:description" content="A stackable mug for daily use." />
    <meta property="og:image" content="https://cdn.example.com/media/og-mug.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Studio Kiln Company Limited",
        "url": "https://studio-kiln.example.com"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Tableware Breadcrumb Entry",
            "item": "https://studio-kiln.example.com/tableware"
          }
        ]
      }
    </script>
  </head>
  <body>
    <h1>Studio Kiln Everyday Mug</h1>
  </body>
</html>
