[project]
name = "formoria-ltr"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "lightgbm>=4.7",
  "onnxmltools>=1.16",
  "onnxruntime>=1.30",
  "numpy",
  "pandas",
  "scikit-learn",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ltr"]

[tool.pytest.ini_options]
testpaths = ["__tests__"]
