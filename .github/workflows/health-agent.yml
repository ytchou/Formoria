        continue-on-error: true
        env:
          REPAIR_RESULT: ${{ steps.repair-1.outputs.structured_output }}
        run: |
          # A silent refusal is otherwise indistinguishable from a crash or a
          # no-op: the step reports success, edits nothing, and the reason dies
          # with the transcript (show_full_output is false). Persist the agent's
          # own per-finding ledger so validate can name it (DEV-1435).
          scripts/health-agent/capture-repair-result.sh 1 "$HEALTH_ARTIFACT_DIR/repair-result-1.json"
      - name: "Stage 4 · Self-heal — validate cycle 1"
        id: validate-1
        if: steps.admission.outputs.claimed == 'true' && steps.repair-1.outcome == 'success'
        continue-on-error: true
        run: |
          # Discard edits outside the claim before anything reads the working
          # tree. `pnpm lint` and `tsc` below are repo-wide, so a stray edit to
          # an unclaimed file fails validation on a file the run never had
          # permission to touch (run 31472080866).
          scripts/health-agent/enforce-repair-scope.sh "$HEALTH_ARTIFACT_DIR/manager-metadata.json" human
          # Re-run the detector and assert the *claimed* findings are gone. Bare
          # `pnpm knip` here demanded a repo-wide clean bill of health for a
          # repair scoped to at most HEALTH_REPAIR_CLAIM_LIMIT findings, so it
          # could never pass while a backlog existed.
          if jq -e '.findings[] | select(.fingerprint | startswith("quality:"))' "$HEALTH_ARTIFACT_DIR/manager-snapshot.json" >/dev/null; then
            pnpm exec tsx scripts/health-agent/quality-runtime.ts \
              --output "$HEALTH_ARTIFACT_DIR/quality-recheck-1.json" \
              --run-at "${{ steps.setup.outputs.run_at }}"
            scripts/health-agent/verify-claimed-findings.sh \
              "$HEALTH_ARTIFACT_DIR/manager-snapshot.json" \
              "$HEALTH_ARTIFACT_DIR/quality-recheck-1.json" \
              "$HEALTH_ARTIFACT_DIR/repair-result-1.json"
          fi
          pnpm exec vitest run scripts/health-agent
          pnpm lint
          pnpm exec tsc --noEmit --incremental false
          scripts/health-agent/validate-repair-patch.sh "$HEALTH_ARTIFACT_DIR/manager-metadata.json" human
      - name: "Stage 4 · Self-heal — independent review cycle 1"
        id: review-1
        if: steps.admission.outputs.claimed == 'true' && steps.validate-1.outcome == 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read .github/health-agent/review.md. Review the current diff against
            .health-agent-artifacts/manager-snapshot.json. This is read-only; do not edit files,
            access providers, commit, push, open, or merge a PR.
          claude_args: >-
            --max-turns 60 --allowedTools Read,Glob,Grep,Bash(git diff:*),Bash(git status:*)
            --json-schema '{"type":"object","required":["cycle","verdict","review_state","auto_merge_enabled","merged","findings"],"properties":{"cycle":{"const":1},"verdict":{"const":"pass"},"review_state":{"const":"passed"},"auto_merge_enabled":{"const":false},"merged":{"const":false},"findings":{"type":"array","items":{"type":"object","required":["fingerprint","verdict","review_state"],"properties":{"fingerprint":{"type":"string","pattern":"^(cron|directory|link|quality|sentry):"},"verdict":{"const":"pass"},"review_state":{"const":"passed"}}}}}}'
      - name: "Stage 4 · Self-heal — review decision cycle 1"
        id: review-decision-1
        if: steps.admission.outputs.claimed == 'true' && steps.review-1.outcome == 'success'
        continue-on-error: true
        env:
          REVIEW_RESULT: ${{ steps.review-1.outputs.structured_output }}
        run: |
          jq -e --argjson review "$REVIEW_RESULT" '
            ($review.verdict == "pass") and ($review.review_state == "passed") and
            ($review.auto_merge_enabled == false) and ($review.merged == false) and
            (([.findings[].fingerprint] | sort) == ([$review.findings[].fingerprint] | sort)) and
            ([$review.findings[] | select(.verdict != "pass" or .review_state != "passed")] | length == 0)
          ' "$HEALTH_ARTIFACT_DIR/manager-snapshot.json" >/dev/null || {
            # Exiting 1 with no output made a skipped publish unexplainable:
            # the run went green with no PR and nothing said why. The most
            # common cause is the reviewer labelling findings by file path
            # instead of copying the snapshot fingerprint.
            echo "::error::Review decision rejected the reviewer's result" >&2
            jq -n --argjson review "$REVIEW_RESULT" --slurpfile snap "$HEALTH_ARTIFACT_DIR/manager-snapshot.json" '{
              verdict: $review.verdict,
              review_state: $review.review_state,
              only_in_review: ([$review.findings[].fingerprint] - [$snap[0].findings[].fingerprint]),
              only_in_snapshot: ([$snap[0].findings[].fingerprint] - [$review.findings[].fingerprint])
            }' >&2
            exit 1
          }
      - name: "Stage 4 · Self-heal — repair cycle 2"
        id: repair-2
        if: >-
          steps.admission.outputs.claimed == 'true' &&
          steps.repair-1.outcome == 'success' &&
          (steps.validate-1.outcome != 'success' || steps.review-decision-1.outcome != 'success')
        continue-on-error: true
        uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read .github/health-agent/repair.md. This is the final repair cycle. Fix only the
            manager snapshot scope and the cycle-1 validation/review failures. Do not commit,
            push, open or merge a PR, access providers, or weaken validation.
          claude_args: >-
            --max-turns 200 --allowedTools Read,Edit,Write,Glob,Grep,TodoWrite,Bash(pnpm:*),Bash(git diff:*),Bash(git status:*),Bash(git ls-files:*)
            --json-schema '{"type":"object","required":["status","findings"],"properties":{"snapshot_id":{"type":"string"},"cycle":{"const":2},"status":{"enum":["ready_to_merge","retry_required","needs_human"]},"validation_state":{"enum":["not_run","passed","failed"]},"review_state":{"enum":["not_run","passed","failed"]},"merge_policy":{"enum":["automatic","human"]},"linear_required":{"type":"boolean"},"auto_merge_enabled":{"type":"boolean"},"auto_merge_eligible":{"type":"boolean"},"fixed":{"type":"boolean"},"merged":{"type":"boolean"},"findings":{"type":"array","items":{"type":"object","required":["fingerprint","status","summary"],"properties":{"fingerprint":{"type":"string","pattern":"^(cron|directory|link|quality|sentry):"},"status":{"enum":["ready_to_merge","retry_required","needs_human"]},"summary":{"type":"string"}}}}}}'
      - name: "Stage 4 · Self-heal — capture repair result cycle 2"
        id: repair-result-2
        if: always() && steps.repair-2.outcome != 'skipped'
        continue-on-error: true
        env:
          REPAIR_RESULT: ${{ steps.repair-2.outputs.structured_output }}
        run: |
          scripts/health-agent/capture-repair-result.sh 2 "$HEALTH_ARTIFACT_DIR/repair-result-2.json"
      - name: "Stage 4 · Self-heal — validate cycle 2"
        id: validate-2
        if: steps.admission.outputs.claimed == 'true' && steps.repair-2.outcome == 'success'
        continue-on-error: true
        run: |
          scripts/health-agent/enforce-repair-scope.sh "$HEALTH_ARTIFACT_DIR/manager-metadata.json" human
          if jq -e '.findings[] | select(.fingerprint | startswith("quality:"))' "$HEALTH_ARTIFACT_DIR/manager-snapshot.json" >/dev/null; then
            pnpm exec tsx scripts/health-agent/quality-runtime.ts \
              --output "$HEALTH_ARTIFACT_DIR/quality-recheck-2.json" \
              --run-at "${{ steps.setup.outputs.run_at }}"
            scripts/health-agent/verify-claimed-findings.sh \
              "$HEALTH_ARTIFACT_DIR/manager-snapshot.json" \
              "$HEALTH_ARTIFACT_DIR/quality-recheck-2.json" \
              "$HEALTH_ARTIFACT_DIR/repair-result-2.json"
          fi
          pnpm exec vitest run scripts/health-agent
          pnpm lint
          pnpm exec tsc --noEmit --incremental false
          scripts/health-agent/validate-repair-patch.sh "$HEALTH_ARTIFACT_DIR/manager-metadata.json" human
      - name: "Stage 4 · Self-heal — independent review cycle 2"
        id: review-2
        if: steps.admission.outputs.claimed == 'true' && steps.validate-2.outcome == 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read .github/health-agent/review.md and perform the final read-only review of the
            manager-scoped diff. Do not edit, commit, push, open, or merge a PR.
          claude_args: >-
            --max-turns 60 --allowedTools Read,Glob,Grep,Bash(git diff:*),Bash(git status:*)
            --json-schema '{"type":"object","required":["cycle","verdict","review_state","auto_merge_enabled","merged","findings"],"properties":{"cycle":{"const":2},"verdict":{"const":"pass"},"review_state":{"const":"passed"},"auto_merge_enabled":{"const":false},"merged":{"const":false},"findings":{"type":"array","items":{"type":"object","required":["fingerprint","verdict","review_state"],"properties":{"fingerprint":{"type":"string","pattern":"^(cron|directory|link|quality|sentry):"},"verdict":{"const":"pass"},"review_state":{"const":"passed"}}}}}}'
      - name: "Stage 4 · Self-heal — review decision cycle 2"
        id: review-decision-2
        if: steps.admission.outputs.claimed == 'true' && steps.review-2.outcome == 'success'
        continue-on-error: true
        env:
          REVIEW_RESULT: ${{ steps.review-2.outputs.structured_output }}
        run: |
          jq -e --argjson review "$REVIEW_RESULT" '
            ($review.verdict == "pass") and ($review.review_state == "passed") and
            ($review.auto_merge_enabled == false) and ($review.merged == false) and
            (([.findings[].fingerprint] | sort) == ([$review.findings[].fingerprint] | sort)) and
            ([$review.findings[] | select(.verdict != "pass" or .review_state != "passed")] | length == 0)
          ' "$HEALTH_ARTIFACT_DIR/manager-snapshot.json" >/dev/null || {
            # Exiting 1 with no output made a skipped publish unexplainable:
            # the run went green with no PR and nothing said why. The most
            # common cause is the reviewer labelling findings by file path
            # instead of copying the snapshot fingerprint.
            echo "::error::Review decision rejected the reviewer's result" >&2
            jq -n --argjson review "$REVIEW_RESULT" --slurpfile snap "$HEALTH_ARTIFACT_DIR/manager-snapshot.json" '{
              verdict: $review.verdict,
              review_state: $review.review_state,
              only_in_review: ([$review.findings[].fingerprint] - [$snap[0].findings[].fingerprint]),
              only_in_snapshot: ([$snap[0].findings[].fingerprint] - [$review.findings[].fingerprint])
            }' >&2
            exit 1
          }
      - name: "Stage 4 · Publish — GitHub App token"
        id: app-token
        if: >-
          steps.admission.outputs.claimed == 'true' &&
          (steps.review-decision-1.outcome == 'success' || steps.review-decision-2.outcome == 'success')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.0.0
        with:
          app-id: ${{ secrets.HEALTH_AGENT_GITHUB_APP_ID }}
          private-key: ${{ secrets.HEALTH_AGENT_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: "Stage 4 · Publish — create at most one manager-reviewed PR"
        id: publish
        if: steps.admission.outputs.claimed == 'true' && steps.app-token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEALTH_AGENT_WRITER_TOKEN: ${{ secrets.HEALTH_AGENT_WRITER_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          set -euo pipefail
          branch="health-agent/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -er '.human.traceability[].changedFiles[]' "$HEALTH_ARTIFACT_DIR/manager-metadata.json" | sort -u > "$HEALTH_ARTIFACT_DIR/repair-paths.txt"
          mapfile -t repair_paths < "$HEALTH_ARTIFACT_DIR/repair-paths.txt"
          test "${#repair_paths[@]}" -gt 0
          git config user.name "formoria-health-agent[bot]"
          git config user.email "formoria-health-agent[bot]@users.noreply.github.com"
          original_origin="$(git remote get-url origin)"
          trap 'git remote set-url origin "$original_origin"' EXIT
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git switch -c "$branch"
          git add -- "${repair_paths[@]}"
          if git diff --cached --quiet; then
            echo "Validated repair produced no staged changes" >&2
            exit 1
          fi
          git commit -m "fix(health): repair nightly findings"
          git push origin "$branch"
          jq -r '.findings[] | "- `\(.fingerprint)` — \(.title)"' "$HEALTH_ARTIFACT_DIR/manager-snapshot.json" > "$HEALTH_ARTIFACT_DIR/pr-findings.md"
          jq -r '.findings[] | "- `\(.fingerprint)`"' "$HEALTH_ARTIFACT_DIR/manager-snapshot.json" > "$HEALTH_ARTIFACT_DIR/pr-fingerprints.md"
          {
            printf '%s\n\n' '<!-- health-agent:repair:v1 -->' '## Health Agent repair'
            cat "$HEALTH_ARTIFACT_DIR/pr-findings.md"
            printf '\n## Validation\n- Detector reruns, lint, type-check, focused Health Agent tests, and independent review passed.\n'
            printf '\n## Traceability\nFinding fingerprints addressed by this PR:\n'
            cat "$HEALTH_ARTIFACT_DIR/pr-fingerprints.md"
            printf '\nNo Linear ticket exists at this stage. The final report creates one digest ticket per run, covering findings that were never ticketed.\n'
          } > "$HEALTH_ARTIFACT_DIR/pr-body.md"
          pr_url="$(gh pr create --title "fix(health): nightly repair ${GITHUB_RUN_ID}" --body-file "$HEALTH_ARTIFACT_DIR/pr-body.md" --base "${{ steps.release-flow.outputs.development_base }}" --head "$branch" --label health-agent)"
          pr_number="${pr_url##*/}"
          pnpm exec tsx scripts/health-agent/workflow-runtime.ts repair-result --metadata "$HEALTH_ARTIFACT_DIR/manager-metadata.json" --merge-policy human --lease-owner "github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" --pr-number "$pr_number" --pr-url "$pr_url" --auto-merge-enabled false --defer-delivery true --run-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --attempt "$GITHUB_RUN_ATTEMPT" --run-id "$GITHUB_RUN_ID" --output "$HEALTH_ARTIFACT_DIR/manager-pr-result.json"

      - name: "Stage 5 · Final manager report"
        id: final-report
        if: always() && steps.admission.outputs.claimed == 'true'
        continue-on-error: true
        env:
          AGENT_HUB_TURSO_AUTH_TOKEN: ${{ secrets.AGENT_HUB_TURSO_AUTH_TOKEN }}
          AGENT_HUB_TURSO_DATABASE_URL: ${{ secrets.AGENT_HUB_TURSO_DATABASE_URL }}
          # This step is the sole Linear writer, and it has to read
          # health_fix_queue to find which findings are not ticketed yet.
          # Without these Supabase credentials the read or reservation throws
          # `required_runtime_environment`,
          # which surfaces only as an optional-delivery warning — so every run
          # since the ledger began reported `linear_ticket_candidates_failed`
          # and created no tickets at all (DEV-1431).
          HEALTH_AGENT_READER_TOKEN: ${{ secrets.HEALTH_AGENT_READER_TOKEN }}
          HEALTH_AGENT_WRITER_TOKEN: ${{ secrets.HEALTH_AGENT_WRITER_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          LINEAR_ASSIGNEE_ID: ${{ vars.LINEAR_ASSIGNEE_ID }}
          LINEAR_OAUTH_ACCESS_TOKEN: ${{ secrets.LINEAR_OAUTH_ACCESS_TOKEN }}
          LINEAR_PROJECT_ID: ${{ vars.LINEAR_PROJECT_ID }}
          LINEAR_TEAM_ID: ${{ vars.LINEAR_TEAM_ID }}
          SLACK_HEALTH_WEBHOOK_URL: ${{ secrets.SLACK_HEALTH_WEBHOOK_URL }}
        run: >-
          test -f "$HEALTH_ARTIFACT_DIR/manager-pr-result.json" || printf '{}\n' > "$HEALTH_ARTIFACT_DIR/manager-pr-result.json";
          pnpm exec tsx scripts/health-agent/workflow-runtime.ts final-report
          --mode "${{ steps.setup.outputs.mode }}"
          --aggregate-artifact "$HEALTH_ARTIFACT_DIR/aggregate.json"
          --queue-artifact "$HEALTH_ARTIFACT_DIR/queue.json"
          --human-pr-result "$HEALTH_ARTIFACT_DIR/manager-pr-result.json"
          --collect-status "${{ steps.link.outcome }}"
          --analyze-status "${{ steps.sentry-materialize.outcome }}"
          --deliver-status "${{ steps.initial-report.outcome }}"
          --repair-status "${{ steps.snapshot.outputs.count == '0' && 'skipped' || (steps.review-decision-1.outcome == 'success' || steps.review-decision-2.outcome == 'success') && 'success' || 'failed' }}"
          --publish-status "${{ steps.publish.outcome }}"
          --run-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          --attempt "$GITHUB_RUN_ATTEMPT" --run-id "$GITHUB_RUN_ID"
          --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --output "$HEALTH_ARTIFACT_DIR/final-report.json"
          --audit "$HEALTH_ARTIFACT_DIR/final-audit.json"
      - name: "Stage 5 · Final manager report — duplicate terminal"
        id: duplicate-terminal
        if: always() && steps.admission.outputs.claimed != 'true'
        run: |
          test -f "$HEALTH_ARTIFACT_DIR/final-report.json"
          jq -n '{artifacts:{"link-checker":{status:"success",findings:[],failures:[]},"directory-health":{status:"success",findings:[],failures:[]},"sentry-triage":{status:"success",findings:[],failures:[]},"quality-health":{status:"success",findings:[],failures:[]},"cron-health":{status:"success",findings:[],failures:[]}}}' > "$HEALTH_ARTIFACT_DIR/aggregate.json"
          printf '{"lifecycle":null,"failures":[]}' > "$HEALTH_ARTIFACT_DIR/queue.json"
          printf '{}\n' > "$HEALTH_ARTIFACT_DIR/manager-pr-result.json"
      - name: "Stage 5 · Save one run artifact"
        id: artifact
        if: always()
        run: |
          for file in aggregate.json queue.json manager-pr-result.json final-report.json; do
            test -f "$HEALTH_ARTIFACT_DIR/$file" || printf '{}\n' > "$HEALTH_ARTIFACT_DIR/$file"
          done
          jq -n --slurpfile aggregate "$HEALTH_ARTIFACT_DIR/aggregate.json" --slurpfile queue "$HEALTH_ARTIFACT_DIR/queue.json" --slurpfile repair "$HEALTH_ARTIFACT_DIR/manager-pr-result.json" --slurpfile report "$HEALTH_ARTIFACT_DIR/final-report.json" --arg run_id "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg mode "${{ steps.setup.outputs.mode }}" --arg expected_at "${{ steps.setup.outputs.expected_at }}" --arg started_at "${{ steps.setup.outputs.run_at }}" --argjson scheduling_delay_seconds "${{ steps.setup.outputs.delay_seconds || '0' }}" '{version:1, runId:$run_id, attempt:($attempt|tonumber), mode:$mode, schedule:{expectedAt:$expected_at,startedAt:$started_at,delaySeconds:$scheduling_delay_seconds}, groups:{product:{status:(if $aggregate[0].artifacts["link-checker"].status == "success" and $aggregate[0].artifacts["directory-health"].status == "success" then "success" else "failed" end),link:($aggregate[0].artifacts["link-checker"] // {status:"failed",failures:["missing_output"],findings:[]}),directory:($aggregate[0].artifacts["directory-health"] // {status:"failed",failures:["missing_output"],findings:[]})},runtime:($aggregate[0].artifacts["sentry-triage"] // {status:"failed",failures:["missing_output"],findings:[]}),repository:($aggregate[0].artifacts["quality-health"] // {status:"failed",failures:["missing_output"],findings:[]}),cron:($aggregate[0].artifacts["cron-health"] // {status:"failed",failures:["missing_output"],findings:[]})},canonicalFindings:([$aggregate[0].artifacts[]?.findings[]?]|unique_by(.fingerprint)),lifecycle:($queue[0].lifecycle // null),repair:(if ($repair[0] | length) == 0 then null else $repair[0] end),managerReport:(if ($report[0] | length) == 0 then null else $report[0] end)}' > "$HEALTH_ARTIFACT_DIR/health-run.json"
          : > "$HEALTH_ARTIFACT_DIR/audit.jsonl"
          for file in "$HEALTH_ARTIFACT_DIR"/*-audit.json; do
            [[ -f "$file" ]] || continue
            jq -c '.records[]?' "$file" >> "$HEALTH_ARTIFACT_DIR/audit.jsonl"
          done
          # Not `[[ -f … ]] && cat …`: as the last command under `bash -e` a
          # false test fails the whole step. The file is absent whenever the run
          # short-circuits (duplicate logical day), which is exactly when the
          # artifact matters most.
          if [[ -f "$HEALTH_ARTIFACT_DIR/initial-audit.jsonl" ]]; then
            cat "$HEALTH_ARTIFACT_DIR/initial-audit.jsonl" >> "$HEALTH_ARTIFACT_DIR/audit.jsonl"
          fi
      - name: "Stage 5 · Upload health run"
        id: upload
        if: always() && steps.artifact.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: health-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .health-agent-artifacts/health-run.json
            .health-agent-artifacts/audit.jsonl
            .health-agent-artifacts/repair-result-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: "Stage 5 · Retry health run upload"
        id: upload-retry
        if: always() && steps.artifact.outcome == 'success' && steps.upload.outcome != 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: health-run-${{ github.run_id }}-${{ github.run_attempt }}-retry
          path: |
            .health-agent-artifacts/health-run.json
            .health-agent-artifacts/audit.jsonl
            .health-agent-artifacts/repair-result-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: "Stage 5 · Classify health run upload"
        id: upload-status
        if: always()
        continue-on-error: true
        run: |
          upload_status=failed
          if [[ "${{ steps.upload.outcome }}" == success || "${{ steps.upload-retry.outcome }}" == success ]]; then upload_status=success; fi
          pnpm exec tsx scripts/health-agent/workflow-runtime.ts record-artifact-upload \
            --input "$HEALTH_ARTIFACT_DIR/health-run.json" \
            --output "$HEALTH_ARTIFACT_DIR/health-run.json" \
            --status "$upload_status" \
            --reason "actions/upload-artifact outcome: $upload_status"
      - name: "Stage 5 · Release claims this run never attempted"
        id: release-claims
        # always(), because the whole point is to recover from the runs that
        # died. A claim charges an attempt up front, so without this a crashed
        # run spends one on nothing and two crashes retire a finding nobody
        # looked at (DEV-1429). Rows a repair actually touched have already left
        # 'claimed', so only unattempted work is handed back.
        if: always() && steps.admission.outputs.claimed == 'true'
        continue-on-error: true
        env:
          HEALTH_AGENT_WRITER_TOKEN: ${{ secrets.HEALTH_AGENT_WRITER_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: >-
          pnpm exec tsx scripts/health-agent/workflow-runtime.ts release-claims
          --lease-owner "github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          --output "$HEALTH_ARTIFACT_DIR/release-claims.json"
      - name: "Stage 5 · Admission — finalize logical day"
        id: finalize
        if: always() && steps.admission.outputs.claimed == 'true'
        env:
          HEALTH_AGENT_WRITER_TOKEN: ${{ secrets.HEALTH_AGENT_WRITER_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          terminal_status=failed
          manager_report_status="$(jq -er '.envelope.status | select(. == "failed" or . == "skipped" or . == "success")' "$HEALTH_ARTIFACT_DIR/final-report.json" 2>/dev/null || printf '%s\n' failed)"
          if pnpm exec tsx scripts/health-agent/workflow-runtime.ts terminal-status \
            --artifact-status "${{ steps.artifact.outcome }}" \
            --final-report-status "${{ steps.final-report.outcome }}" \
            --manager-report-status "$manager_report_status" \
            --output "$HEALTH_ARTIFACT_DIR/terminal-status.json" \
            --upload-classifier-status "${{ steps.upload-status.outcome }}" \
            --upload-retry-status "${{ steps.upload-retry.outcome }}" \
            --upload-status "${{ steps.upload.outcome }}" &&
            terminal_status="$(jq -er '.status' "$HEALTH_ARTIFACT_DIR/terminal-status.json")" &&
            [[ "$terminal_status" == success ]]; then
            :
          else
            terminal_status=failed
          fi
          pnpm exec tsx scripts/health-agent/workflow-runtime.ts finalize-run \
            --mode "${{ steps.setup.outputs.mode }}" \
            --result "$HEALTH_ARTIFACT_DIR/final-report.json" \
            --output "$HEALTH_ARTIFACT_DIR/finalize.json" \
            --status "$terminal_status" \
            --run-at "${{ steps.setup.outputs.run_at }}" \
            --attempt "$GITHUB_RUN_ATTEMPT" --run-id "$GITHUB_RUN_ID"
      - name: "Stage 5 · Surface infrastructure failures"
        if: always()
        run: |
          test "${{ steps.upload.outcome }}" = success || test "${{ steps.upload-retry.outcome }}" = success
          test "${{ steps.upload-status.outcome }}" = success
          # A failed detector is reported, not fatal. This assertion used to be
          # `.groups | all(.status != "failed")`, so one broken collector out of
          # six turned four nights of otherwise-healthy results red and stopped
          # the agent repairing anything (DEV-1424). Name the degraded detectors
          # loudly instead — the envelope status below still fails the run when
          # the pipeline itself broke or when every detector failed.
          degraded="$(jq -r '[.groups | to_entries[] | select(.value.status == "failed") | .key] | join(", ")' "$HEALTH_ARTIFACT_DIR/health-run.json")"
          if [[ -n "$degraded" ]]; then
            echo "::warning title=Health agent degraded::Detector(s) failed: $degraded — findings from the remaining detectors were still collected and queued"
          fi
          if [[ "${{ steps.admission.outputs.claimed }}" == true ]]; then
            test "${{ steps.aggregate.outcome }}" = success
            test "${{ steps.queue.outcome }}" = success
            test "${{ steps.final-report.outcome }}" = success
            test "${{ steps.finalize.outcome }}" = success
          else
            jq -e '.managerReport.envelope.status == "success"' "$HEALTH_ARTIFACT_DIR/health-run.json" >/dev/null
          fi
          jq -e '.managerReport.envelope.status != "failed"' "$HEALTH_ARTIFACT_DIR/health-run.json" >/dev/null
