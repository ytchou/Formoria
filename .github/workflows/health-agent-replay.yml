name: Formoria Health Agent Replay

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Source health run ID"
        required: true
        type: string
      source_attempt:
        description: "Source run attempt"
        required: true
        default: "1"
        type: string
      action:
        description: "Run-level data to reconstruct"
        required: true
        default: report
        type: choice
        options: [consolidate, report, repair]

permissions:
  actions: read
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the single source run artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: >-
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY"
          --name "health-run-${SOURCE_RUN_ID}-${SOURCE_ATTEMPT}" --dir source
      - name: Replay without rerunning collectors
        env:
          SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
        run: >-
          scripts/health-agent/replay-run.sh "${{ inputs.source_run_id }}"
          source "${{ inputs.action }}"
