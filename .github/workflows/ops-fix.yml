name: "Ops Agent — Code Fix"
on:
  workflow_dispatch:
    inputs:
      instruction:
        description: "What to fix"
        required: true
        type: string
      request_id:
        description: "Ops agent request UUID"
        required: true
        type: string
      channel:
        description: "Slack channel ID"
        required: true
        type: string
      thread_ts:
        description: "Slack thread timestamp"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release flow
        id: release-flow
        run: |
          DEFAULT_BASE=$(gh api repos/${{ github.repository }} --jq .default_branch 2>/dev/null || echo main)
          if [ -f ".github/release-flow.json" ]; then
            BASE=$(jq -r '.development_base // empty' .github/release-flow.json)
            echo "development_base=${BASE:-$DEFAULT_BASE}" >> "$GITHUB_OUTPUT"
          else
            echo "development_base=$DEFAULT_BASE" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.HEALTH_AGENT_GITHUB_APP_ID }}
          private-key: ${{ secrets.HEALTH_AGENT_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Codex fix
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.CODEX_API_KEY }}
          codex-version: 0.155.1
          model: gpt-5.6-sol
          effort: high
          permission-profile: ":workspace"
          prompt: |
            Read .github/ops-agent/fix.md for constraints.
            Instruction: ${{ inputs.instruction }}
      - name: Create draft PR
        id: create-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INSTRUCTION: ${{ inputs.instruction }}
          REQUEST_ID: ${{ inputs.request_id }}
          DEV_BASE: ${{ steps.release-flow.outputs.development_base }}
        run: |
          set -euo pipefail
          branch="ops-agent/${REQUEST_ID}"
          git config user.name "formoria-ops-agent[bot]"
          git config user.email "formoria-ops-agent[bot]@users.noreply.github.com"
          original_origin="$(git remote get-url origin)"
          trap 'git remote set-url origin "$original_origin"' EXIT
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git switch -c "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes produced" >&2
            exit 0
          fi
          git commit -m "fix(ops-agent): ${INSTRUCTION}"
          git push origin "$branch"
          gh label create ops-agent --color "1d76db" --description "PR from ops agent code fix" --force
          pr_url="$(gh pr create \
            --title "fix(ops-agent): ${INSTRUCTION}" \
            --body "$(cat <<BODY
          ## Ops Agent Code Fix

          **Request ID:** \`${REQUEST_ID}\`
          **Instruction:**
          \`\`\`
          ${INSTRUCTION}
          \`\`\`

          > Draft PR created by the Formoria ops agent. Review before merging.
          BODY
          )" \
            --draft \
            --base "${DEV_BASE}" \
            --head "$branch" \
            --label ops-agent)"
          echo "PR created: $pr_url"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
      - name: Notify Slack
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
          CHANNEL: ${{ inputs.channel }}
          THREAD_TS: ${{ inputs.thread_ts }}
        run: |
          if [ -n "${PR_URL}" ]; then
            text="Draft PR created: ${PR_URL}"
          else
            text="Code fix completed with no changes, or failed. Check the Actions run."
          fi
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"channel\":\"${CHANNEL}\",\"thread_ts\":\"${THREAD_TS}\",\"text\":\"$text\"}"
