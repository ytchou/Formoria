name: E2E PR (selective)

on:
  pull_request:
    branches: [main]
    # Evaluated before a runner is allocated: a PR touching none of these
    # costs zero runner-seconds.
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'messages/**'
      - 'public/**'
      - 'playwright.config.*'
      - 'scripts/e2e-select-specs.mjs'
      - '.github/workflows/e2e-pr.yml'
  workflow_dispatch: {}

concurrency:
  group: e2e-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: select-specs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      specs: ${{ steps.select-specs.outputs.specs }}
      smoke: ${{ steps.select-specs.outputs.smoke }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch origin/main to diff against
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Determine specs to run
        id: select-specs
        run: |
          SPECS=$(node scripts/e2e-select-specs.mjs)
          echo "specs=$SPECS" >> "$GITHUB_OUTPUT"
          SMOKE=$(node scripts/e2e-select-specs.mjs --smoke)
          echo "smoke=$SMOKE" >> "$GITHUB_OUTPUT"
          if [ -z "$SPECS" ]; then
            echo "No specs selected — the e2e job will be skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Selected specs:" >> "$GITHUB_STEP_SUMMARY"
            for spec in $SPECS; do echo "- \`$spec\`" >> "$GITHUB_STEP_SUMMARY"; done
          fi
          if [ "$SMOKE" = "true" ]; then
            echo "Smoke cross-browser job enabled by browser-impacting changes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Smoke cross-browser job skipped — no browser-impacting changes." >> "$GITHUB_STEP_SUMMARY"
          fi

  e2e-selective:
    name: e2e-selective
    needs: select
    # Skips the build entirely — the most expensive step — when nothing matched.
    if: needs.select.outputs.specs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CHALLENGE_SECRET: ${{ secrets.CHALLENGE_SECRET }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      PLAYWRIGHT_TEST: "true"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Build Next.js (production)
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run selective e2e tests
        env:
          # Via env, not `${{ }}` inside the script: spec paths are
          # repo-controlled but must never be interpolated into a shell line.
          SPECS: ${{ needs.select.outputs.specs }}
        run: pnpm exec playwright test --project=deep --project=mobile $SPECS

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-pr-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      # The HTML report alone is not enough to diagnose a flake: error-context.md
      # and the failing attempt's trace live under test-results/, and are lost
      # once the retry passes.
      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results-pr-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Smoke runs only when changed files can affect browser-visible behavior or the
  # smoke flow. It still runs against the production build in all three browsers.
  smoke:
    name: smoke-cross-browser
    needs: select
    if: needs.select.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CHALLENGE_SECRET: ${{ secrets.CHALLENGE_SECRET }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      PLAYWRIGHT_TEST: "true"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Build Next.js (production)
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run smoke tier (chromium + firefox + webkit)
        run: >-
          pnpm exec playwright test
          --project=smoke-chromium
          --project=smoke-firefox
          --project=smoke-webkit

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-smoke-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload smoke failure artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results-smoke-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
