name: E2E PR (targeted)

on:
  pull_request:
    branches: [main, staging]
    # Evaluated before a runner is allocated: a PR touching none of these
    # costs zero runner-seconds.
    paths:
      - "src/**"
      - "e2e/**"
      - "messages/**"
      - "public/**"
      - "playwright.config.*"
      - "scripts/e2e-select-specs.mjs"
      - ".github/workflows/e2e-pr.yml"
  workflow_dispatch: {}

concurrency:
  group: e2e-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: select-targeted-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      specs: ${{ steps.select-specs.outputs.specs }}
      affected_routes: ${{ steps.select-specs.outputs.affected_routes }}
      uncovered_routes: ${{ steps.select-specs.outputs.uncovered_routes }}
      cross_browser: ${{ steps.select-specs.outputs.cross_browser }}
      cross_browser_reasons: ${{ steps.select-specs.outputs.cross_browser_reasons }}
      has_work: ${{ steps.select-specs.outputs.has_work }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch pull request base to diff against
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Determine targeted E2E work
        id: select-specs
        env:
          E2E_SELECT_BASE: origin/${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          SELECTION=$(node scripts/e2e-select-specs.mjs --json)
          SPECS=$(jq -r '.smoke_specs | join(" ")' <<< "$SELECTION")
          AFFECTED=$(jq -c '.affected_routes' <<< "$SELECTION")
          UNCOVERED=$(jq -c '.uncovered_routes' <<< "$SELECTION")
          CROSS_BROWSER=$(jq -r '.cross_browser' <<< "$SELECTION")
          CROSS_REASONS=$(jq -c '.cross_browser_reasons' <<< "$SELECTION")
          HAS_WORK=$(jq -r '(.smoke_specs | length > 0) or .cross_browser' <<< "$SELECTION")
          SMOKE_TEST_COUNT=$(jq -r '.smoke_test_count' <<< "$SELECTION")

          echo "specs=$SPECS" >> "$GITHUB_OUTPUT"
          echo "affected_routes=$AFFECTED" >> "$GITHUB_OUTPUT"
          echo "uncovered_routes=$UNCOVERED" >> "$GITHUB_OUTPUT"
          echo "cross_browser=$CROSS_BROWSER" >> "$GITHUB_OUTPUT"
          echo "cross_browser_reasons=$CROSS_REASONS" >> "$GITHUB_OUTPUT"
          echo "has_work=$HAS_WORK" >> "$GITHUB_OUTPUT"

          {
            echo '## Targeted E2E selection'
            echo
            echo '**Affected user-facing route families**'
            jq -r 'if length == 0 then "- None" else .[] | "- `" + . + "`" end' <<< "$AFFECTED"
            echo
            echo '**Selected canonical `@smoke` specs (Chromium)**'
            if [ -n "$SPECS" ]; then
              for spec in $SPECS; do printf -- '- `%s`\n' "$spec"; done
            else
              echo '- None'
            fi
            echo
            echo '**Uncovered affected route families (warning during migration)**'
            jq -r 'if length == 0 then "- None" else .[] | "- `" + . + "`" end' <<< "$UNCOVERED"
            echo
            if [ "$CROSS_BROWSER" = 'true' ]; then
              echo '**Cross-browser: selected**'
              jq -r '.[] | "- " + .' <<< "$CROSS_REASONS"
              echo '- Projects: `cross-browser-chromium`, `cross-browser-firefox`, `cross-browser-webkit`'
            else
              echo '**Cross-browser: skipped**'
              echo '- No browser-sensitive trigger matched.'
            fi
            echo
            if [ "$HAS_WORK" = 'true' ]; then
              printf 'Selected @smoke test count: %s\n' "$SMOKE_TEST_COUNT"
            else
              echo 'Successful skip: no covered route smoke cases or compatibility journey selected.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  e2e-targeted:
    name: e2e-targeted
    needs: select
    if: needs.select.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CHALLENGE_SECRET: ${{ secrets.CHALLENGE_SECRET }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      PLAYWRIGHT_TEST: "true"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Build Next.js (production)
        run: |
          if ! pnpm build; then
            echo "Initial build failed; clearing the generated output and retrying once."
            rm -rf .next
            pnpm build
          fi

      - name: Install all desktop Playwright browsers
        if: needs.select.outputs.cross_browser == 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install Chromium for targeted smoke
        if: needs.select.outputs.cross_browser != 'true' && needs.select.outputs.specs != ''
        run: pnpm exec playwright install --with-deps chromium

      - name: Run selected E2E specs in Chromium
        if: needs.select.outputs.specs != ''
        env:
          SPECS: ${{ needs.select.outputs.specs }}
        run: |
          set -euo pipefail
          read -r -a SPEC_PATHS <<< "$SPECS"
          pnpm exec playwright test --project=deep "${SPEC_PATHS[@]}"

      - name: Run the dedicated compatibility journey in three browsers
        if: needs.select.outputs.cross_browser == 'true'
        run: >-
          pnpm exec playwright test
          --project=cross-browser-chromium
          --project=cross-browser-firefox
          --project=cross-browser-webkit
          --grep '@cross-browser'
          e2e/tests/landing-search-cross-browser.spec.ts

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-pr-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results-pr-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
