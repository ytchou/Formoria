          EXACT_GATE: ${{ needs.selfheal.outputs.failed == '0' && 'passed' || 'failed' }}
          FULL_GATE: ${{ needs.selfheal.outputs.failed == '0' && 'passed' || 'failed' }}
          MERGE_COMMIT_SHA: ${{ needs.selfheal.outputs.merge_commit_sha }}
