name: E2E Staging (Nightly)

on:
  schedule:
    - cron: "5 20 * * *"
  workflow_dispatch:
    inputs:
      selfheal_only:
        description: "Run a previously frozen self-heal bundle instead of the suite"
        type: boolean
        default: false
      source_run_id:
        description: "Source run ID for self-heal-only continuation"
        type: string
        default: ""
      source_artifact_name:
        description: "Frozen staging failure artifact from the source run"
        type: string
        default: "staging-e2e-failure"
      repair_ref:
        description: "Existing test-only repair branch or commit to verify"
        type: string
        default: ""
      repair_branch:
        description: "Self-heal branch to create or update for this incident"
        type: string
        default: ""
      repair_test_sha:
        description: "Exact repair-test SHA represented by repair_ref"
        type: string
        default: ""
      incident_pr_number:
        description: "Existing incident PR to reuse for this failure"
        type: string
        default: ""

concurrency:
  group: formoria-staging-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-staging:
    if: inputs.selfheal_only != true
    runs-on: ubuntu-latest
    outputs:
      staging_sha: ${{ steps.sha.outputs.staging_sha }}
    steps:
      - name: Resolve current staging SHA
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/staging | awk '{print $1}')"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::unable to resolve a 40-character staging SHA"
            exit 1
          fi
          echo "staging_sha=$sha" >> "$GITHUB_OUTPUT"

  e2e-staging:
    if: inputs.selfheal_only != true
    needs: resolve-staging
    runs-on: ubuntu-latest
    environment: "Formoria / staging"
    timeout-minutes: 60
    outputs:
      deployed_sha: ${{ steps.revision.outputs.deployed_sha }}
      tested_sha: ${{ steps.revision.outputs.tested_sha }}
      failed: ${{ steps.e2e.outcome == 'failure' }}
    env:
      FORMORIA_DEPLOYMENT_ENV: staging
      STAGING_SHA: ${{ needs.resolve-staging.outputs.staging_sha }}
      STAGING_BASE_URL: https://staging.formoria.com
      BASE_URL: https://staging.formoria.com
      NEXT_PUBLIC_SITE_URL: https://staging.formoria.com
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_SIGNUP_EMAIL_DOMAIN: example.test
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      E2E_ORIGIN_SECRET: ${{ secrets.E2E_ORIGIN_SECRET }}
      CI: "true"
      PLAYWRIGHT_TEST: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-staging.outputs.staging_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify deployed staging revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          revision=""
          for attempt in $(seq 1 60); do
          # X-Formoria-Revision must equal the tested staging SHA.
          revision="$(curl --fail --silent --show-error --location \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -D - -o /dev/null "$STAGING_BASE_URL/about" \
              | awk -F': ' 'tolower($1) == "x-formoria-revision" {gsub("\\r", "", $2); print $2; exit}')"
            if [[ "$revision" == "$STAGING_SHA" ]]; then
              echo "deployed_sha=$revision" >> "$GITHUB_OUTPUT"
              echo "tested_sha=$STAGING_SHA" >> "$GITHUB_OUTPUT"
              break
            fi
            if [[ -z "$revision" ]]; then
              echo "staging revision is missing (attempt $attempt/60)"
            else
              echo "staging revision $revision does not match $STAGING_SHA (attempt $attempt/60)"
            fi
            if [[ "$attempt" == 60 ]]; then
              echo "::error::staging did not report the exact tested SHA; refusing to certify"
              exit 1
            fi
            sleep 10
          done
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run complete deep and mobile suite against deployed staging
        id: e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        run: >-
          pnpm exec playwright test
          --project=deep
          --reporter=html,json
      - name: Reject unexpected skipped E2E tests
        id: report_gate
        if: always()
        run: pnpm exec tsx scripts/e2e-report-gate.ts playwright-results.json scripts/e2e-expected-skips.json "$RUNNER_TEMP/unexpected-skips.json"
      - name: Freeze complete staging failure context
        if: always() && (steps.e2e.outcome == 'failure' || steps.report_gate.outcome == 'failure')
        env:
          DEPLOYED_APP_SHA: ${{ steps.revision.outputs.deployed_sha }}
          REPAIR_TEST_SHA: ${{ steps.revision.outputs.tested_sha || env.STAGING_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          report="playwright-results.json"
          failures="$RUNNER_TEMP/staging-failures.json"
          # A passing Playwright process with an unexpected skip is still an
          # actionable incident. Preserve the gate's structured records before
          # considering the generic report fallback.
          if [[ "${{ steps.e2e.outcome }}" == success && "${{ steps.report_gate.outcome }}" == failure && -s "$RUNNER_TEMP/unexpected-skips.json" ]] &&
             jq -e 'type == "array" and length > 0' "$RUNNER_TEMP/unexpected-skips.json" >/dev/null; then
            cp "$RUNNER_TEMP/unexpected-skips.json" "$failures"
          fi
          if [[ ! -s "$failures" && -s "$report" ]]; then
            jq '[.suites[]? | recurse(.suites[]?) as $suite | $suite.specs[]? as $spec | select($spec.ok == false) | {file: ($suite.file // null), title: $spec.title, project: ([$spec.tests[]?.projectName // empty] | unique | .[0] // "deep")]}' "$report" > "$failures" || true
          fi
          if [[ ! -s "$failures" || "$(jq 'length' "$failures" 2>/dev/null || echo 0)" == 0 ]]; then
            jq -n --arg title "The deployed staging E2E workflow failed before a complete failure report was available" \
              '[{file: null, title: $title, project: "workflow"}]' > "$failures"
          fi
          failure_count="$(jq -r 'length' "$failures")"
          [[ "$failure_count" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::refusing to freeze an empty staging failure set"
            exit 1
          }
          pnpm exec tsx scripts/selfheal/incident-cli.ts freeze \
            "$failures" > staging-frozen-failures.json
          jq --arg deployed_app_sha "$DEPLOYED_APP_SHA" \
            --arg repair_test_sha "$REPAIR_TEST_SHA" \
            --arg source_run_id "$GITHUB_RUN_ID" \
            --arg source_workflow_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '. + {environment: "staging", target: "https://staging.formoria.com", deployed_app_sha: $deployed_app_sha, repair_test_sha: $repair_test_sha, source_run_id: $source_run_id, source_workflow_url: $source_workflow_url}' \
            staging-frozen-failures.json > staging-selfheal-context.json
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-e2e-failure
          path: |
            playwright-report/
            test-results/
            playwright-results.json
            staging-frozen-failures.json
            staging-selfheal-context.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Report staging E2E result to Agent Hub
        if: always()
        continue-on-error: true
        env:
          AGENT_HUB_TURSO_DATABASE_URL: ${{ secrets.AGENT_HUB_TURSO_DATABASE_URL }}
          AGENT_HUB_TURSO_AUTH_TOKEN: ${{ secrets.AGENT_HUB_TURSO_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) agent_hub_status=success ;;
            failure) agent_hub_status=failed ;;
            cancelled|skipped) agent_hub_status=skipped ;;
            *) agent_hub_status=failed ;;
          esac
          workflow_started_at=$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | jq -r '.run_started_at')
          report_date=$(TZ=Asia/Taipei date -d "$workflow_started_at" +%F)
          if [ -f playwright-results.json ]; then
            total_specs=$(jq '(.stats.expected // 0) + (.stats.unexpected // 0) + (.stats.skipped // 0) + (.stats.flaky // 0)' playwright-results.json)
            passed=$(jq '(.stats.expected // 0) + (.stats.flaky // 0)' playwright-results.json)
            failed=$(jq '.stats.unexpected // 0' playwright-results.json)
            skipped=$(jq '.stats.skipped // 0' playwright-results.json)
            duration_seconds=$(jq '((.stats.duration // 0) / 1000) | round' playwright-results.json)
            failed_specs=$(jq -c '[.suites[]? | recurse(.suites[]?) as $suite | $suite.specs[]? | select(.ok == false) | {file: ($suite.file // null), title}]' playwright-results.json)
          else
            total_specs=0; passed=0; failed=0; skipped=0; duration_seconds=0; failed_specs='[]'
          fi
          verdict_text="E2E: $JOB_STATUS -- $passed specs passed, $failed failed"
          payload=$(jq -n \
            --arg source_run_id "github-actions:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:test" \
            --arg status "$agent_hub_status" --arg run_at "$workflow_started_at" --arg date "$report_date" \
            --arg verdict_severity "$([ "$agent_hub_status" = success ] && echo ok || echo critical)" \
            --arg verdict_text "$verdict_text" --argjson total_specs "$total_specs" --argjson passed "$passed" \
            --argjson failed "$failed" --argjson skipped "$skipped" --argjson duration_seconds "$duration_seconds" \
            --argjson failed_specs "$failed_specs" --arg workflow_url "$WORKFLOW_URL" \
            '{version: 1, source: "github_actions", source_run_id: $source_run_id, routine: "e2e-nightly",
              project: "formoria", status: $status, run_at: $run_at, date: $date,
              verdict_severity: $verdict_severity, verdict_text: $verdict_text, tickets_created: [],
              log_url: $workflow_url, data: {notification_owner: "github_actions", phase: "test",
              root_source_run_id: env.GITHUB_RUN_ID, terminal: ($status == "success"),
              outcome: (if $status == "success" then "ready" else "failed" end),
              total_specs: $total_specs, passed: $passed, failed: $failed, skipped: $skipped,
              duration_seconds: $duration_seconds, failed_specs: $failed_specs,
              workflow_url: $workflow_url}}')
          printf '%s' "$payload" > /tmp/formoria-e2e-nightly.json
          node scripts/agent-hub/report-run.mjs --file /tmp/formoria-e2e-nightly.json
      - name: Notify initial staging E2E result
        if: always()
        continue-on-error: true
        env:
          E2E_SLACK_PHASE: initial
          E2E_SLACK_LABEL: E2E Staging (Nightly)
          E2E_SLACK_SCOPE: Complete deep + mobile suite against deployed staging
          E2E_SLACK_TARGET: https://staging.formoria.com
          E2E_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_STATUS: ${{ job.status }}
          SLACK_FORMORIA_WEBHOOK_URL: ${{ secrets.SLACK_FORMORIA_WEBHOOK_URL }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm exec tsx scripts/notifications/e2e-slack.ts

  self-heal:
    if: >-
      always() &&
      (needs.e2e-staging.result == 'failure' ||
      (inputs.selfheal_only == true && inputs.source_run_id != ''))
    needs: e2e-staging
    runs-on: ubuntu-latest
    environment: "Formoria / staging"
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      FORMORIA_DEPLOYMENT_ENV: staging
      REPAIR_BASE: staging
      STAGING_BASE_URL: https://staging.formoria.com
      BASE_URL: https://staging.formoria.com
      DEPLOYED_APP_SHA: ${{ needs.e2e-staging.outputs.deployed_sha || '' }}
      REPAIR_TEST_SHA: ${{ inputs.repair_test_sha || needs.e2e-staging.outputs.tested_sha || '' }}
      REPAIR_BRANCH: ${{ inputs.repair_branch || format('selfheal/e2e-{0}', github.run_id) }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id || github.run_id }}
      INCIDENT_PR_NUMBER: ${{ inputs.incident_pr_number || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.repair_ref || 'staging' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Download frozen failure context from this run
        if: inputs.selfheal_only != true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: staging-e2e-failure
          path: "$RUNNER_TEMP/staging-failure"
      - name: Download frozen failure context from source run
        if: inputs.selfheal_only == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" \
            -n "${{ inputs.source_artifact_name || 'staging-e2e-failure' }}" \
            -D "$RUNNER_TEMP/staging-failure"
      - name: Freeze deployed and repair-test identity
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/staging-failure/staging-selfheal-context.json"
          if [[ ! -s "$context" ]]; then
            echo "::error::frozen staging failure context is missing"
            exit 1
          fi
          if [[ "$(jq -r '.environment // empty' "$context")" != "staging" || "$(jq -r '.target // empty' "$context")" != "https://staging.formoria.com" ]]; then
            echo "::error::self-heal artifact is not a staging failure context"
            exit 1
          fi
          DEPLOYED_APP_SHA="${DEPLOYED_APP_SHA:-$(jq -r '.deployed_app_sha // empty' "$context")}"
          REPAIR_TEST_SHA="${REPAIR_TEST_SHA:-$(jq -r '.repair_test_sha // empty' "$context")}"
          if [[ ! "$REPAIR_TEST_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::frozen staging repair-test SHA is missing or invalid"
            exit 1
          fi
          jq --arg deployed_app_sha "$DEPLOYED_APP_SHA" \
            --arg repair_test_sha "$REPAIR_TEST_SHA" \
            --arg repair_base "$REPAIR_BASE" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            '. + {deployed_app_sha: $deployed_app_sha, repair_test_sha: $repair_test_sha, repair_base: $repair_base, source_run_id: $source_run_id}' \
            "$context" > "$RUNNER_TEMP/staging-selfheal-context.json"
          cp "$RUNNER_TEMP/staging-selfheal-context.json" staging-selfheal-context.json
          echo "deployed_app_sha=$DEPLOYED_APP_SHA" >> "$GITHUB_OUTPUT"
          echo "repair_test_sha=$REPAIR_TEST_SHA" >> "$GITHUB_OUTPUT"
          echo "deployed app SHA: $DEPLOYED_APP_SHA"
          echo "repair-test SHA: $REPAIR_TEST_SHA"
      - name: Verify checked-out HEAD matches frozen repair-test SHA
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          frozen_repair_sha="${{ steps.freeze.outputs.repair_test_sha }}"
          [[ "$checked_out_sha" == "$frozen_repair_sha" ]] || {
            echo "::error::self-heal checked out $checked_out_sha but frozen repair-test SHA is $frozen_repair_sha"
            exit 1
          }
      - name: Freeze exact failure set for self-heal
        id: frozen_failures
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/staging-failure/staging-frozen-failures.json"
          if [[ ! -s "$context" ]]; then
            context="$RUNNER_TEMP/staging-failure/staging-selfheal-context.json"
          fi
          if [[ -s "$context" ]]; then
            jq '[.failures[]? | {file: (.file // null), title, project: (.project // "deep"), reason: (.reason // null)}]' "$context" > "$RUNNER_TEMP/source-failures.json"
          fi
          if [[ ! -s "$RUNNER_TEMP/source-failures.json" || "$(jq length "$RUNNER_TEMP/source-failures.json")" == 0 ]]; then
            jq -n --arg title "The deployed staging workflow failed before a complete failure set was available" \
              '[{file: null, title: $title, project: "workflow"}]' > "$RUNNER_TEMP/source-failures.json"
          fi
          pnpm exec tsx scripts/selfheal/incident-cli.ts freeze \
            "$RUNNER_TEMP/source-failures.json" > "$RUNNER_TEMP/frozen-failures.json"
          cp "$RUNNER_TEMP/frozen-failures.json" frozen-failures.json
      - name: Diagnose the frozen staging failure set
        id: diagnose
        continue-on-error: true
        uses: anthropics/claude-code-action@fa7e2f0a29a126f0b81cdcf360561b36e44cf608 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: github-actions
          additional_permissions: |
            actions: read
          prompt: |
            Read .github/selfheal/diagnose.md. Diagnose every failure in
            $RUNNER_TEMP/frozen-failures.json using the report in
            $RUNNER_TEMP/staging-failure. Do not edit files or run Playwright.
            Return the complete DiagnosisResult JSON, including non-actionable
            infrastructure findings. The target is deployed staging only.
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(jq:*),Bash(find:*),Bash(sed:*)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["version","failureSetHash","failures","clusters","complete"],"properties":{"version":{"const":1},"failureSetHash":{"type":"string"},"failures":{"type":"array"},"clusters":{"type":"array"},"complete":{"const":true}}}'
      - name: Retry diagnosis contract once
        id: diagnose_retry
        if: steps.diagnose.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-action@fa7e2f0a29a126f0b81cdcf360561b36e44cf608 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: github-actions
          prompt: |
            The previous diagnosis emitted no valid JSON. Read
            .github/selfheal/diagnose.md and return the complete
            DiagnosisResult for every failure in $RUNNER_TEMP/frozen-failures.json.
            Do not edit files or run tests.
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Bash(jq:*),Bash(find:*),Bash(sed:*)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["version","failureSetHash","failures","clusters","complete"],"properties":{"version":{"const":1},"failureSetHash":{"type":"string"},"failures":{"type":"array"},"clusters":{"type":"array"},"complete":{"const":true}}}'
      - name: Validate diagnosis contract
        id: diagnosis_validation
        if: steps.diagnose.outcome == 'success' || steps.diagnose_retry.outcome == 'success'
        env:
          DIAGNOSIS_RESULT: ${{ steps.diagnose.outputs.structured_output || steps.diagnose_retry.outputs.structured_output }}
        run: |
          set -euo pipefail
          [[ -n "$DIAGNOSIS_RESULT" ]] || { echo "::error::diagnosis output is empty"; exit 1; }
          printf '%s' "$DIAGNOSIS_RESULT" > diagnosis.json
          pnpm exec tsx scripts/selfheal/incident-cli.ts validate-diagnosis \
            "$RUNNER_TEMP/frozen-failures.json" diagnosis.json > "$RUNNER_TEMP/validated-diagnosis.json"
          mv "$RUNNER_TEMP/validated-diagnosis.json" diagnosis.json
      - name: Create or update the self-heal repair branch
        id: repair_branch
        if: steps.diagnosis_validation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPAIR_BRANCH" =~ ^selfheal/e2e-[A-Za-z0-9._/-]+$ ]] || {
            echo "::error::repair branch must use selfheal/e2e-*"
            exit 1
          }
          git checkout -B "$REPAIR_BRANCH" "${{ steps.freeze.outputs.repair_test_sha }}"
      - name: Repair actionable staging E2E clusters
        id: repair
        if: steps.diagnosis_validation.outcome == 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@fa7e2f0a29a126f0b81cdcf360561b36e44cf608 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: github-actions
          prompt: |
            Read .github/selfheal/triage-fix.md. Implement every actionable
            cluster in diagnosis.json for the frozen failure set. Test-only
            repairs may change e2e/**/*.ts; application changes remain
            review_ready. Do not run Playwright, build, commit, or push.
          claude_args: >-
            --max-turns 120
            --allowedTools "Read,Write,Edit,Replace,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["version","failureSetHash","addressedFailureIds","addressedRootCauseKeys","changedFiles","summary","remainingWork","complete"],"properties":{"version":{"const":1},"failureSetHash":{"type":"string"},"addressedFailureIds":{"type":"array"},"addressedRootCauseKeys":{"type":"array"},"changedFiles":{"type":"array"},"summary":{"type":"string"},"remainingWork":{"type":"array"},"complete":{"const":true}}}'
      - name: Validate repair action contract
        id: repair_contract
        if: always()
        env:
          REPAIR_RESULT: ${{ steps.repair.outputs.structured_output }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.diagnosis_validation.outcome }}" != success ]]; then
            echo "::error::diagnosis validation did not pass; repair is blocked"
            echo "repair_blocked=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [[ "${{ steps.repair_branch.outcome }}" != success || "${{ steps.repair.outcome }}" != success ]]; then
            echo "::error::repair action failed; repair is blocked"
            echo "repair_blocked=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [[ -z "$REPAIR_RESULT" ]]; then
            echo "::error::repair action returned no structured output; repair is blocked"
            echo "repair_blocked=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! printf '%s' "$REPAIR_RESULT" | jq -e 'type == "object" and .version == 1 and (.addressedFailureIds | type == "array") and (.addressedRootCauseKeys | type == "array") and (.changedFiles | type == "array") and (.summary | type == "string") and (.remainingWork | type == "array") and .complete == true' >/dev/null; then
            echo "::error::repair action returned malformed structured output; repair is blocked"
            echo "repair_blocked=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "repair_blocked=false" >> "$GITHUB_OUTPUT"
      - name: Checkpoint repair and freeze repair-test SHA
        id: checkpoint
        if: always() && steps.repair_branch.outcome == 'success' && steps.repair_contract.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_RESULT: ${{ steps.repair.outputs.structured_output }}
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$({
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sed '/^$/d' | sort -u)"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              e2e/**/*.ts|src/**/*.ts|src/**/*.tsx) ;;
              *) echo "::error::self-heal changed forbidden path: $path"; exit 1 ;;
            esac
          done <<< "$changed_files"
          git diff --check
          printf '%s' "$REPAIR_RESULT" > repair.json
          printf '%s\n' "$changed_files" | sed '/^$/d' | jq -Rsc 'split("\n")[:-1]' > "$RUNNER_TEMP/changed-files.json"
          pnpm exec tsx scripts/selfheal/incident-cli.ts validate-repair \
            diagnosis.json repair.json "$RUNNER_TEMP/changed-files.json" > "$RUNNER_TEMP/validated-repair.json"
          mv "$RUNNER_TEMP/validated-repair.json" repair.json
          if [[ -n "$changed_files" ]]; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add -- e2e src
            git commit -m "fix(e2e): checkpoint staging self-heal"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:${REPAIR_BRANCH}"
          fi
          rm -f repair.json
          repair_test_sha="$(git rev-parse HEAD)"
          echo "repair_test_sha=$repair_test_sha" >> "$GITHUB_OUTPUT"
          jq --arg repair_test_sha "$repair_test_sha" \
            '. + {repair_test_sha: $repair_test_sha}' "$RUNNER_TEMP/staging-selfheal-context.json" > "$RUNNER_TEMP/staging-selfheal-context.updated.json"
          mv "$RUNNER_TEMP/staging-selfheal-context.updated.json" "$RUNNER_TEMP/staging-selfheal-context.json"
      - name: Classify repair scope
        id: scope
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.diagnosis_validation.outcome }}" != success || "${{ steps.repair_contract.outcome }}" != success || "${{ steps.checkpoint.outcome }}" != success ]]; then
            echo "scope=repair_blocked" >> "$GITHUB_OUTPUT"
            echo "repair scope: repair_blocked (diagnosis or repair contract did not validate)"
            exit 0
          fi
          deployed_sha="${{ steps.freeze.outputs.deployed_app_sha }}"
          repair_sha="${{ steps.checkpoint.outputs.repair_test_sha || steps.freeze.outputs.repair_test_sha }}"
          if [[ ! "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "scope=infrastructure_blocked" >> "$GITHUB_OUTPUT"
            echo "repair scope: infrastructure_blocked (deployed revision evidence is missing)"
            exit 0
          fi
          if [[ ! "$repair_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::repair-test SHA must be a 40-character Git SHA"
            exit 1
          fi
          git fetch origin staging --prune
          if ! git cat-file -e "$deployed_sha^{commit}" || ! git cat-file -e "$repair_sha^{commit}"; then
            echo "::error::deployed app SHA and repair-test SHA must both be present in git"
            exit 1
          fi
          git diff --name-status "$deployed_sha..$repair_sha" > "$RUNNER_TEMP/repair-files"
          if [[ ! -s "$RUNNER_TEMP/repair-files" ]]; then
            echo "scope=recovered_no_change" >> "$GITHUB_OUTPUT"
            echo "repair scope: recovered_no_change"
            exit 0
          fi
          scope=test_only
          while IFS=$'\t' read -r status path _rest; do
            [[ -z "$path" ]] && continue
            if [[ "$status" == D* || "$status" == R* ]]; then
              scope=review_ready
              break
            fi
            case "$path" in
              e2e/**/*.ts) ;;
              *) scope=review_ready; break ;;
            esac
          done < "$RUNNER_TEMP/repair-files"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "repair scope: $scope"
      - name: Validate staging target identity before self-heal probe
        id: staging_target
        if: steps.scope.outputs.scope == 'test_only'
        env:
          FORMORIA_DEPLOYMENT_ENV: staging
          STAGING_BASE_URL: https://staging.formoria.com
          BASE_URL: https://staging.formoria.com
          NEXT_PUBLIC_SITE_URL: https://staging.formoria.com
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec tsx scripts/staging-target-check.ts
      - name: Probe deployed staging infrastructure (two validation-only retries)
        id: infrastructure
        if: steps.scope.outputs.scope == 'test_only' && steps.staging_target.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EXPECTED_REVISION: ${{ steps.freeze.outputs.deployed_app_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 0 1 2; do
            status="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "$STAGING_BASE_URL/about" || true)"
            revision="$(curl --silent --show-error --max-time 15 \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -D - -o /dev/null "$STAGING_BASE_URL/about" \
              | awk -F': ' 'tolower($1) == "x-formoria-revision" {gsub("\\r", "", $2); print $2; exit}' || true)"
            probe="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              "$SUPABASE_URL/rest/v1/brands?select=id&limit=1" || true)"
            if [[ "$status" =~ ^2 ]] && [[ "$revision" == "$EXPECTED_REVISION" ]] && [[ "$probe" =~ ^2 ]]; then
              echo "confirmed=true" >> "$GITHUB_OUTPUT"
              echo "infrastructure probe passed on attempt $attempt"
              exit 0
            fi
            echo "infrastructure probe failed on attempt $attempt: app=$status revision=${revision:-missing} supabase=$probe"
            [[ "$attempt" == 2 ]] || sleep 10
          done
          echo "confirmed=false" >> "$GITHUB_OUTPUT"
          exit 1
      - name: Verify deployed staging revision before repair-test execution
        if: steps.scope.outputs.scope == 'test_only' && steps.infrastructure.outputs.confirmed == 'true'
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EXPECTED_REVISION: ${{ steps.freeze.outputs.deployed_app_sha }}
        run: |
          set -euo pipefail
          revision="$(curl --fail --silent --show-error --location \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -D - -o /dev/null "$STAGING_BASE_URL/about" \
            | awk -F': ' 'tolower($1) == "x-formoria-revision" {gsub("\\r", "", $2); print $2; exit}')"
          [[ "$revision" == "$EXPECTED_REVISION" ]] || {
            echo "::error::staging revision changed during self-heal; refusing certification"
            exit 1
          }
      - name: Verify frozen exact failure set against deployed staging
        id: exact_validation
        if: steps.scope.outputs.scope == 'test_only' && steps.infrastructure.outputs.confirmed == 'true'
        env:
          FORMORIA_DEPLOYMENT_ENV: staging
          STAGING_BASE_URL: https://staging.formoria.com
          BASE_URL: https://staging.formoria.com
          NEXT_PUBLIC_SITE_URL: https://staging.formoria.com
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_SIGNUP_EMAIL_DOMAIN: example.test
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          E2E_ORIGIN_SECRET: ${{ secrets.E2E_ORIGIN_SECRET }}
          CI: "true"
          PLAYWRIGHT_TEST: "true"
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results-exact.json
        run: pnpm exec tsx scripts/selfheal/exact-failure-runner.ts "$RUNNER_TEMP/frozen-failures.json" playwright-results-exact.json
      - name: Reject unexpected exact-set skips
        id: exact_report_gate
        if: always() && steps.exact_validation.outcome != 'skipped'
        run: pnpm exec tsx scripts/e2e-report-gate.ts playwright-results-exact.json scripts/e2e-expected-skips.json
      - name: Verify test-only repair against deployed staging before self-merge
        id: validation
        if: steps.exact_validation.outcome == 'success' && steps.exact_report_gate.outcome == 'success'
        env:
          FORMORIA_DEPLOYMENT_ENV: staging
          STAGING_BASE_URL: https://staging.formoria.com
          BASE_URL: https://staging.formoria.com
          NEXT_PUBLIC_SITE_URL: https://staging.formoria.com
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_SIGNUP_EMAIL_DOMAIN: example.test
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          E2E_ORIGIN_SECRET: ${{ secrets.E2E_ORIGIN_SECRET }}
          CI: "true"
          PLAYWRIGHT_TEST: "true"
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results-validation.json
      - name: Reject unexpected self-heal skips
        id: validation_report_gate
        if: always() && steps.validation.outcome != 'skipped'
        run: pnpm exec tsx scripts/e2e-report-gate.ts playwright-results-validation.json scripts/e2e-expected-skips.json
      - name: Evaluate validated test-only self-merge eligibility
        id: eligibility
        if: steps.scope.outputs.scope == 'test_only' && steps.validation.outcome == 'success' && steps.validation_report_gate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          deployed_sha="${{ steps.freeze.outputs.deployed_app_sha }}"
          repair_sha="${{ steps.checkpoint.outputs.repair_test_sha || steps.freeze.outputs.repair_test_sha }}"
          [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ && "$repair_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::self-merge evidence requires frozen deployed and repair-test SHAs"
            exit 1
          }
          changed_files="$(git diff --name-only "$deployed_sha..$repair_sha" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          deleted_or_renamed_specs="$(git diff --name-status "$deployed_sha..$repair_sha" | awk -F '\t' '$1 ~ /^D|^R/ { if ($2 ~ /^e2e\/.*\.spec\.ts$/) print $2; if ($3 ~ /^e2e\/.*\.spec\.ts$/) print $3 }' | jq -Rsc 'split("\n") | map(select(length > 0))')"
          added_lines="$(git diff --unified=0 "$deployed_sha..$repair_sha" -- e2e | sed -n 's/^+[^+].*/&/p' | jq -Rsc 'split("\n") | map(select(length > 0))')"
          count_at() {
            local sha="$1"
            { git grep -hE '\\btest[[:space:]]*\\(' "$sha" -- e2e || true; } | wc -l | tr -d ' '
          }
          count_now() {
            { rg --no-filename '\\btest[[:space:]]*\\(' e2e --glob '*.ts' || true; } | wc -l | tr -d ' '
          }
          assertion_count_at() {
            local sha="$1"
            { git grep -hE '\\bexpect[[:space:]]*\\(' "$sha" -- e2e || true; } | wc -l | tr -d ' '
          }
          assertion_count_now() {
            { rg --no-filename '\\bexpect[[:space:]]*\\(' e2e --glob '*.ts' || true; } | wc -l | tr -d ' '
          }
          skipped_count_at() {
            local sha="$1"
            { git grep -hE '\\btest\\.skip[[:space:]]*\\(' "$sha" -- e2e || true; } | wc -l | tr -d ' '
          }
          skipped_count_now() {
            { rg --no-filename '\\btest\\.skip[[:space:]]*\\(' e2e --glob '*.ts' || true; } | wc -l | tr -d ' '
          }
          jq -n \
            --slurpfile diagnosis diagnosis.json \
            --argjson changedFiles "$changed_files" \
            --argjson deletedOrRenamedSpecs "$deleted_or_renamed_specs" \
            --argjson addedLines "$added_lines" \
            --argjson testCountBefore "$(count_at "$deployed_sha")" \
            --argjson testCountAfter "$(count_now)" \
            --argjson assertionCountBefore "$(assertion_count_at "$deployed_sha")" \
            --argjson assertionCountAfter "$(assertion_count_now)" \
            --argjson skippedBefore "$(skipped_count_at "$deployed_sha")" \
            --argjson skippedAfter "$(skipped_count_now)" \
            '{diagnosis:$diagnosis[0],changedFiles:$changedFiles,deletedOrRenamedSpecs:$deletedOrRenamedSpecs,addedLines:$addedLines,testCountBefore:$testCountBefore,testCountAfter:$testCountAfter,assertionCountBefore:$assertionCountBefore,assertionCountAfter:$assertionCountAfter,skippedBefore:$skippedBefore,skippedAfter:$skippedAfter}' \
            > "$RUNNER_TEMP/self-merge-evidence.json"
          pnpm exec tsx scripts/selfheal/incident-cli.ts eligibility \
            "$RUNNER_TEMP/self-merge-evidence.json" > "$RUNNER_TEMP/self-merge-eligibility.json"
          jq -e 'type == "object" and (.eligible | type == "boolean") and (.reasons | type == "array")' \
            "$RUNNER_TEMP/self-merge-eligibility.json" >/dev/null
          eligible="$(jq -r '.eligible | tostring' "$RUNNER_TEMP/self-merge-eligibility.json")"
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "self-merge eligibility: $eligible"
      - name: Create review-ready repair record for application changes
        if: steps.scope.outputs.scope == 'review_ready'
        run: echo "Application changes cannot be certified by a deployed staging run; human review and deployment are required."
      - name: Create or update one incident PR for this frozen failure set
        id: incident
        if: steps.scope.outputs.scope == 'test_only' || steps.scope.outputs.scope == 'review_ready'
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_REF: ${{ inputs.repair_ref || '' }}
          REPAIR_BRANCH: ${{ env.REPAIR_BRANCH }}
          READY_TEST_REPAIR: ${{ steps.scope.outputs.scope == 'test_only' && steps.validation.outcome == 'success' && steps.validation_report_gate.outcome == 'success' && steps.eligibility.outputs.eligible == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          number="$INCIDENT_PR_NUMBER"
          if [[ -z "$number" ]]; then
            number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base staging --head "$REPAIR_BRANCH" --json number --jq '.[0].number // empty')"
          fi
          if [[ -z "$number" && "$REPAIR_BRANCH" != selfheal/e2e-* ]]; then
            echo "::error::incident PR requires a selfheal/e2e-* repair branch"
            exit 1
          fi
          if [[ -s diagnosis.json ]]; then
            diagnosis_arg="$(cat diagnosis.json)"
          else
            diagnosis_arg='null'
          fi
          if [[ -s "$RUNNER_TEMP/self-merge-eligibility.json" ]]; then
            eligibility_arg="$(cat "$RUNNER_TEMP/self-merge-eligibility.json")"
          else
            eligibility_arg='{"eligible":false,"reasons":["application repair requires human review"]}'
          fi
          jq -n \
            --arg rootIncidentId "$SOURCE_RUN_ID" \
            --arg rootWorkflowUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/$SOURCE_RUN_ID" \
            --arg currentWorkflowUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --slurpfile frozen "$RUNNER_TEMP/frozen-failures.json" \
            --argjson diagnosis "$diagnosis_arg" \
            --arg repairTestSha "${{ steps.checkpoint.outputs.repair_test_sha || steps.freeze.outputs.repair_test_sha }}" \
            --argjson mergeEligibility "$eligibility_arg" \
            '{rootIncidentId:$rootIncidentId,rootWorkflowUrl:$rootWorkflowUrl,currentWorkflowUrl:$currentWorkflowUrl,frozen:$frozen[0],diagnosis:$diagnosis,cycles:[{cycle:1,commit:$repairTestSha,changedFiles:[]}],exactValidation:"pending",fullValidation:"pending",infrastructureRetries:0,remainingFailures:$frozen[0].failures,mergeEligibility:$mergeEligibility}' \
            > "$RUNNER_TEMP/incident-pr-input.json"
          pnpm exec tsx scripts/selfheal/incident-cli.ts render-pr \
            "$RUNNER_TEMP/incident-pr-input.json" > "$RUNNER_TEMP/incident-pr.md"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/incident-pr.md"
          else
            url="$(gh pr create --repo "$GITHUB_REPOSITORY" --draft --base staging --head "$REPAIR_BRANCH" \
              --title "fix(e2e): staging self-heal $(date +%F)" --label selfheal --body-file "$RUNNER_TEMP/incident-pr.md")"
            number="${url##*/}"
          fi
          if [[ "$READY_TEST_REPAIR" == true ]]; then
            # A validated test-only repair is ready for independent review.
            # A newly created PR cannot be approved in this same job; the
            # review step below records review_ready and the next continuation
            # may reuse INCIDENT_PR_NUMBER without creating a second PR.
            gh pr ready "$number" --repo "$GITHUB_REPOSITORY"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [[ -n "$number" ]]; then
            echo "incident PR: #$number"
          fi
      - name: Reuse one incident PR and require independent review
        id: review
        if: steps.scope.outputs.scope == 'test_only' && steps.validation.outcome == 'success' && steps.validation_report_gate.outcome == 'success' && steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          incident_pr="${{ steps.incident.outputs.number || env.INCIDENT_PR_NUMBER }}"
          if [[ -z "$incident_pr" ]]; then
            echo "incident PR is not supplied; test-only repair remains review_ready"
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(gh pr view "$incident_pr" --json baseRefName --jq '.baseRefName')"
          decision="$(gh pr view "$incident_pr" --json reviewDecision --jq '.reviewDecision')"
          [[ "$base" == "$REPAIR_BASE" ]] || { echo "::error::incident PR must target staging"; exit 1; }
          if [[ "$decision" != APPROVED ]]; then
            echo "independent review is pending; terminal outcome remains review_ready"
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "review_pending=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "approved=true" >> "$GITHUB_OUTPUT"
      - name: Self-merge test-only repair into staging
        id: merge
        if: steps.scope.outputs.scope == 'test_only' && steps.validation.outcome == 'success' && steps.validation_report_gate.outcome == 'success' && steps.eligibility.outputs.eligible == 'true' && steps.review.outputs.approved == 'true' && env.REPAIR_BASE == 'staging'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.checkpoint.outputs.repair_test_sha || steps.freeze.outputs.repair_test_sha }}
        run: |
          set -euo pipefail
          incident_pr="${{ steps.incident.outputs.number || env.INCIDENT_PR_NUMBER }}"
          gh pr merge "$incident_pr" --repo "$GITHUB_REPOSITORY" \
            --squash --match-head-commit "$HEAD_SHA" --delete-branch=false
      - name: Record terminal self-heal outcome
        id: outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          outcome=repair_blocked
          if [[ "${{ steps.scope.outputs.scope }}" == recovered_no_change ]]; then outcome=recovered_no_change; fi
          if [[ "${{ steps.scope.outputs.scope }}" == review_ready ]]; then outcome=review_ready; fi
          if [[ "${{ steps.scope.outputs.scope }}" == infrastructure_blocked ]]; then outcome=infrastructure_blocked; fi
          if [[ "${{ steps.scope.outputs.scope }}" == test_only && "${{ steps.validation.outcome }}" == success && "${{ steps.validation_report_gate.outcome }}" == success && "${{ steps.eligibility.outputs.eligible }}" != true ]]; then outcome=repair_blocked; fi
          if [[ "${{ steps.scope.outputs.scope }}" == test_only && "${{ steps.validation.outcome }}" == success && "${{ steps.validation_report_gate.outcome }}" == success && "${{ steps.eligibility.outputs.eligible }}" == true && "${{ steps.review.outputs.approved }}" != true ]]; then outcome=review_ready; fi
          if [[ "${{ steps.scope.outputs.scope }}" == test_only && "${{ steps.infrastructure.outputs.confirmed }}" != true ]]; then outcome=infrastructure_blocked; fi
          if [[ "${{ steps.merge.outcome }}" == success ]]; then outcome=merged; fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
      - name: Upload frozen self-heal context
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-selfheal-context-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-selfheal-context.json
          if-no-files-found: error
      - name: Report staging self-heal result to Agent Hub
        if: always()
        continue-on-error: true
        env:
          AGENT_HUB_TURSO_DATABASE_URL: ${{ secrets.AGENT_HUB_TURSO_DATABASE_URL }}
          AGENT_HUB_TURSO_AUTH_TOKEN: ${{ secrets.AGENT_HUB_TURSO_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ steps.outcome.outputs.outcome || 'repair_blocked' }}
          SOURCE_RUN_ID: ${{ env.SOURCE_RUN_ID }}
          AUTO_MERGE_ELIGIBLE: ${{ steps.eligibility.outputs.eligible || 'false' }}
          ACTUALLY_MERGED: ${{ steps.merge.outcome == 'success' }}
          INCIDENT_PR_NUMBER: ${{ steps.incident.outputs.number || env.INCIDENT_PR_NUMBER }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success)
              status=success
              severity=ok
              terminal=true
              ;;
            cancelled|skipped)
              status=skipped
              severity=info
              terminal=true
              ;;
            *)
              status=failed
              severity=critical
              terminal=true
              ;;
          esac
          case "$OUTCOME" in
            merged|review_ready|recovered_no_change)
              status=success
              severity=ok
              ;;
          esac
          workflow_started_at=$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | jq -r '.run_started_at')
          report_date=$(TZ=Asia/Taipei date -d "$workflow_started_at" +%F)
          failed_specs='[]'
          report_available=false
          if [ -s "$RUNNER_TEMP/frozen-failures.json" ]; then
            failed_specs=$(jq -c '[.failures[]? | {file: (.file // null), title, project: (.project // null)}]' "$RUNNER_TEMP/frozen-failures.json")
            report_available=true
          fi
          passed=0
          failed=0
          skipped=0
          duration_seconds=0
          for result in playwright-results-validation.json playwright-results-exact.json; do
            if [ -s "$result" ]; then
              passed=$(jq '(.stats.expected // 0) + (.stats.flaky // 0)' "$result")
              failed=$(jq '.stats.unexpected // 0' "$result")
              skipped=$(jq '.stats.skipped // 0' "$result")
              duration_seconds=$(jq '((.stats.duration // 0) / 1000) | round' "$result")
              break
            fi
          done
          pr_url=""
          if [ -n "$INCIDENT_PR_NUMBER" ]; then
            pr_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$INCIDENT_PR_NUMBER"
          fi
          verdict_text="Self-heal outcome: $OUTCOME"
          payload=$(jq -n \
            --arg source_run_id "github-actions:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:selfheal" \
            --arg status "$status" --arg run_at "$workflow_started_at" --arg date "$report_date" \
            --arg verdict_severity "$severity" --arg verdict_text "$verdict_text" \
            --argjson failed_specs "$failed_specs" --arg pr_url "$pr_url" \
            --arg root_source_run_id "$SOURCE_RUN_ID" --argjson terminal "$terminal" \
            --arg outcome "$OUTCOME" --argjson auto_merge_eligible "$AUTO_MERGE_ELIGIBLE" \
            --argjson actually_merged "$ACTUALLY_MERGED" --argjson report_available "$report_available" \
            --argjson passed "$passed" --argjson failed "$failed" --argjson skipped "$skipped" \
            --argjson duration_seconds "$duration_seconds" --arg workflow_url "$WORKFLOW_URL" \
            '{version: 1, source: "github_actions", source_run_id: $source_run_id, routine: "e2e-nightly",
              project: "formoria", status: $status, run_at: $run_at, date: $date,
              verdict_severity: $verdict_severity, verdict_text: $verdict_text, tickets_created: [],
              log_url: $workflow_url, data: {notification_owner: "github_actions", phase: "selfheal",
              root_source_run_id: $root_source_run_id, repair_cycle: 1, terminal: $terminal,
              outcome: $outcome, continuation_kind: "none", validation_scope: "exact_and_full",
              infrastructure_retries: 0, merge_policy: "test_only_safe",
              auto_merge_eligible: $auto_merge_eligible, actually_merged: $actually_merged,
              report_available: $report_available, targeted_attempts: 0,
              model_usage: {cost_usd: null, turns: null, duration_ms: null},
              failed_specs: $failed_specs, pr_url: $pr_url,
              validation: {passed: $passed, failed: $failed, skipped: $skipped,
              duration_seconds: $duration_seconds}, workflow_url: $workflow_url}}')
          printf '%s' "$payload" > /tmp/formoria-e2e-selfheal.json
          node scripts/agent-hub/report-run.mjs --file /tmp/formoria-e2e-selfheal.json

      - name: Notify terminal staging self-heal result
        if: always()
        continue-on-error: true
        env:
          E2E_SLACK_PHASE: ${{ steps.outcome.outputs.outcome }}
          E2E_SLACK_LABEL: E2E Staging (Self-heal)
          E2E_SLACK_SCOPE: Staging-only repair verification
          E2E_SLACK_TARGET: https://staging.formoria.com
          E2E_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_STATUS: ${{ job.status }}
          SLACK_FORMORIA_WEBHOOK_URL: ${{ secrets.SLACK_FORMORIA_WEBHOOK_URL }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm exec tsx scripts/notifications/e2e-slack.ts
