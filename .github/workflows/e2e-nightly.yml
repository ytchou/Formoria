name: E2E Nightly (Deep)

on:
  schedule:
    # 04:05 Asia/Taipei. The whole morning cluster is scheduled backwards from a
    # 06:30 Taipei "everything is ready" deadline, against measured worst cases:
    # ~50 min of GitHub scheduler drift plus a ~56 min red self-heal night. This
    # one goes first because it is the longest: on a red night its self-heal job
    # needs a window to push a repair before the later runs read the result.
    # It is the sole member of the `formoria-agent-writer` concurrency group.
    - cron: "5 20 * * *"
  workflow_dispatch:
    inputs:
      selfheal_only:
        description: "Skip nightly tests, run selfheal from a previous run"
        type: boolean
        default: false
      source_run_id:
        description: "Source run ID for selfheal (required when selfheal_only)"
        type: string
        default: ""
      source_artifact_name:
        description: "Artifact containing the previous round's failure bundle"
        type: string
        default: "playwright-report-nightly"
      source_failure_state:
        description: "JSON fallback with prior failed-spec count and entries when context is unavailable"
        type: string
        default: ""
      root_source_run_id:
        description: "Original failing run ID propagated between repair rounds"
        type: string
        default: ""
      repair_branch:
        description: "Existing selfheal/e2e-* branch to continue"
        type: string
        default: ""
      repair_base:
        description: "Manual-only repair base; non-default bases must be selfheal-test/*"
        type: string
        default: ""
      previous_state:
        description: "Previous repair-state fingerprint for no-progress detection"
        type: string
        default: ""
      repair_cycle:
        description: "Bounded repair cycle (1, 2, or 3)"
        type: choice
        options: ["1", "2", "3"]
        default: "1"
      continuation_kind:
        description: "Incident continuation kind"
        type: choice
        options: ["repair", "infrastructure", "base-sync"]
        default: "repair"
      validation_scope:
        description: "Validation scope resumed by this continuation"
        type: choice
        options: ["exact", "full"]
        default: "exact"
      infrastructure_retries:
        description: "Incident-wide infrastructure retry count (0-2)"
        type: choice
        options: ["0", "1", "2"]
        default: "0"
      base_sync_attempts:
        description: "Incident-wide base-sync count (0-2)"
        type: choice
        options: ["0", "1", "2"]
        default: "0"
      incident_pr_number:
        description: "Existing draft PR number for this incident"
        type: string
        default: ""
      e2e_grep:
        description: "Optional Playwright grep regex for a focused manual run"
        type: string
        default: ""

concurrency:
  group: formoria-agent-writer
  cancel-in-progress: false

jobs:
  e2e-deep:
    if: inputs.selfheal_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      failed: ${{ steps.nightly_report.outputs.failed }}
      failed_specs: ${{ steps.nightly_report.outputs.failed_specs }}
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CHALLENGE_SECRET: ${{ secrets.CHALLENGE_SECRET }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      PLAYWRIGHT_TEST: "true"
      E2E_GREP: ${{ inputs.e2e_grep }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        id: setup_pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        id: setup_node
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Restore Next.js build cache
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-
      - name: Build Next.js (production)
        id: build
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee "$RUNNER_TEMP/formoria-build.log"
      - name: Install Playwright browsers
        id: browsers
        run: npx playwright install chromium
      - name: Run nightly Playwright tests
        id: e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
          PLAYWRIGHT_LAST_RUN_OUTPUT_FILE: playwright-last-run.json
        run: |
          TEST_ARGS=(--project=deep --project=mobile --last-failed-file playwright-last-run.json --reporter=html,json)
          if [ -n "$E2E_GREP" ]; then
            TEST_ARGS+=(--grep "$E2E_GREP")
          fi
          pnpm exec playwright test "${TEST_ARGS[@]}"
      # Uploaded on green runs too, unlike the failure report below. A test that
      # fails and passes on retry is reported "flaky" and the run is green — so
      # the only record of it lived in an artifact that green runs never wrote,
      # which is why this suite could not measure its own flake rate (DEV-1414).
      # Kept small (JSON only, no traces) and retained long enough for a history
      # to accumulate; `scripts/flake-report.mjs` aggregates it.
      - name: Upload results JSON for flake history
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results-history
          path: playwright-results.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Prepare nightly failure report
        if: >-
          always() &&
          (
            steps.checkout.outcome == 'failure' ||
            steps.setup_pnpm.outcome == 'failure' ||
            steps.setup_node.outcome == 'failure' ||
            steps.install.outcome == 'failure' ||
            steps.cache.outcome == 'failure' ||
            steps.build.outcome == 'failure' ||
            steps.browsers.outcome == 'failure' ||
            steps.e2e.outcome == 'failure'
          )
        id: nightly_report
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSERS_OUTCOME: ${{ steps.browsers.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          SETUP_NODE_OUTCOME: ${{ steps.setup_node.outcome }}
          SETUP_PNPM_OUTCOME: ${{ steps.setup_pnpm.outcome }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          REPORT_DIR="$RUNNER_TEMP/formoria-nightly-report"
          rm -rf "$REPORT_DIR"
          mkdir -p "$REPORT_DIR"

          if [ "$BUILD_OUTCOME" = "failure" ] && [ -s "$RUNNER_TEMP/formoria-build.log" ]; then
            cp "$RUNNER_TEMP/formoria-build.log" "$REPORT_DIR/build.log"
          fi
          if [ -d playwright-report ]; then
            cp -R playwright-report "$REPORT_DIR/playwright-report"
          fi
          if [ -d test-results ]; then
            cp -R test-results "$REPORT_DIR/test-results"
          fi

          if [ -s playwright-results.json ]; then
            cp playwright-results.json "$REPORT_DIR/playwright-results.json"
          else
            FAILED_STEP="workflow setup"
            if [ "$BUILD_OUTCOME" = "failure" ]; then
              FAILED_STEP="Next.js build"
            elif [ "$E2E_OUTCOME" = "failure" ]; then
              FAILED_STEP="Playwright test execution"
            elif [ "$BROWSERS_OUTCOME" = "failure" ]; then
              FAILED_STEP="Playwright browser installation"
            elif [ "$INSTALL_OUTCOME" = "failure" ]; then
              FAILED_STEP="dependency installation"
            elif [ "$SETUP_NODE_OUTCOME" = "failure" ]; then
              FAILED_STEP="Node.js setup"
            elif [ "$SETUP_PNPM_OUTCOME" = "failure" ]; then
              FAILED_STEP="pnpm setup"
            elif [ "$CHECKOUT_OUTCOME" = "failure" ]; then
              FAILED_STEP="repository checkout"
            fi

            jq -n \
              --arg failed_step "$FAILED_STEP" \
              --arg workflow_url "$WORKFLOW_URL" \
              '{
                version: "1.0",
                suites: [{
                  title: "Workflow failure",
                  file: null,
                  specs: [{
                    title: ("\($failed_step) failed before a Playwright report was available. Inspect \($workflow_url)"),
                    ok: false,
                    tests: []
                  }]
                }],
                stats: {duration: 0, expected: 0, skipped: 0, unexpected: 1, flaky: 0}
              }' > "$REPORT_DIR/playwright-results.json"
          fi
          if [ ! -s playwright-results.json ]; then
            cp "$REPORT_DIR/playwright-results.json" playwright-results.json
          fi
          if [ -s playwright-last-run.json ]; then
            cp playwright-last-run.json "$REPORT_DIR/playwright-last-run.json"
          fi

          jq \
            --arg source_run_id "$GITHUB_RUN_ID" \
            --arg source_workflow_url "$WORKFLOW_URL" \
            --arg source_sha "$GITHUB_SHA" \
            --arg repair_base "$GITHUB_REF_NAME" \
            --arg e2e_grep "$E2E_GREP" \
            'def all_suites: .suites[]? | ., all_suites;
             [all_suites as $suite |
               $suite.specs[]? as $spec |
               select($spec.ok == false) |
               {
                 file: ($suite.file // null),
                 title: $spec.title,
                 project: ([$spec.tests[]?.projectName // empty] | unique | .[0] // "deep"),
                 errors: ([$spec.tests[]?.results[]?.errors[]? | (.message // .value // tostring)] | unique)
               }
             ] as $failures |
             {
               version: 1,
               source_run_id: $source_run_id,
               source_workflow_url: $source_workflow_url,
               source_sha: $source_sha,
               repair_base: $repair_base,
               e2e_grep: $e2e_grep,
               failures: $failures,
               clusters: ($failures | sort_by([.project, (.file // "")]) | group_by([.project, (.file // "")]) | map({project: .[0].project, file: .[0].file, failures: .}))
             }' "$REPORT_DIR/playwright-results.json" > "$REPORT_DIR/selfheal-context.json"
          printf '[]\n' > "$REPORT_DIR/repair-ledger.json"
          echo "failed=$(jq '.failures | length' "$REPORT_DIR/selfheal-context.json")" >> "$GITHUB_OUTPUT"
          echo "failed_specs=$(jq -c '[.failures[]? | {file: (.file // null), title, project: (.project // null)}]' "$REPORT_DIR/selfheal-context.json")" >> "$GITHUB_OUTPUT"
          echo "report_dir=$REPORT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload nightly failure report
        if: always() && steps.nightly_report.outputs.report_dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-nightly
          path: ${{ steps.nightly_report.outputs.report_dir }}
          if-no-files-found: error
          retention-days: 7
      - name: Report E2E results to Agent Hub
        if: ${{ always() }}
        continue-on-error: true
        env:
          AGENT_HUB_INGEST_URL: ${{ secrets.AGENT_HUB_INGEST_URL }}
          AGENT_HUB_INGEST_TOKEN: ${{ secrets.AGENT_HUB_INGEST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          ROOT_INCIDENT_ID: ${{ github.run_id }}
        run: |
          case "$JOB_STATUS" in
            success) agent_hub_status=success ;;
            failure) agent_hub_status=failed ;;
            cancelled|skipped) agent_hub_status=skipped ;;
            *) agent_hub_status=failed ;;
          esac
          workflow_started_at=$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | jq -r '.run_started_at')
          report_date=$(TZ=Asia/Taipei date -d "$workflow_started_at" +%F)
          if [ -f playwright-results.json ]; then
            total_specs=$(jq '(.stats.expected // 0) + (.stats.unexpected // 0) + (.stats.skipped // 0) + (.stats.flaky // 0)' playwright-results.json)
            passed=$(jq '(.stats.expected // 0) + (.stats.flaky // 0)' playwright-results.json)
            failed=$(jq '.stats.unexpected // 0' playwright-results.json)
            skipped=$(jq '.stats.skipped // 0' playwright-results.json)
            duration_seconds=$(jq '((.stats.duration // 0) / 1000) | round' playwright-results.json)
            failed_specs=$(jq -c '[.suites[]? | recurse(.suites[]?) as $suite | $suite.specs[]? | select(.ok == false) | {file: ($suite.file // null), title}]' playwright-results.json)
          else
            total_specs=0; passed=0; failed=0; skipped=0; duration_seconds=0; failed_specs='[]'
          fi
          verdict_text="E2E: $JOB_STATUS -- $passed specs passed, $failed failed"
          payload=$(jq -n \
            --arg source_run_id "github-actions:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:test" \
            --arg status "$agent_hub_status" --arg run_at "$workflow_started_at" --arg date "$report_date" \
            --arg verdict_severity "$([ "$agent_hub_status" = success ] && echo ok || echo critical)" \
            --arg verdict_text "$verdict_text" --argjson total_specs "$total_specs" --argjson passed "$passed" \
            --argjson failed "$failed" --argjson skipped "$skipped" --argjson duration_seconds "$duration_seconds" \
            --argjson failed_specs "$failed_specs" --arg workflow_url "$WORKFLOW_URL" \
            '{version: 1, source: "github_actions", source_run_id: $source_run_id, routine: "e2e-nightly",
              project: "formoria", status: $status, run_at: $run_at, date: $date,
              verdict_severity: $verdict_severity, verdict_text: $verdict_text, tickets_created: [],
              log_url: $workflow_url, data: {notification_owner: "github_actions", phase: "test", root_source_run_id: env.GITHUB_RUN_ID,
              repair_cycle: 0, terminal: ($status == "success"), outcome: (if $status == "success" then "ready" else "failed" end),
              targeted_attempts: 0, model_usage: {cost_usd: null, turns: null, duration_ms: null}, total_specs: $total_specs, passed: $passed,
              failed: $failed, skipped: $skipped, duration_seconds: $duration_seconds,
              failed_specs: $failed_specs, workflow_url: $workflow_url}}')
          printf '%s' "$payload" > /tmp/formoria-e2e-nightly.json
          node scripts/agent-hub/report-run.mjs --file /tmp/formoria-e2e-nightly.json
      - name: Notify Slack of initial E2E result
        if: ${{ always() }}
        continue-on-error: true
        env:
          E2E_SLACK_PHASE: initial
          E2E_SLACK_LABEL: E2E Nightly (Deep)
          E2E_SLACK_SCOPE: Full deep + mobile suite against a build of main
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          ROOT_INCIDENT_ID: ${{ github.run_id }}
          SELFHEAL_ENABLED: ${{ vars.SELFHEAL_ENABLED }}
          SLACK_FORMORIA_WEBHOOK_URL: ${{ secrets.SLACK_FORMORIA_WEBHOOK_URL }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm exec tsx scripts/notifications/e2e-slack.ts
      - name: Create or update nightly failure issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: >-
          always() &&
          (steps.build.outcome == 'failure' || steps.e2e.outcome == 'failure')
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labelName = 'e2e-nightly';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            try {
              await github.rest.issues.getLabel({ owner, repo, name: labelName });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({
                  owner, repo, name: labelName, color: 'd73a4a',
                  description: 'Nightly deep Playwright e2e failures',
                });
              } catch (createError) {
                if (createError.status !== 422) throw createError;
              }
            }
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: labelName,
            });
            const body = `Nightly deep Playwright run failed.\n\nFailed run: ${runUrl}`;
            if (openIssues.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: openIssues[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title: 'Nightly e2e failing', labels: [labelName], body,
              });
            }

  selfheal:
    needs: [e2e-deep]
    if: >-
      always() &&
      (needs.e2e-deep.result == 'failure' ||
       (github.event_name == 'workflow_dispatch' && inputs.selfheal_only == true))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      blocked_reason: ${{ steps.terminal_state.outputs.blocked_reason }}
      continuation_dispatched: ${{ steps.terminal_state.outputs.continuation_dispatched }}
      failed: ${{ steps.terminal_state.outputs.failed }}
      failed_specs: ${{ steps.terminal_state.outputs.failed_specs }}
      passed: ${{ steps.terminal_state.outputs.passed }}
      pr_url: ${{ steps.pr.outputs.pr_url || steps.incident_pr.outputs.pr_url || steps.existing_pr.outputs.pr_url || steps.blocked_pr.outputs.pr_url }}
      report_available: ${{ steps.terminal_state.outputs.report_available }}
      skipped: ${{ steps.terminal_state.outputs.skipped }}
      terminal_outcome: ${{ steps.terminal_state.outputs.terminal_outcome }}
      merge_commit_sha: ${{ steps.merge.outputs.merge_commit_sha }}
      auto_merge_eligible: ${{ steps.merge_policy.outputs.eligible || 'false' }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CHALLENGE_SECRET: ${{ secrets.CHALLENGE_SECRET }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      PLAYWRIGHT_TEST: "true"
      E2E_GREP: ${{ inputs.e2e_grep }}
    steps:
      - name: Guard
        id: guard
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.SELFHEAL_PAT }}
          REPAIR_BASE_INPUT: ${{ inputs.repair_base }}
          REPAIR_BRANCH: ${{ inputs.repair_branch }}
          SELFHEAL_ENABLED: ${{ vars.SELFHEAL_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.selfheal_only }}" == "true" && -z "${{ inputs.source_run_id }}" ]]; then
            echo "::error::source_run_id is required when selfheal_only is true"
            exit 1
          fi
          if [[ "$SELFHEAL_ENABLED" != "true" ]]; then
            echo "SELFHEAL_ENABLED is not true, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REPAIR_BASE="${REPAIR_BASE_INPUT:-$DEFAULT_BRANCH}"
          if [[ "${{ github.event_name }}" != "workflow_dispatch" && "$REPAIR_BASE" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::scheduled runs must repair the default branch"
            exit 1
          fi
          if [[ "$REPAIR_BASE" != "$DEFAULT_BRANCH" && "$REPAIR_BASE" != selfheal-test/* ]]; then
            echo "::error::manual non-default repair_base must use selfheal-test/*"
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$REPAIR_BASE" >/dev/null; then
            echo "::error::repair_base does not exist: $REPAIR_BASE"
            exit 1
          fi
          echo "repair_base=$REPAIR_BASE" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$REPAIR_BASE" >> "$GITHUB_OUTPUT"

          if [[ -n "$REPAIR_BRANCH" ]]; then
            if [[ "$REPAIR_BRANCH" != selfheal/e2e-* ]]; then
              echo "::error::repair_branch must use the selfheal/e2e-* prefix"
              exit 1
            fi
            if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$REPAIR_BRANCH" >/dev/null; then
              echo "::error::repair_branch does not exist: $REPAIR_BRANCH"
              exit 1
            fi
            echo "checkout_ref=$REPAIR_BRANCH" >> "$GITHUB_OUTPUT"
          elif gh pr list --repo "$GITHUB_REPOSITORY" --state open --label selfheal --json number --jq length | grep -qv '^0$'; then
            echo "Open selfheal PR exists, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.SELFHEAL_PAT }}
          fetch-depth: 0
          ref: ${{ steps.guard.outputs.checkout_ref || inputs.repair_base || github.ref }}

      - name: Download nightly report from this run
        if: always() && steps.guard.outputs.skip != 'true' && inputs.selfheal_only != true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: playwright-report-nightly
          path: /tmp/playwright-report

      - name: Download report from a previous round
        if: always() && steps.guard.outputs.skip != 'true' && inputs.selfheal_only == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.source_run_id }}" -n "${{ inputs.source_artifact_name }}" -D /tmp/playwright-report

      - name: Prepare self-heal input
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          REPAIR_BASE: ${{ steps.guard.outputs.repair_base }}
          ROOT_SOURCE_RUN_ID: ${{ inputs.root_source_run_id || inputs.source_run_id || github.run_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || github.run_id }}
          SOURCE_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.source_run_id || github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/playwright-report
          if [ ! -s /tmp/playwright-report/playwright-results.json ]; then
            jq -n --arg workflow_url "$SOURCE_WORKFLOW_URL" \
              '{version: "1.0", suites: [{title: "Workflow failure", file: null,
                specs: [{title: ("The source run did not provide a Playwright report. Inspect " + $workflow_url), ok: false, tests: []}]}],
                stats: {duration: 0, expected: 0, skipped: 0, unexpected: 1, flaky: 0}}' \
              > /tmp/playwright-report/playwright-results.json
          fi
          if [ ! -s /tmp/playwright-report/selfheal-context.json ]; then
            jq --arg source_run_id "$ROOT_SOURCE_RUN_ID" --arg source_workflow_url "$SOURCE_WORKFLOW_URL" \
              --arg source_sha "$GITHUB_SHA" --arg repair_base "$REPAIR_BASE" --arg e2e_grep "$E2E_GREP" \
              'def all_suites: .suites[]? | ., all_suites;
               [all_suites as $suite | $suite.specs[]? as $spec | select($spec.ok == false) |
                 {file: ($suite.file // null), title: $spec.title,
                  project: ([$spec.tests[]?.projectName // empty] | unique | .[0] // "deep"),
                  errors: ([$spec.tests[]?.results[]?.errors[]? | (.message // .value // tostring)] | unique)}
               ] as $failures |
               {version: 1, source_run_id: $source_run_id, source_workflow_url: $source_workflow_url,
                source_sha: $source_sha, repair_base: $repair_base, e2e_grep: $e2e_grep,
                failures: $failures,
                clusters: ($failures | sort_by([.project, (.file // "")]) | group_by([.project, (.file // "")]) | map({project: .[0].project, file: .[0].file, failures: .}))}' \
              /tmp/playwright-report/playwright-results.json > /tmp/playwright-report/selfheal-context.json
          fi
          if [ ! -s /tmp/playwright-report/repair-ledger.json ]; then
            printf '[]\n' > /tmp/playwright-report/repair-ledger.json
          fi
          if [ -s /tmp/playwright-report/playwright-last-run.json ]; then
            cp /tmp/playwright-report/playwright-last-run.json playwright-last-run.json
          else
            jq -r '.failures[]?.file // empty' /tmp/playwright-report/selfheal-context.json | sort -u > legacy-failed-specs.txt
            if [ ! -s legacy-failed-specs.txt ]; then
              printf '{"status":"passed","failedTests":[]}\n' > playwright-last-run.json
            fi
          fi
          if [ -s /tmp/playwright-report/playwright-last-run-frozen.json ]; then
            cp /tmp/playwright-report/playwright-last-run-frozen.json playwright-last-run-frozen.json
          elif [ -s playwright-last-run.json ]; then
            cp playwright-last-run.json playwright-last-run-frozen.json
          fi

      - name: Context
        if: steps.guard.outputs.skip != 'true'
        id: context
        run: |
          set -euo pipefail
          CONTEXT=/tmp/playwright-report/selfheal-context.json
          FAILED_SPECS=$(jq -c '[.failures[] | {project, file, title}]' "$CONTEXT")
          echo "failed_specs=$FAILED_SPECS" >> "$GITHUB_OUTPUT"
          echo "repair_cycle=${{ inputs.repair_cycle || '1' }}" >> "$GITHUB_OUTPUT"

          TOTAL_SPECS=$(jq '.failures | length' "$CONTEXT")
          SUITE_SIZE=$(jq '(.stats.expected // 0) + (.stats.unexpected // 0) + (.stats.skipped // 0) + (.stats.flaky // 0)' /tmp/playwright-report/playwright-results.json)
          SYSTEMIC=$(( TOTAL_SPECS * 100 / (SUITE_SIZE > 0 ? SUITE_SIZE : 1) > 25 ? 1 : 0 ))
          echo "systemic=$SYSTEMIC" >> "$GITHUB_OUTPUT"
          echo "source_workflow_url=$(jq -r '.source_workflow_url' "$CONTEXT")" >> "$GITHUB_OUTPUT"

      - name: Create branch
        if: steps.guard.outputs.skip != 'true'
        id: branch
        env:
          REPAIR_BRANCH: ${{ inputs.repair_branch }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          BRANCH="${REPAIR_BRANCH:-selfheal/e2e-${GITHUB_RUN_ID}}"
          git checkout -B "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Sync repair branch with repair base
        if: steps.guard.outputs.skip != 'true'
        id: sync
        env:
          REPAIR_BASE: ${{ steps.guard.outputs.repair_base }}
        run: |
          set -euo pipefail
          git fetch origin "$REPAIR_BASE" --prune
          git rebase "origin/$REPAIR_BASE"
          CONTEXT_HASH=$(jq -cS '.failures' /tmp/playwright-report/selfheal-context.json | sha256sum | cut -d' ' -f1)
          TREE_HASH=$(git rev-parse 'HEAD^{tree}')
          STATE_BEFORE=$(printf '%s:%s' "$TREE_HASH" "$CONTEXT_HASH" | sha256sum | cut -d' ' -f1)
          echo "state_before=$STATE_BEFORE" >> "$GITHUB_OUTPUT"

      - name: Resolve existing incident PR
        if: inputs.incident_pr_number != ''
        id: existing_pr
        env:
          GH_TOKEN: ${{ secrets.SELFHEAL_PAT }}
        run: echo "pr_url=$(gh pr view '${{ inputs.incident_pr_number }}' --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.guard.outputs.skip != 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - name: Restore Next.js build cache
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-
      - name: Install Playwright browsers
        if: steps.guard.outputs.skip != 'true'
        run: npx playwright install chromium

      - name: Freeze complete failure set
        if: steps.guard.outputs.skip != 'true'
        run: |
          jq '[.failures[] | {file, title, project}]' /tmp/playwright-report/selfheal-context.json \
            > "$RUNNER_TEMP/source-failures.json"
          pnpm exec tsx scripts/selfheal/incident-cli.ts freeze \
            "$RUNNER_TEMP/source-failures.json" > /tmp/playwright-report/frozen-failures.json

      - name: Probe Supabase infrastructure
        if: steps.guard.outputs.skip != 'true'
        id: infrastructure
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          PROBE_KEY="$SUPABASE_SERVICE_ROLE_KEY"
          PROBE_AUTHENTICATED=false
          PROBE_AUTH_MODE=none
          if [ -n "$PROBE_KEY" ]; then
            PROBE_AUTHENTICATED=true
            PROBE_AUTH_MODE=service_role
          fi
          START_MS=$(date +%s%3N)
          HTTP_STATUS=$(curl --silent --show-error --max-time 10 \
            --output "$RUNNER_TEMP/supabase-probe-body.json" --write-out '%{http_code}' \
            -H "apikey: $PROBE_KEY" -H "Authorization: Bearer $PROBE_KEY" \
            -H 'Accept: application/json' \
            "$SUPABASE_URL/rest/v1/brands?select=id&limit=1" || true)
          HTTP_STATUS="${HTTP_STATUS: -3}"
          HTTP_STATUS_NUMBER=$((10#${HTTP_STATUS:-000}))
          LATENCY_MS=$(( $(date +%s%3N) - START_MS ))
          PROBE_OK=false
          [[ "$PROBE_AUTHENTICATED" == true && "$HTTP_STATUS" =~ ^2 ]] && PROBE_OK=true
          jq -n --argjson authenticated "$PROBE_AUTHENTICATED" --argjson ok "$PROBE_OK" \
            --argjson status "$HTTP_STATUS_NUMBER" \
            --arg auth_mode "$PROBE_AUTH_MODE" \
            '{authenticated:$authenticated,auth_mode:$auth_mode,ok:$ok,status:$status}' \
            > "$RUNNER_TEMP/supabase-probe.json"
          jq -n --arg operation lightweight_authenticated_query \
            --argjson status "$HTTP_STATUS_NUMBER" --argjson latency_ms "$LATENCY_MS" \
            --arg auth_mode "$PROBE_AUTH_MODE" \
            --arg response_content_type application_json \
            '{event:"e2e_selfheal_infrastructure_probe",request:{operation:$operation,auth_mode:$auth_mode,limit:1},response:{status:$status,content_type:$response_content_type},latency_ms:$latency_ms}'
          jq -n \
            --argjson errors "$(jq -c '[.failures[]?.errors[]?]' /tmp/playwright-report/selfheal-context.json)" \
            --argjson probe "$(cat "$RUNNER_TEMP/supabase-probe.json")" \
            '{errors:$errors,probe:$probe}' > "$RUNNER_TEMP/infrastructure-evidence.json"
          pnpm exec tsx scripts/selfheal/incident-cli.ts classify-infrastructure \
            "$RUNNER_TEMP/infrastructure-evidence.json" > /tmp/playwright-report/infrastructure.json
          echo "confirmed=$(jq -r .confirmed /tmp/playwright-report/infrastructure.json)" >> "$GITHUB_OUTPUT"

      - name: Prepare infrastructure continuation bundle
        if: steps.infrastructure.outputs.confirmed == 'true' && inputs.infrastructure_retries != '2'
        id: infrastructure_bundle
        run: |
          mkdir -p "$RUNNER_TEMP/selfheal-infrastructure"
          cp -R /tmp/playwright-report/. "$RUNNER_TEMP/selfheal-infrastructure/"
          if [ -s playwright-last-run-frozen.json ]; then
            cp playwright-last-run-frozen.json "$RUNNER_TEMP/selfheal-infrastructure/"
          fi
      - name: Upload infrastructure continuation bundle
        if: steps.infrastructure_bundle.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-selfheal-infrastructure
          path: ${{ runner.temp }}/selfheal-infrastructure
          retention-days: 7

      - name: Dispatch infrastructure-only retry
        if: steps.infrastructure.outputs.confirmed == 'true' && inputs.infrastructure_retries != '2' && steps.infrastructure_bundle.outcome == 'success'
        id: continue_infrastructure
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_BASE: ${{ steps.guard.outputs.repair_base }}
          REPAIR_BRANCH: ${{ steps.branch.outputs.branch }}
          ROOT_SOURCE_RUN_ID: ${{ inputs.root_source_run_id || inputs.source_run_id || github.run_id }}
        run: |
          git push origin "$REPAIR_BRANCH" --force-with-lease
          NEXT_RETRY=$(( ${{ inputs.infrastructure_retries || '0' }} + 1 ))
          gh workflow run e2e-nightly.yml --repo "$GITHUB_REPOSITORY" --ref "$REPAIR_BASE" \
            --field selfheal_only=true --field source_run_id="$GITHUB_RUN_ID" \
            --field source_artifact_name=playwright-report-selfheal-infrastructure \
            --field root_source_run_id="$ROOT_SOURCE_RUN_ID" --field repair_branch="$REPAIR_BRANCH" \
            --field repair_base="$REPAIR_BASE" --field continuation_kind=infrastructure \
            --field validation_scope="${{ inputs.validation_scope || 'exact' }}" \
            --field infrastructure_retries="$NEXT_RETRY" --field repair_cycle="${{ inputs.repair_cycle || '1' }}" \
            --field base_sync_attempts="${{ inputs.base_sync_attempts || '0' }}" \
            --field incident_pr_number="${{ inputs.incident_pr_number }}"
          echo "dispatched=true" >> "$GITHUB_OUTPUT"

      - name: Diagnose complete failure set
        if: steps.guard.outputs.skip != 'true' && steps.infrastructure.outputs.confirmed != 'true' && inputs.continuation_kind != 'base-sync' && inputs.continuation_kind != 'infrastructure'
        id: diagnose
        uses: anthropics/claude-code-action@fa7e2f0a29a126f0b81cdcf360561b36e44cf608 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.SELFHEAL_PAT }}
          allowed_bots: github-actions
          additional_permissions: |
            actions: read
          prompt: |
            Read .github/selfheal/diagnose.md and diagnose every ID in
            /tmp/playwright-report/frozen-failures.json. The complete evidence is
            in /tmp/playwright-report. Do not edit files or execute Playwright.
            root_workflow_url: ${{ steps.context.outputs.source_workflow_url }}
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(gh run view:*),Bash(ls:*),Bash(find:*),Bash(sed:*),Bash(cat:*),Bash(pwd:*)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["version","failureSetHash","failures","clusters","complete"],"properties":{"version":{"const":1},"failureSetHash":{"type":"string"},"failures":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["id","file","title","project","category","rootCauseKey","actionable","reason"],"properties":{"id":{"type":"string"},"file":{"type":["string","null"]},"title":{"type":"string"},"project":{"type":"string"},"category":{"enum":["test-drift","seed-drift","app-regression","env-flake","flaky-suspect"]},"rootCauseKey":{"type":"string"},"actionable":{"type":"boolean"},"reason":{"type":"string"}}}},"clusters":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["rootCauseKey","failureIds","category","actionable","plannedFiles","diagnosis","repairPlan"],"properties":{"rootCauseKey":{"type":"string"},"failureIds":{"type":"array","items":{"type":"string"}},"category":{"type":"string"},"actionable":{"type":"boolean"},"plannedFiles":{"type":"array","items":{"type":"string"}},"diagnosis":{"type":"string"},"repairPlan":{"type":"string"}}}},"complete":{"const":true}}}'

      - name: Validate diagnosis artifact
        if: steps.diagnose.outcome == 'success'
        env:
          DIAGNOSIS_RESULT: ${{ steps.diagnose.outputs.structured_output }}
        run: |
          printf '%s' "$DIAGNOSIS_RESULT" > /tmp/playwright-report/diagnosis.json
          pnpm exec tsx scripts/selfheal/incident-cli.ts validate-diagnosis \
            /tmp/playwright-report/frozen-failures.json /tmp/playwright-report/diagnosis.json \
            > "$RUNNER_TEMP/validated-diagnosis.json"
          mv "$RUNNER_TEMP/validated-diagnosis.json" /tmp/playwright-report/diagnosis.json

      - name: Repair every actionable cluster
        if: steps.diagnose.outcome == 'success'
        id: fix
        uses: anthropics/claude-code-action@fa7e2f0a29a126f0b81cdcf360561b36e44cf608 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.SELFHEAL_PAT }}
          allowed_bots: github-actions
          additional_permissions: |
            actions: read
          prompt: |
            Read .github/selfheal/triage-fix.md for your full instructions.
            Implement every actionable cluster in the validated artifact at
            /tmp/playwright-report/diagnosis.json. The frozen set is at
            /tmp/playwright-report/frozen-failures.json. Do not run tests,
            Playwright, or a build. Do not commit or push.
          claude_args: >-
            --max-turns 120
            --allowedTools "Read,Write,Edit,Replace,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(gh run view:*),Bash(ls:*),Bash(find:*),Bash(sed:*),Bash(cat:*),Bash(pwd:*)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["version","failureSetHash","addressedFailureIds","addressedRootCauseKeys","changedFiles","summary","remainingWork","complete"],"properties":{"version":{"const":1},"failureSetHash":{"type":"string"},"addressedFailureIds":{"type":"array","items":{"type":"string"}},"addressedRootCauseKeys":{"type":"array","items":{"type":"string"}},"changedFiles":{"type":"array","items":{"type":"string"}},"summary":{"type":"string"},"remainingWork":{"type":"array","items":{"type":"string"}},"complete":{"const":true}}}'

      - name: Checkpoint repair progress
        if: always() && steps.guard.outputs.skip != 'true' && steps.fix.outcome != 'skipped'
        id: checkpoint
        env:
          FIX_RESULT: ${{ steps.fix.outputs.structured_output }}
          FIX_OUTCOME: ${{ steps.fix.outcome }}
          PREVIOUS_STATE: ${{ inputs.previous_state }}
          REPAIR_BRANCH: ${{ steps.branch.outputs.branch }}
          STATE_BEFORE: ${{ steps.sync.outputs.state_before }}
        run: |
          set -euo pipefail
          TRACKED_FILES=$(git diff --name-only | sed '/^$/d' | sort -u)
          UNTRACKED_FILES=$(git ls-files --others --exclude-standard | sed '/^$/d' | sort -u)
          SCRATCH_DIR="$RUNNER_TEMP/selfheal-scratch"
          mkdir -p "$SCRATCH_DIR"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              e2e/*|src/*|playwright-last-run.json|legacy-failed-specs.txt|playwright-results-targeted.json) ;;
              *) mkdir -p "$SCRATCH_DIR/$(dirname "$path")"; mv "$path" "$SCRATCH_DIR/$path" ;;
            esac
          done <<< "$UNTRACKED_FILES"
          CHANGED_FILES=$(printf '%s\n%s\n' "$TRACKED_FILES" "$(git ls-files --others --exclude-standard e2e src)" | sed '/^$/d' | sort -u)
          DECLARED_FILES=""
          if [ -n "$FIX_RESULT" ] && echo "$FIX_RESULT" | jq -e . >/dev/null; then
            DECLARED_FILES=$(echo "$FIX_RESULT" | jq -r '.changedFiles[]?' | sort -u)
          fi
          if [[ "$DECLARED_FILES" != "$CHANGED_FILES" ]]; then
            echo "::error::declared changed_files do not match the actual repair diff"
            diff -u <(printf '%s\n' "$DECLARED_FILES") <(printf '%s\n' "$CHANGED_FILES") || true
            exit 1
          fi
          if [ -n "$CHANGED_FILES" ]; then
            while IFS= read -r path; do
              case "$path" in
                e2e/*|src/*) ;;
                *) echo "::error::self-heal changed a forbidden path: $path"; exit 1 ;;
              esac
            done <<< "$CHANGED_FILES"
            git diff --check
            git add -- e2e src
            git commit -m "fix(e2e): checkpoint self-heal cycle ${{ inputs.repair_cycle || '1' }}"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          printf '%s\n' "$CHANGED_FILES" | sed '/^$/d' | jq -Rsc 'split("\n")[:-1]' \
            > "$RUNNER_TEMP/working-tree-files.json"
          printf '%s' "$FIX_RESULT" > /tmp/playwright-report/repair.json
          pnpm exec tsx scripts/selfheal/incident-cli.ts validate-repair \
            /tmp/playwright-report/diagnosis.json /tmp/playwright-report/repair.json \
            "$RUNNER_TEMP/working-tree-files.json" > "$RUNNER_TEMP/validated-repair.json"
          mv "$RUNNER_TEMP/validated-repair.json" /tmp/playwright-report/repair.json
          git push origin "$REPAIR_BRANCH" --force-with-lease

          if [ -n "$FIX_RESULT" ] && echo "$FIX_RESULT" | jq -e . >/dev/null; then
            jq --argjson result "$FIX_RESULT" '. + [$result]' \
              /tmp/playwright-report/repair-ledger.json > "$RUNNER_TEMP/repair-ledger.json"
            cp "$RUNNER_TEMP/repair-ledger.json" /tmp/playwright-report/repair-ledger.json
            if echo "$FIX_RESULT" | jq -e '.complete == true and (.remainingWork | length == 0)' >/dev/null; then
              echo "complete=true" >> "$GITHUB_OUTPUT"
            else
              echo "complete=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
          echo "changed_files=$(printf '%s\n' "$CHANGED_FILES" | sed '/^$/d' | jq -Rsc 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

          CONTEXT_HASH=$(jq -cS '.failures' /tmp/playwright-report/selfheal-context.json | sha256sum | cut -d' ' -f1)
          TREE_HASH=$(git rev-parse 'HEAD^{tree}')
          STATE_AFTER=$(printf '%s:%s' "$TREE_HASH" "$CONTEXT_HASH" | sha256sum | cut -d' ' -f1)
          echo "state_after=$STATE_AFTER" >> "$GITHUB_OUTPUT"
          if [[ -n "$PREVIOUS_STATE" && "$PREVIOUS_STATE" == "$STATE_AFTER" ]]; then
            echo "no_progress=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_progress=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$STATE_BEFORE" != "$STATE_AFTER" ]]; then
            echo "progress=true" >> "$GITHUB_OUTPUT"
          else
            echo "progress=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record repair usage
        if: always() && steps.guard.outputs.skip != 'true'
        id: usage
        env:
          EXECUTION_FILE: ${{ steps.fix.outputs.execution_file }}
        run: |
          set -euo pipefail
          USAGE='{"cost_usd":null,"turns":null,"duration_ms":null}'
          if [ -n "$EXECUTION_FILE" ] && [ -s "$EXECUTION_FILE" ]; then
            USAGE=$(jq -c '([.[]? | select(.type == "result")] | last // {}) |
              {cost_usd:(.total_cost_usd // .cost_usd // null),turns:(.num_turns // .turns // null),duration_ms:(.duration_ms // null)}' \
              "$EXECUTION_FILE" 2>/dev/null || printf '%s' "$USAGE")
          fi
          printf '%s\n' "$USAGE" > /tmp/playwright-report/usage-summary.json
          echo "model_usage=$USAGE" >> "$GITHUB_OUTPUT"
          ATTEMPTS=$(cat /tmp/formoria-targeted-attempts 2>/dev/null || printf 0)
          echo "targeted_attempts=$ATTEMPTS" >> "$GITHUB_OUTPUT"

      - name: Create or update incident draft PR
        if: steps.checkpoint.outcome == 'success' && steps.checkpoint.outputs.changed_files != '[]'
        id: incident_pr
        env:
          GH_TOKEN: ${{ secrets.SELFHEAL_PAT }}
          REPAIR_BASE: ${{ steps.guard.outputs.repair_base }}
          REPAIR_BRANCH: ${{ steps.branch.outputs.branch }}
          ROOT_INCIDENT_ID: ${{ inputs.root_source_run_id || inputs.source_run_id || github.run_id }}
        run: |
          set -euo pipefail
          jq -n \
            --arg rootIncidentId "$ROOT_INCIDENT_ID" \
            --arg rootWorkflowUrl "${{ steps.context.outputs.source_workflow_url }}" \
            --arg currentWorkflowUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --slurpfile frozen /tmp/playwright-report/frozen-failures.json \
            --slurpfile diagnosis /tmp/playwright-report/diagnosis.json \
            --argjson cycle "${{ inputs.repair_cycle || '1' }}" \
            --arg commit "${{ steps.checkpoint.outputs.commit }}" \
            --argjson changedFiles '${{ steps.checkpoint.outputs.changed_files }}' \
            --argjson infrastructureRetries "${{ inputs.infrastructure_retries || '0' }}" \
            '{rootIncidentId:$rootIncidentId,rootWorkflowUrl:$rootWorkflowUrl,currentWorkflowUrl:$currentWorkflowUrl,
              frozen:$frozen[0],diagnosis:$diagnosis[0],cycles:[{cycle:$cycle,commit:$commit,changedFiles:$changedFiles}],
              exactValidation:"pending",fullValidation:"pending",infrastructureRetries:$infrastructureRetries,
              remainingFailures:$frozen[0].failures,mergeEligibility:{eligible:false,reasons:["validation and review pending"]}}' \
            > "$RUNNER_TEMP/incident-pr-input.json"
          pnpm exec tsx scripts/selfheal/incident-cli.ts render-pr \
            "$RUNNER_TEMP/incident-pr-input.json" > "$RUNNER_TEMP/incident-pr.md"
          PR_NUMBER="${{ inputs.incident_pr_number }}"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$REPAIR_BRANCH" --json number --jq '.[0].number // empty')
          fi
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/incident-pr.md"
          else
            PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --draft --base "$REPAIR_BASE" --head "$REPAIR_BRANCH" \
              --title "fix(e2e): batch self-heal $(date +%F)" --label selfheal --body-file "$RUNNER_TEMP/incident-pr.md")
            PR_NUMBER=${PR_URL##*/}
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: Prepare incomplete repair report
        if: >-
          always() &&
          steps.guard.outputs.skip != 'true' &&
          inputs.continuation_kind == 'repair' &&
          (steps.fix.outcome != 'success' || steps.checkpoint.outputs.complete != 'true')
        id: incomplete_report
        run: |
          set -euo pipefail
          REPORT_DIR="$RUNNER_TEMP/formoria-selfheal-incomplete"
          rm -rf "$REPORT_DIR"
          mkdir -p "$REPORT_DIR"
          cp /tmp/playwright-report/selfheal-context.json "$REPORT_DIR/selfheal-context.json"
          cp /tmp/playwright-report/playwright-results.json "$REPORT_DIR/playwright-results.json"
          cp /tmp/playwright-report/repair-ledger.json "$REPORT_DIR/repair-ledger.json"
          cp /tmp/playwright-report/usage-summary.json "$REPORT_DIR/usage-summary.json"
          if [ -s playwright-last-run.json ]; then cp playwright-last-run.json "$REPORT_DIR/playwright-last-run.json"; fi
          if [ -s legacy-failed-specs.txt ]; then cp legacy-failed-specs.txt "$REPORT_DIR/legacy-failed-specs.txt"; fi
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Upload incomplete repair report
        if: always() && steps.incomplete_report.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-selfheal
          path: ${{ runner.temp }}/formoria-selfheal-incomplete
          retention-days: 7
      - name: Continue incomplete repair within cycle cap
        if: >-
          always() &&
          steps.guard.outputs.skip != 'true' &&
          inputs.continuation_kind == 'repair' &&
          (steps.fix.outcome != 'success' || steps.checkpoint.outputs.complete != 'true') &&
          steps.context.outputs.repair_cycle != '3' &&
          steps.checkpoint.outcome == 'success' &&
          steps.checkpoint.outputs.no_progress != 'true' &&
          steps.incomplete_report.outputs.available == 'true'
        id: continue_incomplete
        env:
          E2E_GREP: ${{ inputs.e2e_grep }}
          REPAIR_BASE: ${{ steps.guard.outputs.repair_base }}
          REPAIR_BRANCH: ${{ steps.branch.outputs.branch }}
          ROOT_SOURCE_RUN_ID: ${{ inputs.root_source_run_id || inputs.source_run_id || github.run_id }}
          SOURCE_FAILED_SPECS: ${{ steps.context.outputs.failed_specs || '[]' }}
          STATE_AFTER: ${{ steps.checkpoint.outputs.state_after }}
          WORKFLOW_DISPATCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEXT_CYCLE=$(( ${{ inputs.repair_cycle || '1' }} + 1 ))
          SOURCE_FAILURE_STATE=$(jq -cn --argjson specs "$SOURCE_FAILED_SPECS" \
            '{count: ($specs | length), specs: $specs}')
          GH_TOKEN="$WORKFLOW_DISPATCH_TOKEN" gh workflow run e2e-nightly.yml \
            --repo "$GITHUB_REPOSITORY" --ref "$REPAIR_BASE" \
            --field selfheal_only=true --field source_run_id="$GITHUB_RUN_ID" \
            --field source_artifact_name=playwright-report-selfheal \
            --field source_failure_state="$SOURCE_FAILURE_STATE" \
            --field root_source_run_id="$ROOT_SOURCE_RUN_ID" \
            --field repair_branch="$REPAIR_BRANCH" --field repair_base="$REPAIR_BASE" \
            --field previous_state="$STATE_AFTER" --field repair_cycle="$NEXT_CYCLE" \
            --field continuation_kind=repair --field validation_scope=exact \
            --field infrastructure_retries="${{ inputs.infrastructure_retries || '0' }}" \
            --field base_sync_attempts="${{ inputs.base_sync_attempts || '0' }}" \
            --field incident_pr_number="${{ steps.incident_pr.outputs.pr_number || inputs.incident_pr_number }}" \
            --raw-field e2e_grep="$E2E_GREP"
          echo "dispatched=true" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Refresh dependencies after fix
        if: steps.guard.outputs.skip != 'true' && steps.fix.outcome == 'success' && steps.checkpoint.outputs.complete == 'true'
        run: pnpm install --frozen-lockfile
      - name: Verify frozen exact set once
        if: >-
          steps.guard.outputs.skip != 'true' &&
          steps.infrastructure.outputs.confirmed != 'true' &&
          ((steps.fix.outcome == 'success' && steps.checkpoint.outputs.complete == 'true') ||
           inputs.continuation_kind == 'base-sync' || inputs.continuation_kind == 'infrastructure')
        id: exact_validation
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results-targeted.json
          PLAYWRIGHT_LAST_RUN_OUTPUT_FILE: playwright-last-run.json
        run: |
          if [ -s playwright-last-run-frozen.json ]; then
            cp playwright-last-run-frozen.json playwright-last-run.json
          fi
          node scripts/selfheal/verify-targeted.mjs
      - name: Build Next.js after fix
        if: steps.guard.outputs.skip != 'true' && steps.exact_validation.outcome == 'success'
        id: selfheal_build
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee "$RUNNER_TEMP/formoria-selfheal-build.log"
      - name: Validate current cluster
        if: ${{ false }}
        id: cluster_validation
        env:
          CLUSTER_FILE: ${{ steps.context.outputs.cluster_file }}
          CLUSTER_PROJECT: ${{ steps.context.outputs.cluster_project }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results-cluster.json
        run: |
          set -euo pipefail
          if [ -z "$CLUSTER_FILE" ]; then
            exit 0
          fi
          case "$CLUSTER_FILE" in
            e2e/*) SPEC_PATH="$CLUSTER_FILE" ;;
            *) SPEC_PATH="e2e/$CLUSTER_FILE" ;;
          esac
          case "$CLUSTER_PROJECT" in
            deep|mobile) ;;
            *) echo "::error::unsupported Playwright project: $CLUSTER_PROJECT"; exit 1 ;;
          esac
          TEST_ARGS=("$SPEC_PATH" --project="$CLUSTER_PROJECT" --reporter=json)
          if [ -n "$E2E_GREP" ]; then
            TEST_ARGS+=(--grep "$E2E_GREP")
          fi
          pnpm exec playwright test "${TEST_ARGS[@]}"
      - name: Validate complete deep/mobile suite
        if: steps.guard.outputs.skip != 'true' && steps.exact_validation.outcome == 'success' && steps.selfheal_build.outcome == 'success'
        id: validation
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results-validation.json
          PLAYWRIGHT_LAST_RUN_OUTPUT_FILE: playwright-last-run.json
        run: |
          TEST_ARGS=(--project=deep --project=mobile --reporter=html,json)
          if [ -n "$E2E_GREP" ]; then
            TEST_ARGS+=(--grep "$E2E_GREP")
          fi
          pnpm exec playwright test "${TEST_ARGS[@]}"

      - name: Prepare self-heal report for next round
        if: >-
          always() &&
          steps.guard.outputs.skip != 'true' &&
          ((steps.fix.outcome == 'success' && steps.checkpoint.outputs.complete == 'true') ||
           inputs.continuation_kind == 'base-sync' || inputs.continuation_kind == 'infrastructure') &&
          steps.validation.outcome != 'success'
        id: next_report
        env:
          REPAIR_BASE: ${{ steps.guard.outputs.repair_base }}
          ROOT_SOURCE_RUN_ID: ${{ inputs.root_source_run_id || inputs.source_run_id || github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          REPORT_DIR="$RUNNER_TEMP/formoria-selfheal-report"
          rm -rf "$REPORT_DIR"
          mkdir -p "$REPORT_DIR"
          if [ -s playwright-results-validation.json ]; then
            cp playwright-results-validation.json "$REPORT_DIR/playwright-results.json"
          elif [ -s playwright-results-targeted.json ]; then
            cp playwright-results-targeted.json "$REPORT_DIR/playwright-results.json"
          elif [ -s playwright-results-cluster.json ]; then
            cp playwright-results-cluster.json "$REPORT_DIR/playwright-results.json"
          else
            jq -n --arg workflow_url "$WORKFLOW_URL" \
              '{version: "1.0", suites: [{title: "Self-heal build failure", file: null,
                specs: [{title: ("Validation did not run. Inspect " + $workflow_url), ok: false, tests: []}]}],
                stats: {duration: 0, expected: 0, skipped: 0, unexpected: 1, flaky: 0}}' \
              > "$REPORT_DIR/playwright-results.json"
          fi
          BUILD_OUTCOME="${{ steps.selfheal_build.outcome }}"
          if [ "$BUILD_OUTCOME" = "failure" ] && [ -s "$RUNNER_TEMP/formoria-selfheal-build.log" ]; then
            cp "$RUNNER_TEMP/formoria-selfheal-build.log" "$REPORT_DIR/build.log"
          fi
          if [ -d playwright-report ]; then cp -R playwright-report "$REPORT_DIR/playwright-report"; fi
          if [ -d test-results ]; then cp -R test-results "$REPORT_DIR/test-results"; fi
          cp /tmp/playwright-report/repair-ledger.json "$REPORT_DIR/repair-ledger.json"
          cp /tmp/playwright-report/frozen-failures.json "$REPORT_DIR/frozen-failures.json"
          if [ -s /tmp/playwright-report/diagnosis.json ]; then cp /tmp/playwright-report/diagnosis.json "$REPORT_DIR/diagnosis.json"; fi
          if [ -s /tmp/playwright-report/repair.json ]; then cp /tmp/playwright-report/repair.json "$REPORT_DIR/repair.json"; fi
          if [ -s /tmp/playwright-report/usage-summary.json ]; then cp /tmp/playwright-report/usage-summary.json "$REPORT_DIR/usage-summary.json"; fi
          if [ -s playwright-last-run.json ]; then cp playwright-last-run.json "$REPORT_DIR/playwright-last-run.json"; fi
          if [ -s legacy-failed-specs.txt ]; then cp legacy-failed-specs.txt "$REPORT_DIR/legacy-failed-specs.txt"; fi
          jq --arg source_run_id "$ROOT_SOURCE_RUN_ID" --arg source_workflow_url "$WORKFLOW_URL" \
            --arg source_sha "$GITHUB_SHA" --arg repair_base "$REPAIR_BASE" --arg e2e_grep "$E2E_GREP" \
            'def all_suites: .suites[]? | ., all_suites;
             [all_suites as $suite | $suite.specs[]? as $spec | select($spec.ok == false) |
               {file: ($suite.file // null), title: $spec.title,
                project: ([$spec.tests[]?.projectName // empty] | unique | .[0] // "deep"),
                errors: ([$spec.tests[]?.results[]?.errors[]? | (.message // .value // tostring)] | unique)}
             ] as $failures |
             {version: 1, source_run_id: $source_run_id, source_workflow_url: $source_workflow_url,
              source_sha: $source_sha, repair_base: $repair_base, e2e_grep: $e2e_grep,
             failures: $failures,
             clusters: ($failures | sort_by([.project, (.file // "")]) | group_by([.project, (.file // "")]) | map({project: .[0].project, file: .[0].file, failures: .}))}' \
            "$REPORT_DIR/playwright-results.json" > "$REPORT_DIR/selfheal-context.json"
          FAILED_SPECS=$(jq -c '[.failures[]? | {file: (.file // null), title, project: (.project // null)}]' "$REPORT_DIR/selfheal-context.json")
          echo "failed_specs=$FAILED_SPECS" >> "$GITHUB_OUTPUT"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Upload self-heal report for next round
        if: always() && steps.next_report.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-selfheal
          path: ${{ runner.temp }}/formoria-selfheal-report
          retention-days: 7

      - name: Classify validation infrastructure
        if: >-
          always() &&
          steps.guard.outputs.skip != 'true' &&
          steps.validation.outcome != 'success' &&
          steps.next_report.outputs.available == 'true'
        id: validation_infrastructure
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          ERRORS='[]'
          if [ -s playwright-results-validation.json ]; then
            ERRORS=$(jq -c '[.suites[]? | recurse(.suites[]?) as $suite | $suite.specs[]? as $spec |
              $spec.tests[]?.results[]?.errors[]? | (.message // .value // tostring)] | unique' \
              playwright-results-validation.json)
          fi
          PROBE_KEY="$SUPABASE_SERVICE_ROLE_KEY"
          PROBE_AUTHENTICATED=false
          PROBE_AUTH_MODE=none
          if [ -n "$PROBE_KEY" ]; then
            PROBE_AUTHENTICATED=true
            PROBE_AUTH_MODE=service_role
          fi
          START_MS=$(date +%s%3N)
          HTTP_STATUS=$(curl --silent --show-error --max-time 10 \
            --output "$RUNNER_TEMP/supabase-validation-probe-body.json" --write-out '%{http_code}' \
            -H "apikey: $PROBE_KEY" -H "Authorization: Bearer $PROBE_KEY" \
            -H 'Accept: application/json' \
            "$SUPABASE_URL/rest/v1/brands?select=id&limit=1" || true)
          HTTP_STATUS="${HTTP_STATUS: -3}"
          HTTP_STATUS_NUMBER=$((10#${HTTP_STATUS:-000}))
          LATENCY_MS=$(( $(date +%s%3N) - START_MS ))
          PROBE_OK=false
          [[ "$PROBE_AUTHENTICATED" == true && "$HTTP_STATUS" =~ ^2 ]] && PROBE_OK=true
          jq -n --argjson authenticated "$PROBE_AUTHENTICATED" --argjson ok "$PROBE_OK" \
            --argjson status "$HTTP_STATUS_NUMBER" --arg auth_mode "$PROBE_AUTH_MODE" \
            '{authenticated:$authenticated,auth_mode:$auth_mode,ok:$ok,status:$status}' \
            > "$RUNNER_TEMP/supabase-validation-probe.json"
          jq -n --arg operation validation_authenticated_query --arg phase full_validation \
            --argjson status "$HTTP_STATUS_NUMBER" --argjson latency_ms "$LATENCY_MS" \
            --arg auth_mode "$PROBE_AUTH_MODE" --arg response_content_type application_json \
            '{event:"e2e_selfheal_infrastructure_probe",phase:$phase,request:{operation:$operation,auth_mode:$auth_mode,limit:1},response:{status:$status,content_type:$response_content_type},latency_ms:$latency_ms}'
          jq -n --argjson errors "$ERRORS" \
            --argjson probe "$(cat "$RUNNER_TEMP/supabase-validation-probe.json")" \
            '{errors:$errors,probe:$probe}' > "$RUNNER_TEMP/validation-infrastructure-evidence.json"
          pnpm exec tsx scripts/selfheal/incident-cli.ts classify-infrastructure \
            "$RUNNER_TEMP/validation-infrastructure-evidence.json" > /tmp/playwright-report/validation-infrastructure.json
          echo "confirmed=$(jq -r .confirmed /tmp/playwright-report/validation-infrastructure.json)" >> "$GITHUB_OUTPUT"
          echo "reasons=$(jq -c .reasons /tmp/playwright-report/validation-infrastructure.json)" >> "$GITHUB_OUTPUT"

      - name: Prepare validation infrastructure continuation bundle
        if: steps.validation_infrastructure.outputs.confirmed == 'true' && inputs.infrastructure_retries != '2'
        id: validation_infrastructure_bundle
        run: |
          set -euo pipefail
          REPORT_DIR="$RUNNER_TEMP/formoria-selfheal-validation-infrastructure"
          rm -rf "$REPORT_DIR"
          cp -R "$RUNNER_TEMP/formoria-selfheal-report/." "$REPORT_DIR/"
          cp /tmp/playwright-report/validation-infrastructure.json "$REPORT_DIR/validation-infrastructure.json"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Upload validation infrastructure continuation bundle
        if: steps.validation_infrastructure_bundle.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-selfheal-validation-infrastructure
          path: ${{ runner.temp }}/formoria-selfheal-validation-infrastructure
          retention-days: 7

      - name: Dispatch validation infrastructure-only retry
        if: steps.validation_infrastructure_bundle.outcome == 'success'
        id: continue_validation_infrastructure
        env:
          E2E_GREP: ${{ inputs.e2e_grep }}
          REPAIR_BASE: ${{ steps.guard.outputs.repair_base }}
          REPAIR_BRANCH: ${{ steps.branch.outputs.branch }}
          ROOT_SOURCE_RUN_ID: ${{ inputs.root_source_run_id || inputs.source_run_id || github.run_id }}
          SOURCE_FAILED_SPECS: ${{ steps.next_report.outputs.failed_specs || steps.context.outputs.failed_specs || '[]' }}
          STATE_AFTER: ${{ steps.checkpoint.outputs.state_after }}
          WORKFLOW_DISPATCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push origin "$REPAIR_BRANCH" --force-with-lease
          NEXT_RETRY=$(( ${{ inputs.infrastructure_retries || '0' }} + 1 ))
          SOURCE_FAILURE_STATE=$(jq -cn --argjson specs "$SOURCE_FAILED_SPECS" \
            '{count: ($specs | length), specs: $specs}')
          GH_TOKEN="$WORKFLOW_DISPATCH_TOKEN" gh workflow run e2e-nightly.yml \
            --repo "$GITHUB_REPOSITORY" --ref "$REPAIR_BASE" \
            --field selfheal_only=true --field source_run_id="$GITHUB_RUN_ID" \
            --field source_artifact_name=playwright-report-selfheal-validation-infrastructure \
            --field source_failure_state="$SOURCE_FAILURE_STATE" \
            --field root_source_run_id="$ROOT_SOURCE_RUN_ID" \
            --field repair_branch="$REPAIR_BRANCH" --field repair_base="$REPAIR_BASE" \
            --field previous_state="$STATE_AFTER" --field repair_cycle="${{ inputs.repair_cycle || '1' }}" \
            --field continuation_kind=infrastructure --field validation_scope=exact \
            --field infrastructure_retries="$NEXT_RETRY" \
            --field base_sync_attempts="${{ inputs.base_sync_attempts || '0' }}" \
            --field incident_pr_number="${{ steps.incident_pr.outputs.pr_number || inputs.incident_pr_number }}" \
            --raw-field e2e_grep="$E2E_GREP"
          echo "dispatched=true" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Evaluate test-only merge policy
        if: >-
          steps.validation.outcome == 'success' &&
          (inputs.continuation_kind != 'infrastructure' || inputs.incident_pr_number != '')
        id: merge_policy
        env:
          REPAIR_BASE: ${{ steps.guard.outputs.repair_base }}
        run: |
          set -euo pipefail
          git diff --name-only "origin/$REPAIR_BASE...HEAD" | jq -Rsc 'split("\n")[:-1]' > "$RUNNER_TEMP/changed-files.json"
          git diff --name-status "origin/$REPAIR_BASE...HEAD" | awk '$1 ~ /^[DR]/ && $NF ~ /^e2e\/.*\.spec\.ts$/ {print $NF}' \
            | jq -Rsc 'split("\n")[:-1]' > "$RUNNER_TEMP/deleted-renamed.json"
          git diff --unified=0 "origin/$REPAIR_BASE...HEAD" -- e2e \
            | awk '/^\+[^+]/ {sub(/^\+/, ""); print}' | jq -Rsc 'split("\n")[:-1]' > "$RUNNER_TEMP/added-lines.json"
          git grep -h -E '\btest(\.describe)?\s*\(' "origin/$REPAIR_BASE" -- 'e2e/**/*.ts' | wc -l | tr -d ' ' > "$RUNNER_TEMP/tests-before"
          rg -N '\btest(\.describe)?\s*\(' e2e --glob '*.ts' | wc -l | tr -d ' ' > "$RUNNER_TEMP/tests-after"
          git grep -h -E '\bexpect\s*\(' "origin/$REPAIR_BASE" -- 'e2e/**/*.ts' | wc -l | tr -d ' ' > "$RUNNER_TEMP/assertions-before"
          rg -N '\bexpect\s*\(' e2e --glob '*.ts' | wc -l | tr -d ' ' > "$RUNNER_TEMP/assertions-after"
          jq -n --slurpfile diagnosis /tmp/playwright-report/diagnosis.json \
            --slurpfile changedFiles "$RUNNER_TEMP/changed-files.json" \
            --slurpfile deletedOrRenamedSpecs "$RUNNER_TEMP/deleted-renamed.json" \
            --slurpfile addedLines "$RUNNER_TEMP/added-lines.json" \
            --argjson testCountBefore "$(cat "$RUNNER_TEMP/tests-before")" \
            --argjson testCountAfter "$(cat "$RUNNER_TEMP/tests-after")" \
            --argjson assertionCountBefore "$(cat "$RUNNER_TEMP/assertions-before")" \
            --argjson assertionCountAfter "$(cat "$RUNNER_TEMP/assertions-after")" \
            --argjson skippedBefore "$(jq '.stats.skipped // 0' /tmp/playwright-report/playwright-results.json)" \
            --argjson skippedAfter "$(jq '.stats.skipped // 0' playwright-results-validation.json)" \
            '{diagnosis:$diagnosis[0],changedFiles:$changedFiles[0],deletedOrRenamedSpecs:$deletedOrRenamedSpecs[0],
              addedLines:$addedLines[0],testCountBefore:$testCountBefore,testCountAfter:$testCountAfter,
              assertionCountBefore:$assertionCountBefore,assertionCountAfter:$assertionCountAfter,
              skippedBefore:$skippedBefore,skippedAfter:$skippedAfter}' > "$RUNNER_TEMP/merge-evidence.json"
          pnpm exec tsx scripts/selfheal/incident-cli.ts eligibility "$RUNNER_TEMP/merge-evidence.json" \
            > /tmp/playwright-report/merge-eligibility.json
          echo "eligible=$(jq -r .eligible /tmp/playwright-report/merge-eligibility.json)" >> "$GITHUB_OUTPUT"

      - name: Prepare current incident evidence bundle
        if: steps.validation.outcome == 'success'
        id: current_bundle
        run: |
          set -euo pipefail
          REPORT_DIR="$RUNNER_TEMP/formoria-selfheal-current"
          mkdir -p "$REPORT_DIR"
          cp -R /tmp/playwright-report/. "$REPORT_DIR/"
          cp playwright-results-validation.json "$REPORT_DIR/playwright-results.json"
          cp playwright-last-run-frozen.json "$REPORT_DIR/playwright-last-run-frozen.json"
          cp playwright-last-run.json "$REPORT_DIR/playwright-last-run.json"
      - name: Upload current incident evidence bundle
        if: steps.current_bundle.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-selfheal
          path: ${{ runner.temp }}/formoria-selfheal-current
          retention-days: 7
      - name: Continue red self-heal within cycle cap
        if: >-
          always() &&
          steps.guard.outputs.skip != 'true' &&
          ((steps.fix.outcome == 'success' && steps.checkpoint.outputs.complete == 'true') ||
           inputs.continuation_kind == 'base-sync' || inputs.continuation_kind == 'infrastructure') &&
          steps.validation.outcome != 'success' &&
          steps.infrastructure.outputs.confirmed != 'true' &&
          steps.validation_infrastructure.outputs.confirmed != 'true' &&
          steps.continue_infrastructure.outputs.dispatched != 'true' &&
          steps.continue_validation_infrastructure.outputs.dispatched != 'true' &&
          steps.context.outputs.repair_cycle != '3' &&
          (steps.checkpoint.outputs.no_progress != 'true' || inputs.continuation_kind != 'repair') &&
          steps.next_report.outputs.available == 'true'
        id: continue_red
        env:
          E2E_GREP: ${{ inputs.e2e_grep }}
          REPAIR_BASE: ${{ steps.guard.outputs.repair_base }}
          REPAIR_BRANCH: ${{ steps.branch.outputs.branch }}
          ROOT_SOURCE_RUN_ID: ${{ inputs.root_source_run_id || inputs.source_run_id || github.run_id }}
          SOURCE_FAILED_SPECS: ${{ steps.next_report.outputs.failed_specs || steps.context.outputs.failed_specs || '[]' }}
          STATE_AFTER: ${{ steps.checkpoint.outputs.state_after }}
          WORKFLOW_DISPATCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEXT_CYCLE=$(( ${{ inputs.repair_cycle || '1' }} + 1 ))
          SOURCE_FAILURE_STATE=$(jq -cn --argjson specs "$SOURCE_FAILED_SPECS" \
            '{count: ($specs | length), specs: $specs}')
          GH_TOKEN="$WORKFLOW_DISPATCH_TOKEN" gh workflow run e2e-nightly.yml \
            --repo "$GITHUB_REPOSITORY" --ref "$REPAIR_BASE" \
            --field selfheal_only=true --field source_run_id="$GITHUB_RUN_ID" \
            --field source_artifact_name=playwright-report-selfheal \
            --field source_failure_state="$SOURCE_FAILURE_STATE" \
            --field root_source_run_id="$ROOT_SOURCE_RUN_ID" \
            --field repair_branch="$REPAIR_BRANCH" --field repair_base="$REPAIR_BASE" \
            --field previous_state="$STATE_AFTER" --field repair_cycle="$NEXT_CYCLE" \
            --field continuation_kind=repair --field validation_scope=exact \
            --field infrastructure_retries="${{ inputs.infrastructure_retries || '0' }}" \
            --field base_sync_attempts="${{ inputs.base_sync_attempts || '0' }}" \
            --field incident_pr_number="${{ steps.incident_pr.outputs.pr_number || inputs.incident_pr_number }}" \
            --raw-field e2e_grep="$E2E_GREP"
          echo "dispatched=true" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Update blocked draft PR at cycle cap
        if: >-
          always() &&
          steps.guard.outputs.skip != 'true' &&
          steps.context.outputs.repair_cycle == '3' &&
          steps.validation.outcome != 'success'
        id: blocked_pr
        env:
          GH_TOKEN: ${{ secrets.SELFHEAL_PAT }}
          REPAIR_BASE: ${{ steps.guard.outputs.repair_base }}
          REPAIR_BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          git push origin "$REPAIR_BRANCH" --force-with-lease
          BODY="$RUNNER_TEMP/e2e-selfheal-blocked.md"
          printf '%s\n' '## E2E Self-Heal — Blocked' '' \
            'The bounded repair stopped after cycle 3. Verified checkpoints and current diagnostics are preserved; human review is required.' \
            '' "Remaining failures: $(jq '.failedTests | length' playwright-last-run.json 2>/dev/null || printf unknown)" > "$BODY"
          gh label create blocked --repo "$GITHUB_REPOSITORY" --color b60205 \
            --description "Automation stopped and requires human intervention" --force
          PR_NUMBER="${{ steps.incident_pr.outputs.pr_number || inputs.incident_pr_number }}"
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --add-label blocked --body-file "$BODY"
            PR_URL=$(gh pr view "$PR_NUMBER" --json url --jq .url)
          elif git diff --quiet "origin/$REPAIR_BASE...HEAD"; then
            PR_URL=""
            gh issue list --label e2e-nightly --state open --json number --jq '.[0].number // empty' \
              | xargs -r -I{} gh issue comment {} --body-file "$BODY"
          else
            PR_URL=$(gh pr create --draft --base "$REPAIR_BASE" --head "$REPAIR_BRANCH" \
              --title "fix(e2e): blocked self-heal $(date +%F)" --label selfheal --label blocked --body-file "$BODY")
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Review fix
        if: >-
          steps.guard.outputs.skip != 'true' && steps.validation.outcome == 'success' &&
          (steps.incident_pr.outputs.pr_number != '' || inputs.incident_pr_number != '')
        id: review
        uses: anthropics/claude-code-action@fa7e2f0a29a126f0b81cdcf360561b36e44cf608 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.SELFHEAL_PAT }}
          allowed_bots: github-actions
          prompt: |
            Read .github/selfheal/review.md for your full instructions.
            Review the complete repair branch against its repair ledger at
            /tmp/playwright-report/repair-ledger.json and the repair base
            ${{ steps.guard.outputs.repair_base }}. The selected E2E scope is green.
            Return the required structured review result. Do not edit files.
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["verdict","justification","app_files","risk","reviewed_head_sha","findings"],"properties":{"verdict":{"type":"string","enum":["PASS","REJECT"]},"justification":{"type":"string"},"app_files":{"type":"array","items":{"type":"string"}},"risk":{"type":"string","enum":["low","medium","high"]},"reviewed_head_sha":{"type":"string"},"findings":{"type":"array","items":{"type":"string"}}}}'
      - name: Enforce review verdict
        if: >-
          always() && steps.guard.outputs.skip != 'true' && steps.validation.outcome == 'success' &&
          (steps.incident_pr.outputs.pr_number != '' || inputs.incident_pr_number != '')
        id: review_gate
        env:
          REVIEW_RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          echo "$REVIEW_RESULT" | jq -e --arg head "$HEAD_SHA" \
            '.verdict == "PASS" and .risk == "low" and .reviewed_head_sha == $head' >/dev/null
          echo "accepted=true" >> "$GITHUB_OUTPUT"

      - name: Update durable incident PR with validation and review
        if: >-
          steps.guard.outputs.skip != 'true' && steps.review_gate.outputs.accepted == 'true' &&
          (steps.incident_pr.outputs.pr_number != '' || inputs.incident_pr_number != '')
        id: pr
        env:
          GH_TOKEN: ${{ secrets.SELFHEAL_PAT }}
          REPAIR_BASE: ${{ steps.guard.outputs.repair_base }}
          REPAIR_BRANCH: ${{ steps.branch.outputs.branch }}
          REVIEW_RESULT: ${{ steps.review.outputs.structured_output }}
          SOURCE_WORKFLOW_URL: ${{ steps.context.outputs.source_workflow_url }}
        run: |
          set -euo pipefail
          git push origin "$REPAIR_BRANCH" --force-with-lease
          LEDGER=$(jq -r '[.clusters[] | "- **\(.category)** — `\(.rootCauseKey)`: \(.diagnosis)"] | if length == 0 then "- No actionable cluster was recorded" else join("\n") end' /tmp/playwright-report/diagnosis.json)
          CHANGED_FILES=$(git diff --name-only "origin/$REPAIR_BASE...HEAD" | sed 's/^/- `/; s/$/`/')
          PASSED=$(jq '(.stats.expected // 0) + (.stats.flaky // 0)' playwright-results-validation.json)
          FAILED=$(jq '.stats.unexpected // 0' playwright-results-validation.json)
          SKIPPED=$(jq '.stats.skipped // 0' playwright-results-validation.json)
          RISK=$(echo "$REVIEW_RESULT" | jq -r '.risk')
          JUSTIFICATION=$(echo "$REVIEW_RESULT" | jq -r '.justification')
          FINDINGS=$(echo "$REVIEW_RESULT" | jq -r '.findings | if length == 0 then "- None" else map("- " + .) | join("\n") end')
          PR_BODY="$RUNNER_TEMP/e2e-selfheal-pr.md"
          printf '%s\n' \
            '## E2E Self-Heal' \
            '' \
            "Source failure: $SOURCE_WORKFLOW_URL" \
            '' \
            '### Classification and root cause' \
            '' \
            "$LEDGER" \
            '' \
            '### Changed files' \
            '' \
            "$CHANGED_FILES" \
            '' \
            '### Validation' \
            '' \
            "- Selected E2E scope: $PASSED passed, $FAILED failed, $SKIPPED skipped" \
            '- Production build: passed' \
            '' \
            '### Automated review' \
            '' \
            "- Verdict: PASS" \
            "- Risk: $RISK" \
            "- Justification: $JUSTIFICATION" \
            "$FINDINGS" \
            '' \
            '### Merge policy' \
            '' \
            "- Auto-merge eligible: ${{ steps.merge_policy.outputs.eligible == 'true' && 'yes' || 'no' }}" \
            '- Application or mixed repairs always require human merge.' \
            > "$PR_BODY"
          PR_NUMBER="${{ steps.incident_pr.outputs.pr_number || inputs.incident_pr_number }}"
          if [ -z "$PR_NUMBER" ]; then
            PR_URL=$(gh pr create --draft --base "$REPAIR_BASE" --head "$REPAIR_BRANCH" \
              --title "fix(e2e): self-heal $(date +%F)" --label selfheal --body-file "$PR_BODY")
            PR_NUMBER=${PR_URL##*/}
          else
            gh pr edit "$PR_NUMBER" --body-file "$PR_BODY"
            PR_URL=$(gh pr view "$PR_NUMBER" --json url --jq .url)
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Mark unsafe or application repair ready for human review
        if: steps.pr.outputs.pr_number != '' && steps.merge_policy.outputs.eligible != 'true'
        env:
          GH_TOKEN: ${{ secrets.SELFHEAL_PAT }}
        run: gh pr ready "${{ steps.pr.outputs.pr_number }}"

      - name: Ensure reviewed head is based on current main
        if: steps.merge_policy.outputs.eligible == 'true' && steps.review_gate.outputs.accepted == 'true'
        id: base_gate
        env:
          GH_TOKEN: ${{ secrets.SELFHEAL_PAT }}
          REPAIR_BASE: ${{ steps.guard.outputs.repair_base }}
          REPAIR_BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin "$REPAIR_BASE" --prune
          if git merge-base --is-ancestor "origin/$REPAIR_BASE" HEAD; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ inputs.base_sync_attempts || '0' }}" = "2" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git rebase "origin/$REPAIR_BASE"
          git push origin "$REPAIR_BRANCH" --force-with-lease
          NEXT_SYNC=$(( ${{ inputs.base_sync_attempts || '0' }} + 1 ))
          gh workflow run e2e-nightly.yml --repo "$GITHUB_REPOSITORY" --ref "$REPAIR_BASE" \
            --field selfheal_only=true --field source_run_id="$GITHUB_RUN_ID" \
            --field source_artifact_name=playwright-report-selfheal \
            --field root_source_run_id="${{ inputs.root_source_run_id || inputs.source_run_id || github.run_id }}" \
            --field repair_branch="$REPAIR_BRANCH" --field repair_base="$REPAIR_BASE" \
            --field continuation_kind=base-sync --field validation_scope=exact \
            --field infrastructure_retries="${{ inputs.infrastructure_retries || '0' }}" \
            --field repair_cycle="${{ inputs.repair_cycle || '1' }}" --field base_sync_attempts="$NEXT_SYNC" \
            --field incident_pr_number="${{ steps.pr.outputs.pr_number }}"
          echo "continuation=true" >> "$GITHUB_OUTPUT"

      - name: Wait for protected PR checks
        if: steps.base_gate.outputs.current == 'true'
        id: pr_checks
        env:
          GH_TOKEN: ${{ secrets.SELFHEAL_PAT }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr checks "$PR_NUMBER" --required --watch --fail-fast
          gh pr checks "$PR_NUMBER" --json name,state > "$RUNNER_TEMP/pr-checks.json"
          jq -e '
            (["Quality","Build","select-targeted-e2e"] - [.[] | select(.state == "SUCCESS") | .name] | length) == 0 and
            ([.[] | select(.name == "e2e-targeted" and .state != "SUCCESS")] | length) == 0
          ' "$RUNNER_TEMP/pr-checks.json" >/dev/null
          BODY=$(gh pr view "$PR_NUMBER" --json body --jq .body)
          printf '%s\n\n### Final PR checks\n\n- Quality: passed\n- Build: passed\n- select-targeted-e2e: passed\n- e2e-targeted: passed when selected\n' \
            "$BODY" > "$RUNNER_TEMP/checked-pr.md"
          gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/checked-pr.md"

      - name: Mark ready and squash-merge safe test-only repair
        if: steps.pr_checks.outcome == 'success'
        id: merge
        env:
          GH_TOKEN: ${{ secrets.SELFHEAL_PAT }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          PR_HEAD=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          [ "$HEAD_SHA" = "$PR_HEAD" ]
          gh pr ready "$PR_NUMBER"
          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$HEAD_SHA"
          echo "merge_commit_sha=$(gh pr view "$PR_NUMBER" --json mergeCommit --jq .mergeCommit.oid)" >> "$GITHUB_OUTPUT"

      - name: Determine terminal state
        if: always()
        id: terminal_state
        env:
          CONTINUE_INCOMPLETE: ${{ steps.continue_incomplete.outputs.dispatched }}
          CONTINUE_RED: ${{ steps.continue_red.outputs.dispatched }}
          CONTINUE_INFRASTRUCTURE: ${{ steps.continue_infrastructure.outputs.dispatched || steps.continue_validation_infrastructure.outputs.dispatched }}
          CONTINUE_BASE_SYNC: ${{ steps.base_gate.outputs.continuation }}
          INFRASTRUCTURE_CONFIRMED: ${{ steps.infrastructure.outputs.confirmed == 'true' || steps.validation_infrastructure.outputs.confirmed == 'true' }}
          INFRASTRUCTURE_RETRIES: ${{ inputs.infrastructure_retries || '0' }}
          MERGE_COMMIT_SHA: ${{ steps.merge.outputs.merge_commit_sha }}
          AUTO_MERGE_ELIGIBLE: ${{ steps.merge_policy.outputs.eligible }}
          NO_PROGRESS: ${{ steps.checkpoint.outputs.no_progress }}
          PR_URL: ${{ steps.pr.outputs.pr_url || steps.incident_pr.outputs.pr_url || steps.existing_pr.outputs.pr_url }}
          BLOCKED_PR_URL: ${{ steps.blocked_pr.outputs.pr_url }}
          REVIEW_GATE_OUTCOME: ${{ steps.review_gate.outcome }}
          SOURCE_FAILED_COUNT: ${{ needs.e2e-deep.outputs.failed }}
          SOURCE_FAILED_SPECS: ${{ needs.e2e-deep.outputs.failed_specs }}
          SOURCE_FAILURE_STATE: ${{ inputs.source_failure_state }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          if [[ "$CONTINUE_INCOMPLETE" == "true" || "$CONTINUE_RED" == "true" || "$CONTINUE_INFRASTRUCTURE" == "true" || "$CONTINUE_BASE_SYNC" == "true" ]]; then
            echo "continuation_dispatched=true" >> "$GITHUB_OUTPUT"
          else
            echo "continuation_dispatched=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$CONTINUE_INCOMPLETE" == "true" || "$CONTINUE_RED" == "true" || "$CONTINUE_INFRASTRUCTURE" == "true" || "$CONTINUE_BASE_SYNC" == "true" ]]; then
            OUTCOME=continuing; REASON=""
          elif [[ -n "$MERGE_COMMIT_SHA" ]]; then
            OUTCOME=merged; REASON=""
          elif [[ "$INFRASTRUCTURE_CONFIRMED" == "true" && "$INFRASTRUCTURE_RETRIES" == "2" ]]; then
            OUTCOME=infrastructure_blocked; REASON="infrastructure remained unavailable after two validation-only retries"
          elif [[ "$VALIDATION_OUTCOME" == "success" && -z "$PR_URL" ]]; then
            OUTCOME=recovered_no_change; REASON=""
          elif [[ -n "$PR_URL" && "$AUTO_MERGE_ELIGIBLE" != "true" && "$REVIEW_GATE_OUTCOME" == "success" ]]; then
            OUTCOME=review_ready; REASON=""
          elif [[ -n "$BLOCKED_PR_URL" ]]; then
            OUTCOME=repair_blocked; REASON="repair cycle 3 ended red; a blocked draft PR preserves progress"
          elif [[ "$NO_PROGRESS" == "true" ]]; then
            OUTCOME=repair_blocked; REASON="repair made no progress from the same failure state"
          elif [[ "$VALIDATION_OUTCOME" == "success" && "$REVIEW_GATE_OUTCOME" != "success" ]]; then
            OUTCOME=repair_blocked; REASON="automated review rejected or could not validate the fix"
          elif [[ "${{ steps.guard.outputs.skip }}" == "true" ]]; then
            OUTCOME=repair_blocked; REASON="the self-heal guard prevented this repair"
          else
            OUTCOME=repair_blocked; REASON="the self-heal job ended before a terminal result"
          fi
          echo "terminal_outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
          echo "blocked_reason=$REASON" >> "$GITHUB_OUTPUT"
          if [ -s playwright-results-validation.json ] && jq -e . playwright-results-validation.json >/dev/null 2>&1; then
            echo "passed=$(jq '(.stats.expected // 0) + (.stats.flaky // 0)' playwright-results-validation.json)" >> "$GITHUB_OUTPUT"
            echo "failed=$(jq '.stats.unexpected // 0' playwright-results-validation.json)" >> "$GITHUB_OUTPUT"
            echo "skipped=$(jq '.stats.skipped // 0' playwright-results-validation.json)" >> "$GITHUB_OUTPUT"
            FAILED_SPECS=$(jq -c '[.suites[]? | recurse(.suites[]?) as $suite | $suite.specs[]? as $spec | select($spec.ok == false) | {file: ($suite.file // null), title: $spec.title, project: ([$spec.tests[]?.projectName // empty] | unique | .[0] // null)}]' playwright-results-validation.json)
            echo "report_available=true" >> "$GITHUB_OUTPUT"
          elif [ -s /tmp/playwright-report/selfheal-context.json ]; then
            echo "passed=0" >> "$GITHUB_OUTPUT"
            echo "failed=$(jq '.failures | length' /tmp/playwright-report/selfheal-context.json)" >> "$GITHUB_OUTPUT"
            echo "skipped=0" >> "$GITHUB_OUTPUT"
            FAILED_SPECS=$(jq -c '[.failures[]? | {file: (.file // null), title, project: (.project // null)}]' /tmp/playwright-report/selfheal-context.json 2>/dev/null || printf '[]')
            echo "report_available=false" >> "$GITHUB_OUTPUT"
          else
            echo "passed=0" >> "$GITHUB_OUTPUT"
            if [ -n "$SOURCE_FAILURE_STATE" ] && jq -e . >/dev/null 2>&1 <<<"$SOURCE_FAILURE_STATE"; then
              SOURCE_FAILED_COUNT=$(jq -r '.count // empty' <<<"$SOURCE_FAILURE_STATE")
              SOURCE_FAILED_SPECS=$(jq -c '.specs // []' <<<"$SOURCE_FAILURE_STATE")
            fi
            echo "failed=$SOURCE_FAILED_COUNT" >> "$GITHUB_OUTPUT"
            echo "skipped=0" >> "$GITHUB_OUTPUT"
            FAILED_SPECS=$(printf '%s' "${SOURCE_FAILED_SPECS:-[]}" | jq -c . 2>/dev/null || printf '[]')
            echo "report_available=false" >> "$GITHUB_OUTPUT"
          fi
          echo "failed_specs=$FAILED_SPECS" >> "$GITHUB_OUTPUT"

      - name: Finalize durable incident record
        if: >-
          always() && steps.terminal_state.outputs.continuation_dispatched != 'true' &&
          steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.SELFHEAL_PAT }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number || steps.incident_pr.outputs.pr_number || inputs.incident_pr_number }}
          TERMINAL_OUTCOME: ${{ steps.terminal_state.outputs.terminal_outcome }}
          MERGE_COMMIT_SHA: ${{ steps.merge.outputs.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [ -n "$PR_NUMBER" ]; then
            BODY=$(gh pr view "$PR_NUMBER" --json body --jq .body)
            printf '%s\n\n## Terminal state\n\n- Outcome: `%s`\n- Merge commit: `%s`\n' \
              "$BODY" "$TERMINAL_OUTCOME" "${MERGE_COMMIT_SHA:-not merged}" > "$RUNNER_TEMP/terminal-pr.md"
            gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/terminal-pr.md"
          fi
          if [[ "$TERMINAL_OUTCOME" == "merged" || "$TERMINAL_OUTCOME" == "recovered_no_change" ]]; then
            ISSUE_NUMBER=$(gh issue list --label e2e-nightly --state open --json number --jq '.[0].number // empty')
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue close "$ISSUE_NUMBER" --comment "E2E incident closed with outcome: $TERMINAL_OUTCOME"
            fi
          fi

      - name: Report to Agent Hub
        if: always() && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          AGENT_HUB_INGEST_URL: ${{ secrets.AGENT_HUB_INGEST_URL }}
          AGENT_HUB_INGEST_TOKEN: ${{ secrets.AGENT_HUB_INGEST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOCKED_REASON_FOR_REPORT: ${{ steps.terminal_state.outputs.blocked_reason }}
          FAILED_SPECS_FOR_REPORT: ${{ steps.terminal_state.outputs.failed_specs || '[]' }}
          REPORT_AVAILABLE_FOR_REPORT: ${{ steps.terminal_state.outputs.report_available || 'false' }}
          PR_URL_FOR_REPORT: ${{ steps.pr.outputs.pr_url || steps.incident_pr.outputs.pr_url || steps.existing_pr.outputs.pr_url || steps.blocked_pr.outputs.pr_url || '' }}
          CONTINUATION_DISPATCHED: ${{ steps.terminal_state.outputs.continuation_dispatched }}
          MODEL_USAGE: ${{ steps.usage.outputs.model_usage || '{"cost_usd":null,"turns":null,"duration_ms":null}' }}
          TARGETED_ATTEMPTS: ${{ steps.usage.outputs.targeted_attempts || '0' }}
          TERMINAL_OUTCOME: ${{ steps.terminal_state.outputs.terminal_outcome }}
          AUTO_MERGE_ELIGIBLE: ${{ steps.merge_policy.outputs.eligible || 'false' }}
          MERGE_COMMIT_SHA: ${{ steps.merge.outputs.merge_commit_sha || '' }}
        run: |
          if [[ "$CONTINUATION_DISPATCHED" == "true" ]]; then
            STATUS="failed"; SEVERITY="warning"; VERDICT="Self-heal is continuing in another workflow round"
            TERMINAL=false; OUTCOME=repairing
          elif [[ "$TERMINAL_OUTCOME" == "merged" || "$TERMINAL_OUTCOME" == "review_ready" || "$TERMINAL_OUTCOME" == "recovered_no_change" ]]; then
            STATUS="success"; SEVERITY="ok"; VERDICT="Self-heal terminal outcome: $TERMINAL_OUTCOME"
            TERMINAL=true; OUTCOME="$TERMINAL_OUTCOME"
          elif [[ -n "$BLOCKED_REASON_FOR_REPORT" ]]; then
            STATUS="failed"; SEVERITY="critical"; VERDICT="Self-heal is blocked: $BLOCKED_REASON_FOR_REPORT"
            TERMINAL=true; OUTCOME="$TERMINAL_OUTCOME"
          else
            STATUS="success"; SEVERITY="ok"; VERDICT="Self-heal PR is ready for manual review"
            TERMINAL=true; OUTCOME=ready
          fi
          VAL_PASSED="${{ steps.terminal_state.outputs.passed }}"
          VAL_FAILED="${{ steps.terminal_state.outputs.failed }}"
          workflow_started_at=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | jq -r '.run_started_at')
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPORT_DATE=$(TZ=Asia/Taipei date -d "$workflow_started_at" +%F)
          RUN_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          payload=$(jq -n \
            --arg source_run_id "github-actions:${{ github.run_id }}:${{ github.run_attempt }}:selfheal" \
            --arg status "$STATUS" --arg run_at "$RUN_AT" --arg date "$REPORT_DATE" \
            --arg verdict_severity "$SEVERITY" --arg verdict_text "$VERDICT" \
            --argjson failed_specs "${FAILED_SPECS_FOR_REPORT:-[]}" --arg pr_url "$PR_URL_FOR_REPORT" \
            --arg root_source_run_id "${{ inputs.root_source_run_id || inputs.source_run_id || github.run_id }}" \
            --argjson repair_cycle "${{ inputs.repair_cycle || '1' }}" --argjson targeted_attempts "$TARGETED_ATTEMPTS" \
            --argjson terminal "$TERMINAL" --arg outcome "$OUTCOME" \
            --arg continuation_kind "${{ inputs.continuation_kind || 'repair' }}" \
            --arg validation_scope "${{ inputs.validation_scope || 'exact' }}" \
            --argjson infrastructure_retries "${{ inputs.infrastructure_retries || '0' }}" \
            --arg merge_policy "test_only_safe" --argjson auto_merge_eligible "$AUTO_MERGE_ELIGIBLE" \
            --argjson actually_merged "$([ -n "$MERGE_COMMIT_SHA" ] && echo true || echo false)" \
            --arg merge_commit_sha "$MERGE_COMMIT_SHA" \
            --argjson model_usage "$MODEL_USAGE" --argjson report_available "${REPORT_AVAILABLE_FOR_REPORT:-false}" \
            --argjson val_passed "$VAL_PASSED" --argjson val_failed "$VAL_FAILED" --arg workflow_url "$WORKFLOW_URL" \
            '{version: 1, source: "github_actions", source_run_id: $source_run_id, routine: "e2e-nightly",
              project: "formoria", status: $status, run_at: $run_at, date: $date,
              verdict_severity: $verdict_severity, verdict_text: $verdict_text, tickets_created: [],
              log_url: $workflow_url, data: {notification_owner: "github_actions", phase: "selfheal", root_source_run_id: $root_source_run_id,
              repair_cycle: $repair_cycle, terminal: $terminal, outcome: $outcome,
              continuation_kind: $continuation_kind, validation_scope: $validation_scope,
              infrastructure_retries: $infrastructure_retries, merge_policy: $merge_policy,
              auto_merge_eligible: $auto_merge_eligible, actually_merged: $actually_merged,
              merge_commit_sha: $merge_commit_sha,
              report_available: $report_available,
              targeted_attempts: $targeted_attempts, model_usage: $model_usage, failed_specs: $failed_specs,
              pr_url: $pr_url,
              validation: {passed: $val_passed, failed: $val_failed}, workflow_url: $workflow_url}}')
          printf '%s' "$payload" > /tmp/formoria-e2e-selfheal.json
          node scripts/agent-hub/report-run.mjs --file /tmp/formoria-e2e-selfheal.json

  selfheal-terminal:
    needs: [selfheal]
    if: >-
      always() &&
      needs.selfheal.result != 'skipped' &&
      needs.selfheal.outputs.continuation_dispatched != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install notification dependencies
        run: pnpm install --frozen-lockfile
      - name: Notify Slack of terminal self-heal outcome
        env:
          BLOCKED_REASON: ${{ needs.selfheal.outputs.blocked_reason || '' }}
          E2E_FAILED_SPECS: ${{ needs.selfheal.outputs.failed_specs || '[]' }}
          E2E_FAILED: ${{ needs.selfheal.outputs.failed || '0' }}
          E2E_PASSED: ${{ needs.selfheal.outputs.passed || '0' }}
          E2E_SKIPPED: ${{ needs.selfheal.outputs.skipped || '0' }}
          E2E_REPORT_AVAILABLE: ${{ needs.selfheal.outputs.report_available || 'false' }}
          E2E_SLACK_PHASE: ${{ needs.selfheal.outputs.terminal_outcome }}
          E2E_SLACK_LABEL: E2E Nightly (Deep)
