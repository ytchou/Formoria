name: E2E Production (Synthetic)

# Synthetic monitoring: runs the signup specs against the DEPLOYED origin, not a
# server this workflow builds. playwright.config.ts skips `webServer` entirely
# when BASE_URL is remote, so there is no `pnpm build` step here.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Origin to probe (defaults to vars.PRODUCTION_BASE_URL)"
        type: string
        default: ""

concurrency:
  # Deliberately NOT formoria-agent-writer: this workflow writes no branches and
  # must not queue behind (or cancel) the nightly self-heal writer.
  group: formoria-e2e-production
  cancel-in-progress: false

jobs:
  e2e-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      PLAYWRIGHT_TEST: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run signup synthetic checks
        id: e2e
        env:
          BASE_URL: ${{ github.event.inputs.base_url || vars.PRODUCTION_BASE_URL || 'https://formoria.com' }}
          E2E_SIGNUP_EMAIL_DOMAIN: ${{ vars.E2E_SIGNUP_EMAIL_DOMAIN }}
          # Turns on the delivery assertion in auth-signup.spec.ts. Without it the
          # spec only proves Supabase accepted the message, not that it was
          # delivered — the gap that let DEV-1300's bounces run undetected.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        run: |
          pnpm exec playwright test --project=deep --reporter=html,json \
            e2e/tests/auth-signup.spec.ts e2e/tests/auth-signup-journey.spec.ts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-production
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Notify Slack of production E2E result
        if: always()
        continue-on-error: true
        env:
          E2E_SLACK_PHASE: initial
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          SLACK_FORMORIA_WEBHOOK_URL: ${{ secrets.SLACK_FORMORIA_WEBHOOK_URL }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm exec tsx scripts/notifications/e2e-slack.ts
