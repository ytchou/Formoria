name: Formoria Health Agent Publish

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      canary_fingerprints:
        required: true
        type: string
      collect:
        required: true
        type: string
      autofix:
        required: true
        type: string
      mutate:
        required: true
        type: string
      collect_status:
        required: true
        type: string
      analyze_status:
        required: true
        type: string
      deliver_status:
        required: true
        type: string
      repair_status:
        required: true
        type: string

permissions:
  contents: read

env:
  CI: "true"

jobs:
  publish-automatic-pr:
    if: >-
      inputs.autofix == 'true' && inputs.deliver_status == 'success' &&
      inputs.repair_status == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # pinned
        with:
          client-id: ${{ secrets.HEALTH_AGENT_GITHUB_APP_ID }}
          private-key: ${{ secrets.HEALTH_AGENT_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Checkout with GitHub App token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download automatic patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: health-repair-automatic-${{ github.run_id }}-${{ github.run_attempt }}
          path: .health-agent-artifacts/automatic
      - name: Download automatic traceability metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: health-repair-batches-${{ github.run_id }}-${{ github.run_attempt }}
          path: .health-agent-artifacts/metadata
      - name: Publish automatic PR if patch exists
        env:
          BATCH_KIND: automatic
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEALTH_AGENT_WRITER_TOKEN: ${{ secrets.HEALTH_AGENT_WRITER_TOKEN }}
          HEALTH_AGENT_MODE: ${{ inputs.mode }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          set -euo pipefail
          metadata_file=.health-agent-artifacts/metadata/automatic-metadata.json
          finding_count="$(jq -er '.automatic.finding_count | select(type == "number" and floor == . and . >= 0)' "$metadata_file")"
          if [[ "$finding_count" == "0" ]]; then
            test ! -s .health-agent-artifacts/automatic/automatic.patch
            echo "No automatic findings to publish"
            exit 0
          fi
          test -s .health-agent-artifacts/automatic/automatic.patch
          validator="$RUNNER_TEMP/validate-repair-patch.sh"
          cp scripts/health-agent/validate-repair-patch.sh "$validator"
          chmod 700 "$validator"
          git config user.name "formoria-health-agent[bot]"
          git config user.email "formoria-health-agent[bot]@users.noreply.github.com"
          gh label create health-agent --description "Formoria health-agent repair" --force
          pr_labels=(--label health-agent)
          if [[ "$HEALTH_AGENT_MODE" == "canary_fix" ]]; then
            gh label create health-agent-canary --description "Controlled health-agent App canary" --force
            pr_labels+=(--label health-agent-canary)
          fi
          git switch -C "health-agent/automatic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$DEFAULT_BRANCH"
          git apply --index --binary .health-agent-artifacts/automatic/automatic.patch
          "$validator" "$metadata_file" automatic
          git reset HEAD --
          if [[ "$HEALTH_AGENT_MODE" == "canary_fix" ]]; then
            scripts/health-agent/validate-canary-patch.sh \
              .health-agent-artifacts/metadata/automatic-snapshot.json
          fi
          while IFS= read -r changed_path; do
            git add -A -- "$changed_path"
          done < <(jq -r '.automatic.traceability[].changedFiles[]' "$metadata_file" | sort -u)
          git commit -m "fix: apply automatic health repairs"
          gh auth setup-git
          git push --force-with-lease origin HEAD
          body_file=.health-agent-artifacts/automatic-pr-body.md
          {
            printf '%s\n\n' '<!-- health-agent:confirmation:v1 -->'
            printf '%s\n\n' 'Automatic health-repair batch. Traceability metadata:'
            printf '%s\n' '```json'
            cat "$metadata_file"
            printf '%s\n' '```'
          } > "$body_file"
          automatic_pr=$(gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "health-agent/automatic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "${pr_labels[@]}" \
            --title "fix: automatic health repairs" \
            --body-file "$body_file")
          echo "Automatic health-repair PR created; awaiting manager merge"
          automatic_pr_number="${automatic_pr##*/}"
          pnpm exec tsx scripts/health-agent/workflow-runtime.ts repair-result \
            --metadata "$metadata_file" \
            --merge-policy automatic \
            --lease-owner "github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --pr-number "$automatic_pr_number" \
            --pr-url "$automatic_pr" \
            --auto-merge-enabled false \
            --defer-delivery true \
            --run-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --run-id "$GITHUB_RUN_ID" \
            --output .health-agent-artifacts/automatic-pr-result.json
      - name: Upload automatic PR result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          name: health-pr-result-automatic-${{ github.run_id }}-${{ github.run_attempt }}
          path: .health-agent-artifacts/automatic-pr-result.json
          retention-days: 14

  publish-human-pr:
    if: >-
      inputs.autofix == 'true' && inputs.deliver_status == 'success' &&
      inputs.repair_status == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # pinned
        with:
          client-id: ${{ secrets.HEALTH_AGENT_GITHUB_APP_ID }}
          private-key: ${{ secrets.HEALTH_AGENT_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Checkout with GitHub App token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download human patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: health-repair-human-${{ github.run_id }}-${{ github.run_attempt }}
          path: .health-agent-artifacts/human
      - name: Download human traceability metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: health-repair-batches-${{ github.run_id }}-${{ github.run_attempt }}
          path: .health-agent-artifacts/metadata
      - name: Publish human PR if patch exists
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEALTH_AGENT_WRITER_TOKEN: ${{ secrets.HEALTH_AGENT_WRITER_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          set -euo pipefail
          metadata_file=.health-agent-artifacts/metadata/human-metadata.json
          finding_count="$(jq -er '.human.finding_count | select(type == "number" and floor == . and . >= 0)' "$metadata_file")"
          if [[ -s .health-agent-artifacts/human/human-escalation.json ]]; then
            test ! -s .health-agent-artifacts/human/human.patch
            echo "Human-only findings were escalated without a repository patch"
            exit 0
          fi
          if [[ "$finding_count" == "0" ]]; then
            test ! -s .health-agent-artifacts/human/human.patch
            echo "No human findings to publish"
            exit 0
          fi
          test -s .health-agent-artifacts/human/human.patch
          validator="$RUNNER_TEMP/validate-repair-patch.sh"
          cp scripts/health-agent/validate-repair-patch.sh "$validator"
          chmod 700 "$validator"
          git config user.name "formoria-health-agent[bot]"
          git config user.email "formoria-health-agent[bot]@users.noreply.github.com"
          gh label create health-agent --description "Formoria health-agent repair" --force
          git switch -C "health-agent/human-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$DEFAULT_BRANCH"
          git apply --index --binary .health-agent-artifacts/human/human.patch
          "$validator" "$metadata_file" human
          git reset HEAD --
          while IFS= read -r changed_path; do
            git add -A -- "$changed_path"
          done < <(jq -r '.human.traceability[].changedFiles[]' "$metadata_file" | sort -u)
          git commit -m "fix: apply human health repairs"
          gh auth setup-git
          git push --force-with-lease origin HEAD
          body_file=.health-agent-artifacts/human-pr-body.md
          {
            printf '%s\n\n' '<!-- health-agent:confirmation:v1 -->'
            printf '%s\n\n' 'Human-gated health-repair batch. Traceability metadata:'
            printf '%s\n' '```json'
            cat "$metadata_file"
            printf '%s\n' '```'
          } > "$body_file"
          human_pr=$(gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "health-agent/human-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --label health-agent \
            --title "fix: human-reviewed health repairs" \
            --body-file "$body_file")
          echo "auto_merge_enabled=false"
          human_pr_number="${human_pr##*/}"
          pnpm exec tsx scripts/health-agent/workflow-runtime.ts repair-result \
            --metadata "$metadata_file" \
            --merge-policy human \
            --lease-owner "github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --pr-number "$human_pr_number" \
            --pr-url "$human_pr" \
            --auto-merge-enabled false \
            --defer-delivery true \
            --run-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --run-id "$GITHUB_RUN_ID" \
            --output .health-agent-artifacts/human-pr-result.json
      - name: Upload human PR result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          name: health-pr-result-human-${{ github.run_id }}-${{ github.run_attempt }}
          path: .health-agent-artifacts/human-pr-result.json
          retention-days: 14

  final-report:
    name: Terminal report & confirmation
    needs: [publish-automatic-pr, publish-human-pr]
    if: >-
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       github.event_name == 'deployment_status' ||
       (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'health-agent') &&
        (vars.HEALTH_AGENT_ENABLED == 'true' ||
         contains(github.event.pull_request.labels.*.name, 'health-agent-canary'))))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
      pull-requests: read
    steps:
      - name: Checkout reporting runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download available health artifacts
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          pattern: health-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .health-agent-artifacts
      - name: Deliver one final summary
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          AGENT_HUB_INGEST_TOKEN: ${{ secrets.AGENT_HUB_INGEST_TOKEN }}
          AGENT_HUB_INGEST_URL: ${{ secrets.AGENT_HUB_INGEST_URL }}
          LINEAR_ASSIGNEE_ID: ${{ vars.LINEAR_ASSIGNEE_ID }}
          LINEAR_OAUTH_ACCESS_TOKEN: ${{ secrets.LINEAR_OAUTH_ACCESS_TOKEN }}
          LINEAR_PROJECT_ID: ${{ vars.LINEAR_PROJECT_ID }}
          LINEAR_TEAM_ID: ${{ vars.LINEAR_TEAM_ID }}
          SLACK_HEALTH_WEBHOOK_URL: ${{ secrets.SLACK_HEALTH_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          mkdir -p .health-agent-artifacts
          publish_status=success
          if [[ "${{ needs.publish-automatic-pr.result }}" == failure || "${{ needs.publish-human-pr.result }}" == failure ]]; then
            publish_status=failed
          elif [[ "${{ needs.publish-automatic-pr.result }}" == skipped && "${{ needs.publish-human-pr.result }}" == skipped ]]; then
            publish_status=skipped
          fi
          pnpm exec tsx scripts/health-agent/workflow-runtime.ts final-report \
            --mode "${{ inputs.mode }}" \
            --aggregate-artifact .health-agent-artifacts/aggregate.json \
            --queue-artifact .health-agent-artifacts/queue.json \
            --automatic-pr-result .health-agent-artifacts/automatic-pr-result.json \
            --human-pr-result .health-agent-artifacts/human-pr-result.json \
            --collect-status "${{ inputs.collect_status }}" \
            --analyze-status "${{ inputs.analyze_status }}" \
            --deliver-status "${{ inputs.deliver_status }}" \
            --repair-status "${{ inputs.repair_status }}" \
            --publish-status "$publish_status" \
            --run-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --run-id "$GITHUB_RUN_ID" \
            --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output .health-agent-artifacts/final-report.json
      - name: Upload terminal report
        if: >-
          always() && (github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          name: health-final-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .health-agent-artifacts/final-report.json
          retention-days: 14
      - name: Prepare redacted confirmation audit
        if: github.event_name == 'deployment_status' || github.event_name == 'pull_request'
        env:
          HEALTH_CONFIRMATION_AUDIT_PATH: .health-agent-artifacts/confirmation-audit.json
        run: >-
          node -e "require('node:fs').mkdirSync('.health-agent-artifacts',{recursive:true});
          require('node:fs').writeFileSync(process.env.HEALTH_CONFIRMATION_AUDIT_PATH,
          JSON.stringify({status:'started'})+'\n')"
      - name: Confirm merged health PR deployment
        if: github.event_name == 'deployment_status' || github.event_name == 'pull_request'
        env:
          AGENT_HUB_INGEST_TOKEN: ${{ secrets.AGENT_HUB_INGEST_TOKEN }}
          AGENT_HUB_INGEST_URL: ${{ secrets.AGENT_HUB_INGEST_URL }}
          FORMORIA_RAILWAY_URL: ${{ vars.FORMORIA_RAILWAY_URL }}
          HEALTH_AGENT_READER_TOKEN: ${{ secrets.HEALTH_AGENT_READER_TOKEN }}
          HEALTH_AGENT_WRITER_TOKEN: ${{ secrets.HEALTH_AGENT_WRITER_TOKEN }}
          HEALTH_CONFIRMATION_AUDIT_PATH: .health-agent-artifacts/confirmation-audit.json
          HEALTH_CONFIRMATION_SOURCE_RUN_ID: github-actions:health-confirmation:${{ github.run_id }}:${{ github.run_attempt }}
          HEALTH_CONFIRMATION_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LINEAR_ASSIGNEE_ID: ${{ secrets.LINEAR_ASSIGNEE_ID }}
          LINEAR_OAUTH_ACCESS_TOKEN: ${{ secrets.LINEAR_OAUTH_ACCESS_TOKEN }}
          LINEAR_PROJECT_ID: ${{ secrets.LINEAR_PROJECT_ID }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SENTRY_BASE_URL: ${{ vars.SENTRY_BASE_URL }}
          SENTRY_RESOLVER_TOKEN: ${{ secrets.SENTRY_RESOLVER_TOKEN }}
          SLACK_HEALTH_WEBHOOK_URL: ${{ secrets.SLACK_HEALTH_WEBHOOK_URL }}
        run: pnpm exec tsx scripts/health-agent/confirmation.ts
      - name: Upload redacted confirmation audit
        if: >-
          always() && (github.event_name == 'deployment_status' ||
          github.event_name == 'pull_request')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: health-confirmation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .health-agent-artifacts/confirmation-audit.json
          retention-days: 14
