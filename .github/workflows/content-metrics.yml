name: Content Metrics

on:
  schedule:
    - cron: '0 6 * * 6'
  workflow_dispatch:

concurrency:
  group: content-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      AGENT_HUB_SUPABASE_URL: ${{ secrets.AGENT_HUB_SUPABASE_URL }}
      AGENT_HUB_SUPABASE_SERVICE_KEY: ${{ secrets.AGENT_HUB_SUPABASE_SERVICE_KEY }}
      TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: collect-metrics-and-generate-digest
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_PROMPT: |
            Query content_items for project 'formoria' with status 'published'.
            Env vars AGENT_HUB_SUPABASE_URL and AGENT_HUB_SUPABASE_SERVICE_KEY are set. Read/write content_items via the Supabase REST API with curl: GET "$AGENT_HUB_SUPABASE_URL/rest/v1/content_items?project=eq.formoria&status=eq.published&select=id,title,item_path,published_urls,metrics"; update rows with PATCH to /rest/v1/content_items?id=eq.<id> (Content-Type: application/json, Prefer: return=minimal); always send headers apikey and Authorization: Bearer with the service key. Create Todoist tasks via POST https://api.todoist.com/rest/v2/tasks with Authorization: Bearer $TODOIST_API_TOKEN (skip silently if empty). Never print the secret values. Work autonomously; never ask questions.
            For each published item with published_urls, fetch PostHog pageview metrics for those URLs using NEXT_PUBLIC_POSTHOG_KEY and POSTHOG_PERSONAL_API_KEY. Update content_items.metrics with the latest data. Write a summary report to marketing/strategy/sense-report.md. Also check for 'ready' items past target_date — create a Todoist task with a digest (use GitHub file URLs, never localhost).
        run: |
          npx @anthropic-ai/claude-code --print --dangerously-skip-permissions "$CLAUDE_PROMPT"

      # This step used to `git push` straight to main, which branch protection
      # rejects with GH006 — and which contradicts the project's own rule that
      # every change lands via a PR. Route the report through a branch and a PR
      # with the same App identity the other content workflows use, rather than
      # granting a protection bypass that would restore the direct-to-main path
      # (DEV-1383).
      - name: app-token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.0.0
        with:
          app-id: ${{ secrets.HEALTH_AGENT_GITHUB_APP_ID }}
          private-key: ${{ secrets.HEALTH_AGENT_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: commit-report
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git add marketing/strategy/sense-report.md
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          BRANCH="content/metrics-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "content(metrics): weekly report $(date +%Y-%m-%d)"
          # The branch name is derived from the date, so a same-day rerun collides
          # with the branch the previous attempt pushed and is rejected
          # non-fast-forward. Plain push first (the common path, where the branch is
          # new); only on rejection fetch the ref so --force-with-lease has a lease
          # to check, then replace it. Ordering it this way keeps the first push off
          # --force-with-lease, which refuses when there is no remote-tracking ref.
          git push -u origin "$BRANCH" || {
            git fetch origin "$BRANCH"
            git push --force-with-lease -u origin "$BRANCH"
          }
          gh pr create --title "Content metrics: $(date +%Y-%m-%d)" \
            --body "Auto-generated weekly metrics report." \
            --label "content"
