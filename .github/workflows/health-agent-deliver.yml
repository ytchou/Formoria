name: Formoria Health Agent Deliver

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      canary_fingerprints:
        required: true
        type: string
      collect:
        required: true
        type: string
      autofix:
        required: true
        type: string
      mutate:
        required: true
        type: string

permissions:
  contents: read

env:
  CI: "true"

jobs:
  aggregate-and-deliver:
    name: Aggregate findings
    if: inputs.collect == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        if: inputs.collect == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable pnpm
        if: inputs.collect == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
      - name: Install dependencies
        if: inputs.collect == 'true'
        run: pnpm install --frozen-lockfile
      - name: Download link artifact
        if: inputs.collect == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: health-link-${{ github.run_id }}-${{ github.run_attempt }}
          path: .health-agent-artifacts
      - name: Download Directory artifact
        if: inputs.collect == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: health-directory-${{ github.run_id }}-${{ github.run_attempt }}
          path: .health-agent-artifacts
      - name: Download Sentry artifact
        if: inputs.collect == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: health-sentry-${{ github.run_id }}-${{ github.run_attempt }}
          path: .health-agent-artifacts
      - name: Download brand review artifact
        if: inputs.collect == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: health-brand-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: .health-agent-artifacts
      - name: Aggregate findings and sync Linear once
        if: inputs.collect == 'true'
        env:
          HEALTH_AGENT_ENABLED: ${{ vars.HEALTH_AGENT_ENABLED }}
          HEALTH_AUTOFIX_ENABLED: ${{ vars.HEALTH_AUTOFIX_ENABLED }}
          LINEAR_ASSIGNEE_ID: ${{ vars.LINEAR_ASSIGNEE_ID }}
          LINEAR_OAUTH_ACCESS_TOKEN: ${{ secrets.LINEAR_OAUTH_ACCESS_TOKEN }}
          LINEAR_PROJECT_ID: ${{ vars.LINEAR_PROJECT_ID }}
          LINEAR_TEAM_ID: ${{ vars.LINEAR_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p .health-agent-artifacts
          run_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pnpm exec tsx scripts/health-agent/workflow-runtime.ts aggregate-and-deliver --mode "${{ inputs.mode }}" \
            --link-artifact .health-agent-artifacts/link-checker.json \
            --directory-artifact .health-agent-artifacts/directory-health.json \
            --sentry-artifact .health-agent-artifacts/sentry-triage.json \
            --brand-review-artifact .health-agent-artifacts/brand-review.json \
            --defer-delivery true \
            --run-at "$run_at" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --run-id "$GITHUB_RUN_ID" \
            --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --audit .health-agent-artifacts/aggregate-audit.json \
            --output .health-agent-artifacts/aggregate.json
      - name: Upload aggregate artifact
        if: always() && inputs.collect == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          name: health-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .health-agent-artifacts/aggregate.json
            .health-agent-artifacts/aggregate-audit.json
          retention-days: 14

  cleanup-stale-branches:
    needs: [aggregate-and-deliver]
    if: >-
      always() && inputs.mode == 'live' &&
      inputs.mutate == 'true' &&
      needs.aggregate-and-deliver.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # pinned
        with:
          client-id: ${{ secrets.HEALTH_AGENT_GITHUB_APP_ID }}
          private-key: ${{ secrets.HEALTH_AGENT_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Checkout cleanup runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download aggregate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: health-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .health-agent-artifacts
      - name: Revalidate and remove eligible stale branches
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/health-agent/workflow-runtime.ts cleanup-stale-branches \
            --aggregate-artifact .health-agent-artifacts/aggregate.json \
            --mode live \
            --run-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --run-identity "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --run-id "$GITHUB_RUN_ID" \
            --audit .health-agent-artifacts/stale-branch-cleanup-audit.json \
            --output .health-agent-artifacts/stale-branch-cleanup.json
      - name: Upload stale-branch cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          name: health-stale-branch-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .health-agent-artifacts/stale-branch-cleanup.json
            .health-agent-artifacts/stale-branch-cleanup-audit.json
          retention-days: 14

  enqueue-and-claim:
    needs: [aggregate-and-deliver, cleanup-stale-branches]
    if: >-
      always() && inputs.mutate == 'true' &&
      inputs.autofix == 'true' &&
      needs.aggregate-and-deliver.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HEALTH_AGENT_ENABLED: ${{ vars.HEALTH_AGENT_ENABLED }}
      HEALTH_AUTOFIX_ENABLED: ${{ vars.HEALTH_AUTOFIX_ENABLED }}
      HEALTH_AGENT_READER_TOKEN: ${{ secrets.HEALTH_AGENT_READER_TOKEN }}
      HEALTH_AGENT_WRITER_TOKEN: ${{ secrets.HEALTH_AGENT_WRITER_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download aggregate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: health-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .health-agent-artifacts
      - name: Enqueue and claim all eligible findings
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/health-agent/workflow-runtime.ts enqueue-and-claim \
            --findings-artifact .health-agent-artifacts/aggregate.json \
            --mode "${{ inputs.mode }}" \
            --lease-owner "github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --canary-fingerprints "${{ inputs.canary_fingerprints }}" \
            --output .health-agent-artifacts/queue.json
      - name: Upload queue batch artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          name: health-queue-${{ github.run_id }}-${{ github.run_attempt }}
          path: .health-agent-artifacts/queue.json
          retention-days: 14

  prepare-repair-batches:
    needs: [enqueue-and-claim]
    if: >-
      always() && inputs.mutate == 'true' &&
      needs.enqueue-and-claim.result == 'success' &&
      inputs.autofix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download queue artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: health-queue-${{ github.run_id }}-${{ github.run_attempt }}
          path: .health-agent-artifacts
      - name: Snapshot automatic batch
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/health-agent/workflow-runtime.ts repair-snapshot \
            --input .health-agent-artifacts/queue.json \
            --batch automatic \
            --output .health-agent-artifacts/automatic-snapshot.json
      - name: Snapshot human batch
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/health-agent/workflow-runtime.ts repair-snapshot \
            --input .health-agent-artifacts/queue.json \
            --batch human \
            --output .health-agent-artifacts/human-snapshot.json
      - name: Prepare automatic repair metadata
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/health-agent/workflow-runtime.ts repair-metadata \
            --snapshot .health-agent-artifacts/automatic-snapshot.json \
            --output .health-agent-artifacts/automatic-metadata.json
      - name: Prepare human repair metadata
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/health-agent/workflow-runtime.ts repair-metadata \
            --snapshot .health-agent-artifacts/human-snapshot.json \
            --output .health-agent-artifacts/human-metadata.json
      - name: Prepare redacted repair audit
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/health-agent/workflow-runtime.ts repair-audit \
            --snapshot .health-agent-artifacts/automatic-snapshot.json \
            --metadata .health-agent-artifacts/automatic-metadata.json \
            --output .health-agent-artifacts/automatic-audit.json
          pnpm exec tsx scripts/health-agent/workflow-runtime.ts repair-audit \
            --snapshot .health-agent-artifacts/human-snapshot.json \
            --metadata .health-agent-artifacts/human-metadata.json \
            --output .health-agent-artifacts/human-audit.json
      - name: Upload separate repair batches
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          name: health-repair-batches-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .health-agent-artifacts/automatic-snapshot.json
            .health-agent-artifacts/automatic-metadata.json
            .health-agent-artifacts/automatic-audit.json
            .health-agent-artifacts/human-snapshot.json
            .health-agent-artifacts/human-metadata.json
            .health-agent-artifacts/human-audit.json
          retention-days: 14
