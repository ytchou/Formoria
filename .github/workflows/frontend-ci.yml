name: CI

on:
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [lint, type-check, unit-changed]
    permissions:
      contents: read
    steps:
      - name: Check out pull request merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          # unit-changed resolves HEAD~1 (the base tip of the merge commit); the
          # default depth of 1 leaves it unfetched, so vitest --changed sees an
          # empty diff and passes with zero tests.
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check service registry coverage
        run: pnpm check:service-registry
      - name: Run ${{ matrix.check }}
        run: |
          case "${{ matrix.check }}" in
            lint)
              node scripts/check-favicon-rgba.mjs
              node scripts/check-event-registry.mjs
              # Ahead of `pnpm lint`, which is an `&&` chain: a failure in an
              # earlier link silently skips every check after it, so a gate that
              # only lives inside the chain can go unrun without anyone noticing.
              node scripts/check-e2e-timeouts.mjs
              pnpm lint
              ;;
            type-check)
              pnpm tsc --noEmit
              ;;
            unit-changed)
              pnpm vitest run --changed HEAD~1
              ;;
          esac

  quality-gate:
    name: Quality
    if: always()
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - name: Check quality results
        run: |
          if [[ "${{ needs.quality.result }}" != "success" ]]; then
            echo "Quality checks failed: ${{ needs.quality.result }}"
            exit 1
          fi

  build:
    name: Build
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Supabase credentials live as environment secrets, and GitHub injects those
    # only into a job that names its environment. Without this line every
    # `secrets.*` below resolves to an empty string and the build aborts on the
    # first prerendered route with "supabaseUrl is required".
    # Staging, never production: a pull_request job must not reach live data,
    # and that holds for a promotion PR into main too — its commits were already
    # verified here.
    environment: Formoria / staging
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out pull request merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Production build
        run: pnpm build
        env:
          # Real credentials, not placeholders: story routes are SSG, and their
          # MDX shortcodes (EventInfo, BrandGallery, BrandList) throw rather
          # than degrade when a fetch fails, so prerendering aborts the whole
          # build without a reachable database. The same three secrets already
          # feed the deployed staging E2E and release checks, so this adds no
          # new exposure — and it makes a green Build mean deployable, which
          # the placeholder values never did.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
