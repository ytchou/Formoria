name: Release source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  release-source:
    name: Release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check release source
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          policy_path="$RUNNER_TEMP/release-flow.json"
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/release-flow.json?ref=$DEFAULT_BRANCH" --jq '.content' | base64 --decode > "$policy_path"
          RELEASE_FLOW_POLICY_PATH="$policy_path" node scripts/check-release-source.mjs
