name: Release source

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  release-source:
    name: Release source
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs trusted workflow code, and this explicit ref keeps
      # the guard itself on the repository's default branch rather than the PR merge.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check release source
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          policy_path="$RUNNER_TEMP/release-flow.json"
          policy_error="$RUNNER_TEMP/release-flow-error.txt"
          if ! policy_content="$(gh api --method GET "repos/$GITHUB_REPOSITORY/contents/.github/release-flow.json" -f "ref=$DEFAULT_BRANCH" --jq '.content' 2>"$policy_error")"; then
            if ! grep -q "HTTP 404" "$policy_error"; then
              cat "$policy_error" >&2
              exit 1
            fi
            # The first release bootstraps policy from its protected, same-repository source.
            if [[ "$GITHUB_HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
              echo "Release policy bootstrap is limited to branches in $GITHUB_REPOSITORY" >&2
              exit 1
            fi
            policy_content="$(gh api --method GET "repos/$GITHUB_REPOSITORY/contents/.github/release-flow.json" -f "ref=$GITHUB_HEAD_SHA" --jq '.content')"
          fi
          printf '%s' "$policy_content" | base64 --decode > "$policy_path"
          RELEASE_FLOW_POLICY_PATH="$policy_path" node scripts/check-release-source.mjs
